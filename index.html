<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEANLINE Management</title>
<link rel="manifest" href="manifest-management.webmanifest">
<meta name="theme-color" content="#e6e8ec">
<link rel="apple-touch-icon" href="apple-touch-icon-mg.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Management">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23636469'/%3E%3Cpath d='M12 34V21a6 6 0 0 1 6-6h3a6 6 0 0 1 6 6v6a6 6 0 0 0 6 6h4' fill='none' stroke='%2394d30a' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left sidebar + one scrolling work column (max 1240px). Pages: วันนี้ (dark summary card, to-do, notifications, department, tools) · งานทั้งหมด · หน้างาน · เปิดงาน · ลูกค้า · ตั้งค่า. Single light theme by choice: the brand's dark card sits on a light ground. */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 15.5px/1.5 var(--f);font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
.logo{display:flex;flex-direction:column;gap:8px;text-decoration:none}
.logo img{height:auto;display:block}
.logo span{font-size:12px;letter-spacing:.16em;font-weight:600}
.nav{display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;padding:0 8px;text-decoration:none}
.nav a svg{flex:none}
.nav .c{margin-left:auto;font-size:14px;color:var(--mut2)}
.nav .b{margin-left:auto;min-width:20px;height:20px;padding:0 8px;border-radius:10px;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:8px;border-radius:12px}


.me b{display:block;font-weight:600}
.me small{font-size:14px;color:var(--mut)}
.pmlogo{margin:2px 8px 0}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--sf);box-shadow:var(--shBtn)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;}
.btn.dk{font-weight:600;}

.btn.lime{font-weight:600;}

.btn.bad{color:var(--crit)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.seg button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.pad{padding:24px 24px}
.hd{display:flex;align-items:center;gap:8px}
.hd h2{margin:0}
.hd .r{margin-left:auto;font-size:14px;text-decoration:none;cursor:pointer;background:none;border:0}
h1{margin:0;font-weight:600;letter-spacing:-.02em}
.muted{color:var(--mut)}
.sub{font-size:14px;color:var(--mut)}
/* dark summary card */
.hro{color:#f4f5f7;padding:28px 32px;flex-direction:column;gap:24px;}
.tile{min-width:128px;padding:16px 16px;border-radius:16px;background:#25262b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.tile b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tile span{font-size:14px;color:#6b6e79}
.slot{position:absolute;top:7px;bottom:7px;background:#2a2c31;padding:8px 8px;overflow:hidden;text-decoration:none;color:inherit}
.slot.ins{background:#33401a;box-shadow:inset 0 0 0 1px rgba(201,242,90,.3)}
.slot b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot span{font-size:14px;color:#6b6e77;white-space:nowrap}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--limeL);border-radius:1px;box-shadow:0 0 10px rgba(201,242,90,.7)}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);flex:1 1 220px}
.prog i{display:block;height:100%;border-radius:2px;background:var(--limeL);box-shadow:0 0 10px rgba(201,242,90,.5)}
/* lists */
.box{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #c2c4ca}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;font-size:14px;font-weight:600;}

.team{font-size:12px;font-weight:600;padding:1px 8px;border-radius:5px;}

.note{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 20px;border-top:1px solid var(--ln);text-decoration:none}
.note .i{width:34px;height:34px;border-radius:10px;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.note .i.w{background:#f5f4fa;color:#3d7c0e}
.note .i.g{background:var(--okBg);color:var(--ok)}
.empty{padding:28px 20px;text-align:center;color:var(--mut)}
.phase{all:unset;cursor:pointer;background:var(--sf);border-radius:16px;padding:16px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh)}
.phase.on{box-shadow:0 0 0 2px var(--ink),var(--sh)}
.phase .t{display:flex;align-items:center;gap:8px;font-size:14px;color:#55575e;font-weight:500}
.phase .n{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tool{display:flex;gap:16px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--sf);text-decoration:none;box-shadow:var(--sh)}
.tool .ic{width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 4px 10px -4px rgba(16,17,20,.3)}
.tool .ic svg{width:20px;height:20px}
.tool b{display:block;font-weight:600;font-size:16px}
.tool span{font-size:14px;color:var(--mut);line-height:1.45}
.seg{display:inline-flex;gap:2px}
.seg button{height:32px;padding:0 12px;border:0;background:transparent;cursor:pointer}
.seg button.on{font-weight:600}
.seg button .n{color:var(--mut2);margin-left:4px}

.jobs{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 120px 90px;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--ln);text-decoration:none;cursor:pointer}
.row:hover{background:#f0f7e6}
.row .st{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .st b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{justify-self:end}
@media (max-width:820px){
  .row{grid-template-columns:1fr auto}
  .row .st,.row .kw{display:none}
}
/* job page */
.crumb a{color:var(--mut);text-decoration:none}
.crumb b{color:var(--ink);font-weight:500}
.cols{display:flex;flex-wrap:wrap;gap:20px}
.colL{flex:999 1 540px;min-width:0;display:flex;flex-direction:column;gap:16px}
.colR{flex:1 1 320px;max-width:390px;display:flex;flex-direction:column;gap:16px}
.act{background:var(--sf);padding:24px;display:flex;flex-direction:column;gap:16px}
.act h2{margin:0;font-size:16px;font-weight:600}
.pbar{height:6px;border-radius:3px;background:#eef0f2;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lime)}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.need li{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 8px;border-radius:9px;background:#fff8f2}
.need li .k{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #c2c4ca;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.need li.ok{background:transparent;color:var(--mut)}
.need li.ok .k{background:var(--lime);box-shadow:none;color:var(--limeInk)}
.btns{display:flex;flex-direction:column;gap:8px}
.sec{background:var(--sf);padding:24px 24px;box-shadow:var(--sh)}
.sec h2{margin:0 0 16px;font-size:16px;font-weight:600}
.sec h2 .tg{font-size:12px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--mut);min-width:0}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{height:40px;padding:0 12px;border:0;color:var(--ink);font-size:16px;width:100%}
.fld textarea{height:auto;min-height:72px;padding:8px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:#fff;outline:0}
.fld.chk{flex-direction:row;align-items:center;gap:8px;font-size:16px;color:var(--ink);grid-column:1/-1}
.fld.chk input{width:18px;height:18px;accent-color:#458c10}
.formh{grid-column:1/-1;font-size:14px;font-weight:600;color:var(--mut2);padding-top:8px;border-top:1px solid var(--ln);margin-top:4px}
.save{display:none;margin-top:16px;gap:8px}
.sec.dirty .save{display:flex}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid #8a8d95;border-bottom:2px solid #8a8d95;transform:rotate(45deg);transition:transform .15s}
details.sec[open]>summary{margin-bottom:16px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>summary .sm{font-size:14px;font-weight:400;color:var(--mut)}
.tl{display:flex;flex-direction:column;gap:12px}
.tl div{display:grid;grid-template-columns:12px 1fr;gap:12px}
.tl i{width:8px;height:8px;margin-top:8px;border-radius:50%;background:#c2c4ca}
.tl div:first-child i{background:var(--lime)}
.tl small{display:block;font-size:14px;color:var(--mut2)}
.tbl{font-size:16px}
.tbl td{vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:50;max-width:90vw}
.banner{padding:12px 16px;border-radius:12px;background:var(--okBg);color:var(--ok)}
.modalbg{position:fixed;inset:0;background:rgba(16,17,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--sf);padding:24px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px}
.xbar{height:6px;border-radius:3px;background:#eef0f2;overflow:hidden}
.xbar i{display:block;height:100%;background:var(--lime);width:0}
@media (max-width:900px){
  .side{position:static;height:auto;flex-basis:100%}
  .shell{flex-wrap:wrap}
  main{padding:8px 16px 40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
.qd{background:#fff;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.qd.out{background:#fafbfb}
.qd.sun{background:#f7f8f9}
.qd.today{box-shadow:inset 0 0 0 2px #458c10}
.qf{margin-left:auto;font-size:12px;color:#3d7c0e;background:#fde8e8;border-radius:6px;padding:2px 8px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.lg.s{background:#16171a}
.lg.p{background:#fff;box-shadow:inset 0 0 0 1px #c3c5ca}
.lg.i{background:#e4e4e8}
.sumcard{display:flex;flex-direction:column;gap:0}
.sblk{padding:16px 0;border-top:1px solid #eef0f2;display:flex;flex-direction:column;gap:12px}
.sumcard h2+.sblk{border-top:0;padding-top:16px}
.sblk .sh{display:flex;align-items:center;gap:8px}
.sblk h3{margin:0;font-size:16px;font-weight:600}
.lnk{all:unset;cursor:pointer;margin-left:auto;font-size:14px;color:#3d7c0e;padding:4px 8px;border-radius:8px}
.lnk:hover{background:#ebf5dd}
.lnk:focus-visible{outline:2px solid #458c10}
.kvg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.kv{display:flex;flex-direction:column;gap:4px;min-width:0}
.kv.full{grid-column:1/-1}
.kv span{font-size:14px;color:var(--mut)}
.kv b{font-size:16px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.sumcard .sec.editing{box-shadow:none;outline:1px solid #e3e5e8;margin:8px 0}
.crow{display:grid;grid-template-columns:44px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:center;text-decoration:none;color:inherit}
.crow:first-child{border-top:0}
.crow:hover{background:var(--hv)}
.crow .cn,.crow .cj{display:flex;flex-direction:column;gap:4px;min-width:0}
.crow .cn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cj{align-items:flex-start}
.crow .cp{display:flex;align-items:center;gap:8px;font-size:16px}
.tag.dk{background:#16171a;color:#fff}
@media (max-width:900px){
  .kvg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crow{grid-template-columns:40px 1fr}
  .crow .cp,.crow .cj{grid-column:2}
}
.mgrp{display:flex;flex-direction:column;gap:8px}
.mh{display:flex;align-items:baseline;gap:8px;padding:8px 4px 0}
.mh h2{margin:0;font-size:16px;font-weight:600}
.crow .dt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;line-height:1.1}
.crow .dt b{font-size:16px;font-weight:600}
.crow .dt span{font-size:12px;color:var(--mut)}
.crow .nm{font-size:16px;color:var(--ink2)}
.crow .nm.miss{color:#6a6e77;font-size:14px}
.appw{position:relative;flex:0 0 auto}
.appbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:repeat(3,4px);gap:4px;place-content:center}
.appbtn i{width:4px;height:4px;border-radius:50%;background:#55575e}
.appbtn:hover,.appbtn[aria-expanded="true"]{background:#e6e8eb}
.appbtn:focus-visible{outline:2px solid #458c10;outline-offset:2px}
.apppan{position:absolute;right:0;top:48px;z-index:50;width:320px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px rgba(20,22,26,.16);display:flex;flex-direction:column;gap:8px}
.apph{font-size:14px;color:var(--mut);padding:2px 8px}
.appg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.appi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:14px;text-decoration:none;color:var(--ink);text-align:center}
.appi:hover,.appi:focus-visible{background:var(--hv);outline:none}
.appi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.appi .ic svg{width:22px;height:22px}
.appi b{font-size:14px;font-weight:600}
.appi small{font-size:12px;color:var(--mut);line-height:1.3}
.appi.soon{opacity:.7;cursor:default}
.appi.soon:hover{background:none}
.hh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:32px;align-items:center}
.hkpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.hempty{padding:28px 20px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
@media (max-width:1100px){
  .hh{grid-template-columns:1fr}
  .hkpi{grid-template-columns:repeat(2,1fr)}
}
.hsb{position:absolute;left:0;right:0;top:10px;display:flex;align-items:center;gap:16px;padding:8px 12px 8px 16px;border-radius:16px;background:rgba(27,28,32,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#f4f5f7;box-shadow:0 12px 30px -12px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .18s,transform .18s}
.hsb.on{opacity:1;transform:none;pointer-events:auto}
.hsb .btn.sm{flex:none}
@media (prefers-reduced-motion:reduce){
  .hsb{transition:none}
}
.nsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.nform{display:flex;flex-direction:column;gap:24px}
.ngrp{display:flex;flex-direction:column;gap:12px}
.ngrp h2{margin:0;font-size:16px}
.ngrp>textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--hv);padding:8px 12px;font:inherit;font-size:16px;resize:vertical}
.ngrp>textarea:focus{outline:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--lime)}
.opt{font-size:12px;color:var(--mut2);font-weight:400;margin-left:4px}
.maphelp{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ncal{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
.nch{display:flex;align-items:center;justify-content:space-between}
.nch h2{margin:0;font-size:16px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{font-size:14px;color:var(--mut);text-align:center;padding-bottom:2px}
.cd{all:unset;box-sizing:border-box;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:16px;transition:transform .08s}
.cd b{font-weight:600}
.cd span{font-size:12px;white-space:nowrap;overflow:hidden;max-width:92%;text-overflow:ellipsis}
.cd.free{background:#ebf5dd;color:#2f4d00}
.cd.free span{color:#3d7c0e}
.cd.one{background:#f5f4fa;color:#3d7c0e}
.cd.full{background:#f3f4f6;color:#a3a6ad}
.cd.off{background:repeating-linear-gradient(135deg,#f3f4f6 0 6px,#eceef1 6px 12px);color:#a3a6ad}
.cd.past,.cd.out{color:#c3c5ca;cursor:default}
.cd[disabled]{cursor:default}
.cd:not([disabled]):hover{transform:translateY(-1px);box-shadow:0 0 0 1.5px #458c10}
.cd.sel{background:#16171a !important;color:#fff !important}
.cd.sel span{color:#dcfce7 !important}
.cd:focus-visible{outline:2px solid #458c10;outline-offset:2px}
.clg{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--mut)}
.clg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.clg .free{background:#cdeb8f}
.clg .one{background:#ffd9a0}
.clg .full{background:#e3e5e8}
.clg .off{background:repeating-linear-gradient(135deg,#e3e5e8 0 3px,#f3f4f6 3px 6px)}
.cslot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--ln)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{all:unset;box-sizing:border-box;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px #dfe1e5}
.slot small{font-size:12px;font-weight:400}
.slot:hover:not([disabled]){box-shadow:inset 0 0 0 1.5px #458c10}
.slot.on{background:#458c10;color:#17202b;box-shadow:none}
.slot[disabled]{color:#b3b5bb;background:#f6f7f8;cursor:default;box-shadow:none}
.slot:focus-visible{outline:2px solid #458c10;outline-offset:2px}
.nsub{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--ln)}
.nsum{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.nsum b{font-size:16px}
.nsub .btn[aria-disabled="true"]{opacity:.5}
.nmiss{color:#a34b08}
.qreq{display:flex;align-items:baseline;gap:8px;background:#16171a;color:#fff;border-radius:12px;padding:12px 16px}
.qreq b{font-size:16px}
.qreq span{color:#dcfce7;font-weight:600}
.svl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.svl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:8px 0;position:relative}
.svl li:not(:last-child)::before{content:"";position:absolute;left:12px;top:34px;bottom:-6px;width:2px;background:#eceef1}
.svl li.ok:not(:last-child)::before{background:#458c10}

.gol .glr{display:grid;gap:8px;margin:4px 0 12px}
.gol .glh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.gol .glh span{color:var(--mut);font-size:14px}
.gol .glh b{font-size:20px;font-variant-numeric:tabular-nums}
.gol .glh b em{font-style:normal;font-size:14px;font-weight:500;color:var(--mut)}
.gol .glb{height:8px;border-radius:999px;background:#eef0f3;overflow:hidden}
.gol .glb i{display:block;height:100%;border-radius:inherit;background:#458c10;transition:width .5s ease}
.gol .glb.ok i{background:#16a34a}
.gol .gln{margin:0 0 8px;font-size:13px;color:var(--mut)}
.gol .gln.ok{color:#15803d;font-weight:600}
.gform{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.gform label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.gform input{width:140px;height:40px;padding:0 12px;border:1px solid #e6e5ef;border-radius:10px;background:#fff;font-variant-numeric:tabular-nums}
html.vtg .pg{view-transition-name:pgv}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(pgv){animation:vtOut .12s ease both}
::view-transition-new(pgv){animation:vtIn .2s ease both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.svok{animation:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media (max-width:640px){.jnav>span{min-width:36px}.drhb{gap:4px}
  .tqb>select.sel:nth-child(4){grid-column:1/-1}
  .tqb>.jst{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
  .tqb>.aglg{grid-column:1/-1;justify-content:flex-end;font-size:12px}
  .jt tbody tr.ag1{box-shadow:inset 4px 0 0 #f59e0b}.jt tbody tr.ag2{box-shadow:inset 4px 0 0 #dc2626}
  .jt tbody tr.ag1>td:first-child,.jt tbody tr.ag2>td:first-child{box-shadow:none}}
</style></head>

/* ---------- db ---------- */
async function w(path,data,mode='update',note){
  if(!S.db){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้');throw new Error('no db')}
  const meta=logMeta(path,mode);
  try{const r=await S.db.doc(path)[mode](data);logPut(meta,data,note);return r}
  catch(e){toast(e?.code==='invalid_argument'?'บันทึกไม่ได้: บัญชีนี้ยังไม่มีสิทธิ์แก้ไขข้อมูล':['denied','not-found','busy','network','maintenance','pending'].includes(e?.code)?'บันทึกไม่ได้: '+e.message:'บันทึกไม่สำเร็จ ('+(e?.code||'error')+') ลองอีกครั้ง');throw e}
}
/* ---------- audit log: ใครทำอะไร เมื่อไหร่ (collection logs) ---------- */
const COLN={jobs:'งาน',customers:'ลูกค้า',sites:'ไซต์',products:'รุ่นสินค้า',members:'ผู้ใช้',config:'ตั้งค่า',articles:'บทความ',services:'งานบริการ',forms:'แบบฟอร์ม',meters:'การจองสมาร์ทมิเตอร์'};
function logMeta(path,mode){
  const [col,id]=String(path).split('/');if(!COLN[col])return null;const o=(S[col]||{})[id];
  const ttl=!o?'':col==='jobs'?(o.title||cOf(o).name||''):col==='customers'?(o.name||realName(o)):col==='sites'?o.label:col==='products'?o.model:col==='forms'?o.name:col==='meters'?o.title:col==='articles'?o.title:col==='members'?nm(id):col==='services'?((mainJob(o.siteId)||{}).title||''):'';
  return {col,id,ttl:ttl||'',act:mode==='delete'?'del':(mode==='set'&&!o)?'new':'edit'};
}
function logPut(meta,data,note){
  if(!meta||!S.db)return;const A={new:'สร้าง',edit:'แก้ไข',del:'ลบ'};
  const ttl=meta.ttl||(data&&(data.title||data.name||data.model||data.label))||'';
  const fields=data&&meta.act!=='del'?Object.keys(data).filter(k=>!['updatedAt','createdAt','history','by','createdBy'].includes(k)).slice(0,15):[];
  logRaw(meta.act,note||(A[meta.act]+COLN[meta.col]+(ttl?' '+ttl:'')),{col:meta.col,docId:meta.id,title:String(ttl).slice(0,140),fields});
}
function logRaw(act,text,extra={}){
  if(!S.db)return;
  try{S.db.doc('logs/'+S.db.collection('logs').doc().id).set({at:Date.now(),by:S.me.id||null,name:S.names[S.me.id]||'',act,text:String(text||'').slice(0,300),...extra}).catch(()=>{})}catch(e){}
}

/* เลขใบงานไม่ซ้ำ: จองเลขใน jobnos/<เลข> แล้วอ่านกลับ ถ้ามีคนจองทับก็ขยับเลขถัดไป */
const bumpNo=no=>no.slice(0,4)+String((+no.slice(4)||0)+1).padStart(3,'0');
const snapData=sn=>{if(!sn)return null;const ex=typeof sn.exists==='function'?sn.exists():sn.exists;return ex===false?null:(sn.data?sn.data():null)};
async function claimJobNo(jid){
  let no=nextJobNo();
  for(let a=0;a<10;a++){
    if(Object.values(S.jobs).some(x=>x.id!==jid&&x.jobNo===no)){no=bumpNo(no);continue}
    try{
      const ref=S.db.doc('jobnos/'+no);const cur=snapData(await ref.get());
      if(cur&&cur.jid&&cur.jid!==jid){no=bumpNo(no);continue}
      await ref.set({jid,at:Date.now(),by:S.me.id||null});
      await new Promise(r=>setTimeout(r,600));
      const chk=snapData(await ref.get());
      if(!chk||chk.jid===jid)return no;
      no=bumpNo(no);
    }catch(e){return no}
  }
  return no;
}
function ev(kind,text,extra={}){return {at:Date.now(),by:S.me.id||null,kind,text,...extra}}
async function pushHist(j,entry,patch={}){
  let base=j.history||[];
  try{const d=snapData(await S.db.doc('jobs/'+j.id).get());
    if(d){if(Array.isArray(d.history))base=d.history;
      if(('stage' in patch||'status' in patch)&&(d.stage!==j.stage||d.status!==j.status)){toast('งานนี้มีคนดำเนินการไปแล้ว หน้าจอจะอัปเดตเป็นข้อมูลล่าสุด');const e=new Error('stale');e.cl=1;throw e}}}
  catch(e){if(e.cl)throw e}
  const hist=[...base,entry].slice(-200);await w('jobs/'+j.id,{...patch,history:hist,updatedAt:Date.now()},'update',entry.text);afterHist(j,entry,patch);
}
addEventListener('unhandledrejection',e=>{if(e.reason&&(e.reason.cl||e.reason.message==='no db'||e.reason.code))e.preventDefault()});
function subscribe(col){
  S.db.collection(col).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]={id:d.id,...d.data()}});if(col==='jobs'&&S.loaded.jobs&&S.me)liveFeed(S.jobs||{},o);S[col]=o;
    if(!snap.metadata.fromCache)S.loaded[col]=true;
    if(col==='jobs')names(Object.values(o).flatMap(j=>(j.history||[]).slice(-5).map(h=>h.by)));
    if(col==='members')names(Object.keys(o));
    schedule();
  },e=>{S.loaded[col]=true;showErr(e,'อ่านข้อมูลไม่ได้');schedule()});
}

/* ความเคลื่อนไหวจากหน้างาน: คนอื่นบันทึกในงาน → การ์ดเล็กมุมขวาบน 6 วินาที แตะเพื่อเปิดงาน */
function liveFeed(old,nw){Object.values(nw).forEach(j=>{const a=old[j.id];if(!a)return;const h=j.history||[],n=(a.history||[]).length;
  h.slice(n).filter(e=>e.by&&e.by!==S.me.id&&e.text).slice(-2).forEach(e=>feedCard(j,e))})}
function feedCard(j,e){let box=$('#feed');if(!box){document.body.insertAdjacentHTML('beforeend','<div id="feed" aria-live="polite"></div>');box=$('#feed')}
  const nm=S.names[e.by]||'ทีมงาน';while(box.children.length>=3)box.firstChild.remove();
  const el=document.createElement('button');el.type='button';el.className='fd';el.dataset.fdj=j.id;
  el.innerHTML=`<span class="av">${esc(nm.slice(0,1))}</span><span><span><b>${esc(nm)}</b> ${esc(e.text)}</span><small>${esc(j.title||'')} · เมื่อสักครู่</small></span>`;
  box.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},6000)}

const PH_RE=/(^|[^\d])(0\d{1,2}[- ]?\d{3}[- ]?\d{3,4})(?!\d)/g;
function phWrap(root){const W=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/0\d/.test(n.nodeValue)&&!n.parentElement.closest('input,textarea,a,button,script,style,select,option,[contenteditable],.phc')?1:2});
  const T=[];while(W.nextNode())T.push(W.currentNode);
  T.forEach(n=>{const v=n.nodeValue;PH_RE.lastIndex=0;if(!PH_RE.test(v))return;PH_RE.lastIndex=0;const f=document.createDocumentFragment();let i=0,m;
    while((m=PH_RE.exec(v))){const st=m.index+m[1].length;f.append(v.slice(i,st));const b=document.createElement('button');b.type='button';b.className='phc';b.dataset.copy=m[2];b.title='แตะเพื่อคัดลอกเบอร์';b.textContent=m[2];f.append(b);i=st+m[2].length}
    f.append(v.slice(i));n.replaceWith(f)})}

function tool(href,name,desc,bg,fg,icon,ext,phase){return `<a class="tool" href="${href}"${ext?' target="_blank" rel="noopener"':''}${phase?` data-phase="${phase}"`:''}><span class="ic" style="background:${bg}">${svg(icon,fg,2)}</span><span><b>${esc(name)}</b><span>${esc(desc)}</span></span></a>`}
function waitChips(){if(!myGroup())return '';const L=mineJobs();
  if(!L.length)return `<div class="hchips"><span class="hchip ok">${svg('check','currentColor',2.4)}ไม่มีงานรอคุณ เคลียร์หมดแล้ว</span></div>`;
  const by={};L.forEach(j=>(by[j.stage]=by[j.stage]||[]).push(j));
  return `<div class="hchips"><span class="hcl">รอคุณ</span>${Object.keys(by).sort((a,b)=>a-b).map(k=>{const A=by[k];return `<a class="hchip" href="${A.length===1?'#job-'+A[0].id:'#jobs'}"${A.length===1?'':' data-mine="1"'}>${esc(STAGES[k].name)} <b>${A.length}</b></a>`}).join('')}</div>`}
function emptyStart(){

}

/* ---------- all jobs ---------- */
const svDate=j=>[j.surveyDate,j.queueDate].find(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x))||'';
const PHC2={pre:'b',offer:'g',ins:'o',post:'v'};
const stOf=j=>xCan(j)?'cancelled':j.status;
function jobPill(j){return stOf(j)==='cancelled'?'<span class="pill gy">ยกเลิก</span>':j.status==='lost'?'<span class="pill gy">ยังไม่ตกลง</span>':j.status==='done'?'<span class="pill ok">ปิดงานแล้ว</span>':`<span class="pill ${PHC2[phaseOf(j.stage)?.k]||'gy'}">${esc(STAGES[j.stage].name)}</span>`}
const placeOf=(j,s,c)=>s.area||s.place||c.address||'';
function needsCare(j){if(!isInstalled(j))return false;const d=pmDue(j);return (d&&dLeft(d)<=30)||(j.siteId&&cmOpen(j.siteId).length>0)}
function isPm(j){if(!isInstalled(j))return false;const d=pmDue(j);return !!d&&dLeft(d)<=30}
function isCm(j){return isInstalled(j)&&!!j.siteId&&cmOpen(j.siteId).length>0}
function jobsList(st,svcMode){
  const f=S.f;const status=st||f.status;const mine=svcMode?false:f.mine;const phase=svcMode?'':f.phase;
  const bm=new Date();bm.setDate(1);bm.setMonth(bm.getMonth()+(f.jmo||0));
  const curK=`${bm.getFullYear()}-${String(bm.getMonth()+1).padStart(2,'0')}`;
  const q=f.q.trim().toLowerCase();const svc=['installed','care','pm','cm'].includes(status);
  const allMonths=!!q||!!mine||svc||!!(f.phAll&&phase);
  const all=visibleJobs();
  const month=all.filter(j=>svDate(j).startsWith(curK));
  const inScope=allMonths?all:month;
  const qf=j=>{const c=cOf(j),s=sOf(j),e=j.equipment||{};return [j.jobNo,j.title,c.name,realName(c),c.phone,placeOf(j,s,c),j.surveyor,e.sn,e.wifiSn,unitSns(e),e.plantName,e.model,j.proposedModel,j.installTeam].join(' ').toLowerCase().includes(q)};
  const src=(q||mine||(f.phAll&&phase)?all:month).filter(j=>!q||qf(j));
  const cnt={all:src.length,active:0,lost:0,done:0,installed:all.filter(isInstalled).length,care:all.filter(needsCare).length,pm:all.filter(isPm).length,cm:all.filter(isCm).length};src.forEach(j=>cnt[stOf(j)]=(cnt[stOf(j)]||0)+1);
  let list=status==='all'?inScope:status==='installed'?all.filter(isInstalled):status==='care'?all.filter(needsCare):status==='pm'?all.filter(isPm):status==='cm'?all.filter(isCm):inScope.filter(j=>stOf(j)===status);
  if(mine){const g=myGroup();list=list.filter(j=>j.status==='active'&&STAGES[j.stage].role===g&&!(g==='admin'&&j.stage===ST.DOCS))}
  if(phase)list=list.filter(j=>j.status==='active'&&phaseOf(j.stage)?.k===phase);
  if(f.team)list=list.filter(j=>j.salesTeam===f.team);
  if(f.eng)list=list.filter(j=>(j.surveyor||'')===f.eng);
  if(q)list=list.filter(j=>{const c=cOf(j),s=sOf(j),e=j.equipment||{};return [j.jobNo,j.title,c.name,realName(c),c.phone,placeOf(j,s,c),j.surveyor,e.sn,e.wifiSn,unitSns(e),e.plantName,e.model,j.proposedModel,j.installTeam].join(' ').toLowerCase().includes(q)});
  if(status==='care'||status==='pm')list.sort((a,b)=>String(pmDue(a)||'9').localeCompare(String(pmDue(b)||'9')));
  else if(status==='installed'||status==='cm')list.sort((a,b)=>String(b.installDate||'').localeCompare(String(a.installDate||'')));
  else list.sort((a,b)=>svDate(b).localeCompare(svDate(a))||String(b.jobNo||'').localeCompare(String(a.jobNo||'')));
  return {all,inScope,cnt,list,curK,allMonths,svc};
}
function stageBar(j){
  if(j.status!=='active')return '';
  return `<span class="sbar" aria-hidden="true">${STAGES.slice(1).map((x,i)=>`<i class="${i+1<j.stage?'d':i+1===j.stage?'c':''}"></i>`).join('')}</span>`;
}
function careTags(j){
  const out=[];const n=j.siteId?cmOpen(j.siteId).length:0;if(n)out.push(`<span class="pill rd">แจ้งซ่อมค้าง ${n}</span>`);
  const d=isInstalled(j)?pmDue(j):null;if(d)out.push(pmBadge(d));return out.join('');
}
function viewJobs(mode){
  if(!S.loaded.jobs)return '<div class="card skr" aria-busy="true" aria-label="กำลังโหลดงาน">'+'<i class="sk"></i>'.repeat(6)+'</div>';
  const f=S.f;const SV=mode==='service';const status=SV?'installed':f.status;const {all,cnt,list,curK,allMonths,svc}=jobsList(status,SV);
  const mLabel=k=>{const [y,m]=k.split('-').map(Number);return `${TMF[m-1]} ${y+543}`};
  const per=f.per||20;const pages=Math.max(1,Math.ceil(list.length/per));if(f.pg>=pages)f.pg=pages-1;if(f.pg<0)f.pg=0;const p0=f.pg*per;const shown=list.slice(p0,p0+per);
  const noDate=all.filter(j=>!svDate(j)).length;

function kbMd(src){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[];let list=null;
  const flush=()=>{if(list){out.push(`<${list.t}>${list.i.map(x=>`<li>${inl(x)}</li>`).join('')}</${list.t}>`);list=null}};
  String(src||'').split('\n').forEach(l=>{
    const L=l.trim();let m;
    if(!L){flush();return}
    if(m=L.match(/^##\s+(.*)/)){flush();out.push(`<h2>${inl(m[1])}</h2>`);return}
    if(m=L.match(/^###\s+(.*)/)){flush();out.push(`<h3>${inl(m[1])}</h3>`);return}
    if(m=L.match(/^[-•]\s+(.*)/)){if(!list||list.t!=='ul'){flush();list={t:'ul',i:[]}}list.i.push(m[1]);return}
    if(m=L.match(/^\d+[.)]\s+(.*)/)){if(!list||list.t!=='ol'){flush();list={t:'ol',i:[]}}list.i.push(m[1]);return}
    if(m=L.match(/^>\s*(.*)/)){flush();out.push(`<blockquote>${inl(m[1])}</blockquote>`);return}
    flush();out.push(`<p>${inl(L)}</p>`);
  });flush();return out.join('');
}

function catParse(rows,base=0){
  const hi=rows.findIndex(r=>(r||[]).some(c=>String(c??'').trim()==='สินค้า'));if(hi<0)throw new Error('ไม่พบหัวตาราง "สินค้า" ในไฟล์');
  const H=rows[hi].map(c=>String(c??'').trim());const col=t=>H.findIndex(x=>x===t);
  const C={cat:col('สินค้า'),brand:col('ยี่ห้อ'),model:col('รุ่น'),phase:col('เฟส'),pow:col('กำลังผลิต'),sm:H.findIndex(x=>/smart\s*meter/i.test(x)),ct:col('CT'),note:col('หมายเหตุ')};
  if(C.model<0)throw new Error('ไม่พบคอลัมน์ "รุ่น"');
  const v=(r,k)=>C[k]<0?'':String(r[C[k]]??'').trim();const out=[],bad=[];
  rows.slice(hi+1).forEach((r,i)=>{r=r||[];const t=v(r,'cat'),model=v(r,'model');if(!t||!model)return;
    const cat=/แผง|panel/i.test(t)?'SOLAR PANEL':/อินเวอร์เตอร์|inverter/i.test(t)?'INVERTER':/แบต|battery/i.test(t)?'BATTERY':'';
    if(!cat){bad.push(`แถว ${base+hi+i+2}: ไม่รู้จักประเภท "${t}"`);return}
    const d={category:cat,model,brand:v(r,'brand')};const pw=catNum(v(r,'pow'));
    if(cat==='INVERTER'){Object.assign(d,{kw:pw,phase:String(catNum(v(r,'phase'))||''),type:/hybrid/i.test(v(r,'note'))?'Hybrid':/on.?grid/i.test(v(r,'note'))?'On Grid':''});
      const smB=C.sm<0?'':String(r[C.sm]??'').trim(),smM=C.sm<0?'':String(r[C.sm+1]??'').trim();if(smM)d.meters=smM;if(v(r,'ct'))d.cts=v(r,'ct');if(smM)d.note=`Smart meter ${[smB,smM].filter(Boolean).join(' ')}${d.cts?' · CT '+d.cts:''}`}
    else if(cat==='BATTERY')d.kwh=pw;else d.watt=pw;
    Object.keys(d).forEach(k=>{if(d[k]===''||d[k]==null)delete d[k]});out.push({row:base+hi+i+2,d})});
  return {out,bad};
}

function fieldHtml0(sec,[k,l,t,o],obj,pre){

/* ---------- customers ---------- */
function viewCustomers(){
  const jobsBy={};visibleJobs().forEach(j=>{(jobsBy[j.customerId]=jobsBy[j.customerId]||[]).push(j)});
  let cs=Object.values(S.customers).filter(c=>jobsBy[c.id]);
  const total=cs.length;const noPhone=cs.filter(c=>!c.phone).length;
  const q=(S.f.cq||'').toLowerCase();if(q)cs=cs.filter(c=>[c.name,realName(c),c.phone,c.email,c.referredBy,...jobsBy[c.id].map(j=>j.jobNo+' '+sOf(j).area+' '+sOf(j).label)].join(' ').toLowerCase().includes(q));
  const svd=j=>[j.surveyDate,j.queueDate].find(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x))||'';
  let rows=cs.map(c=>{const j=jobsBy[c.id].slice().sort((a,b)=>svd(b).localeCompare(svd(a)))[0];return {c,j,d:svd(j),n:jobsBy[c.id].length}}).sort((a,b)=>b.d.localeCompare(a.d));
  const mLabel=k=>{const [y,m]=k.split('-').map(Number);return `${TMF[m-1]} ${y+543}`};
  const cf=S.f;
  if(cf.cst)rows=rows.filter(r=>cf.cst==='active'?r.j.status==='active':stOf(r.j)===cf.cst);
  if(cf.cph)rows=rows.filter(r=>r.j.status==='active'&&phaseOf(r.j.stage)?.k===cf.cph);
  if(cf.cteam)rows=rows.filter(r=>cf.cteam==='PM'?String(r.j.salesTeam||'').startsWith('SA-'):r.j.salesTeam===cf.cteam);
  const bm=new Date();bm.setDate(1);bm.setMonth(bm.getMonth()+(cf.cmo||0));
  const curK=`${bm.getFullYear()}-${String(bm.getMonth()+1).padStart(2,'0')}`;
  const noSv=rows.filter(r=>!r.d).length;
  const searching=!!(cf.cq||'').trim();
  if(!searching)rows=rows.filter(r=>r.d.startsWith(curK));
  const anyF=cf.cst||cf.cph||cf.cteam;
  const groups=[];rows.forEach(r=>{const k=r.d.slice(0,7);let g=groups[groups.length-1];if(!g||g.k!==k)groups.push(g={k,rows:[]});g.rows.push(r)});
  const PHC2={pre:'b',offer:'g',ins:'o',post:'v'};
  const stTag=j=>stOf(j)==='cancelled'?'<span class="pill gy">ยกเลิก</span>':j.status==='lost'?'<span class="pill gy">ยังไม่ตกลง</span>':j.status==='done'?'<span class="pill ok">ปิดงานแล้ว</span>':`<span class="pill ${PHC2[phaseOf(j.stage)?.k]||'gy'}">${esc(STAGES[j.stage].name)}</span>`;
  return pageHead('ลูกค้า',searching?`ผลค้นหาจากทุกเดือน · พบ ${rows.length} ราย`:`แสดง ${rows.length} ราย จากทั้งหมด ${total} ราย · ตามเดือนที่สำรวจ`,searching?'':monthNav('cmo'))+`
  <section class="card tq">
  <div class="tqb" role="group" aria-label="ตัวกรองลูกค้า">
    <label class="isearch" for="cq">${svg('search','#7d8088',2)}<input id="cq" placeholder="ค้นหาชื่อไซต์ ชื่อลูกค้า เบอร์ เลขงาน เขต" value="${esc(S.f.cq||'')}"></label>
    <div class="seg">${[['','ทั้งหมด'],['active','กำลังดำเนินการ'],['lost','ยังไม่ตกลง'],['done','ปิดงานแล้ว']].map(([k,t])=>`<button class="${(cf.cst||'')===k?'on':''}" data-cst="${k}" aria-pressed="${(cf.cst||'')===k}">${t}</button>`).join('')}</div>
    <select class="sel" id="cph" aria-label="ช่วงงาน" ${cf.cst&&cf.cst!=='active'?'disabled':''}><option value="">ทุกช่วงงาน</option>${PHASES.map(p=>`<option value="${p.k}" ${cf.cph===p.k?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <select class="sel" id="cteam" aria-label="ทีมขาย"><option value="">ทุกทีมขาย</option><option value="PM" ${cf.cteam==='PM'?'selected':''}>เซลส์ PowerMatic ทั้งหมด</option>${TEAMS.map(t=>`<option ${cf.cteam===t?'selected':''}>${t}</option>`).join('')}</select>
  </div>
  ${groups.map(g=>`<section class="mgrp" aria-label="${g.k?mLabel(g.k):'ไม่มีวันสำรวจ'}">
    ${searching?`<div class="mh"><h2>${g.k?mLabel(g.k):'ไม่มีวันสำรวจ'}</h2><span class="sub">${g.rows.length} ราย</span></div>`:''}
    <div class="clist">${g.rows.map(({c,j,d,n})=>{const s=sOf(j);const rn=realName(c);const site=s.label||j.title||c.name;
      const second=rn||(c.name&&c.name!==site?c.name:'');
      return `<a class="crow" href="#job-${esc(j.id)}">
      <span class="dt" title="วันสำรวจ"><b>${+d.slice(8,10)||'—'}</b><span>${TM[+d.slice(5,7)-1]||'ไม่มีวัน'}</span></span>
      <span class="cn"><b>${esc(site)}</b>${second?`<span class="nm">${esc(second)}</span>`:'<span class="nm miss">ยังไม่มีชื่อ-นามสกุลจริง</span>'}<span class="sub">${esc([s.area,c.referredBy?'ลูกค้าของ'+c.referredBy:'',j.salesTeam].filter(Boolean).join(' · '))}</span></span>
      <span class="cp">${c.phone?`${svg('phone','#16171a').replace('<svg','<svg width="14" height="14"')}${esc(c.phone)}`:'<span class="sub">ยังไม่มีเบอร์</span>'}</span>
      <span class="cj">${stTag(j)}<span class="sub">${esc(j.jobNo||'ยังไม่มีเลข')}${n>1?` · อีก ${n-1} งาน`:''}</span></span>
    </a>`}).join('')}</div></section>`).join('')||`<div class="empty">${searching||anyF?'ไม่พบลูกค้าที่ตรงกับตัวกรอง':'ไม่มีการสำรวจในเดือน'+mLabel(curK)}</div>`}
  </section>`;
}

function shrinkImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveProfile(photo){
  const name=($('#pfname')?.value||'').trim();if(!name)return toast('ใส่ชื่อที่แสดงก่อน');
  const p={name};if(photo!==undefined)p.photo=photo;else if(S.pf2)p.photo=S.pf2;
  try{await S.db.call('profile',p);S.pf2=null;S.pfn=null;S.names[S.me.id]=name;S.db.refresh();toast('บันทึกโปรไฟล์แล้ว');render()}catch(e){showErr(e,'บันทึกไม่ได้')}
}

const isSales=()=>!!(S.me&&S.me.role==='sales');
const SL_STEP=[['แจ้งขอคิว',[1]],['ยืนยันคิวสำรวจ',[2]],['สำรวจและออกแบบ',[3]],['รอลูกค้าตกลง',[4]],['ติดตั้ง',[5,6,7]],['ขนานไฟ · ส่งมอบ',[8]]];
const slMine=()=>Object.values(S.jobs||{}).filter(j=>j.salesId===S.me.id).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
const slName=id=>id?(S.names[id]||S.members?.[id]?.name||''):'';
function slStatus(j){
  const st=j.status||'active';
  if(st==='cancelled')return ['ยกเลิก','gy',j.cancelReason||''];
  if(st==='lost')return ['ลูกค้าไม่ไปต่อ','gy',j.lostReason||''];
  if(st==='done')return ['ติดตั้งเสร็จ · ดูแลหลังการขาย','ok',''];
  const n=j.stage||1,d=j.surveyDate||j.queueDate;
  if(n===1)return ['รอยืนยันคิว','o',`ขอ ${fd(j.queueDate)} ${j.queueTime||''} · ออฟฟิศกำลังดูคิว`];
  if(n===2)return ['ยืนยันคิวแล้ว','b',`สำรวจ ${fd(d)} ${j.queueTime||''} · กำลังจัดคน`];
  if(n===3)return [`นัดสำรวจ ${fd(d)}`,'g',[j.queueTime,j.surveyor].filter(Boolean).join(' · ')];
  if(n===4)return ['ส่งแบบแล้ว · รอลูกค้าตกลง','b',`ส่งไปแล้ว ${days(j.stageSince)} วัน — โทรตามได้`];
  if(n===5)return ['ลูกค้าตกลง · รอคิวติดตั้ง','g',''];
  if(n===6)return [j.installDate?`นัดติดตั้ง ${fd(j.installDate)}`:'กำลังนัดติดตั้ง','g',j.supervisor||''];
  if(n===7)return ['ติดตั้งแล้ว · เก็บงาน','g',''];
  return ['ทำเอกสารขนานไฟ','g',''];
}
function slWho(j){const n=j.stage||1;const x=n===3?j.surveyor:(n===6||n===7)?(j.supervisor||j.surveyor):'';return x||'ออฟฟิศ'}
function slProg(j){const n=(j.status==='done')?9:(j.stage||1);return `<span class="slp" aria-hidden="true">${[1,2,3,4,5,6,7,8].map(k=>`<i class="${k<n?'d':k===n&&!['cancelled','lost'].includes(j.status)?'c':''}"></i>`).join('')}</span>`}
function slSeen(){try{return JSON.parse(localStorage.getItem('cl.slseen')||'{}')}catch(e){return {}}}
function slMsgs(id){return Object.values(S.messages||{}).filter(m=>m.jobId===id).sort((a,b)=>(a.at||0)-(b.at||0))}
function slNew(id){const s=slSeen()[id]||0;return slMsgs(id).filter(m=>m.by!==S.me.id&&(m.at||0)>s).length}

  <div class="sltl">${tile('clock','o',cnt(j=>(j.status||'active')==='active'&&j.stage===1),'รอยืนยันคิว')}${tile('search','g',cnt(j=>(j.status||'active')==='active'&&(j.stage===2||j.stage===3)),'กำลังสำรวจ / ออกแบบ')}${tile('doc','b',cnt(j=>(j.status||'active')==='active'&&j.stage===4),'รอลูกค้าตกลง')}${tile('bolt','k',cnt(j=>j.status==='done'||(j.status||'active')==='active'&&j.stage>=7),'ติดตั้งแล้ว')}</div>
  ${all.length?`${follow.length?`<section class="card pad slc1"><h2>ต้องตามต่อ <i class="slc">${follow.length}</i></h2>${follow.map(slRow).join('')}</section>`:''}

async function saveMeterNow(){const v=readF('mtN');const E=$('#mtNE');const dev=(v.device||'').replace('เครื่อง ','');

  if(v.from>today())return E.textContent='เครื่องที่ยังไม่ได้ติดตั้ง ใช้ "จองเครื่อง"';if(v.to<v.from)return E.textContent='วันเก็บต้องไม่ก่อนวันติดตั้ง';
  const end=v.to<today()?today():v.to;const hit=mtActive().filter(b=>b.device===dev&&b.from<=end&&mtEnd(b)>=v.from);
  const hard=hit.filter(b=>b.status!=='booked');if(hard.length){const b=hard[0];return E.textContent=`เครื่อง ${dev} มีบันทึกว่าใช้อยู่แล้ว: ${b.title||''} (${fd(b.from)} – ${fd(b.to)}) · ถ้าเครื่องคืนแล้ว กด "รับเครื่องคืน" ก่อน`}

  if(moves.length&&!await confirmBox('ย้ายคิวที่ชนกัน?',moves.map(m=>`${m.b.title||'คิว'} (${fd(m.b.from)}) → ${m.to?'เครื่อง '+m.to:'รอจัดเครื่อง'}`).join(' · '),'ย้ายและบันทึก','pri'))return;
  const now=Date.now();const id=S.db.collection('meters').doc().id;
  try{await wMany([...moves.map(m=>['meters/'+m.b.id,{device:m.to,updatedAt:now},'update']),['meters/'+id,{source:'direct',status:'out',outAt:v.from,createdAt:now,updatedAt:now,...v,device:dev},'set']]);

    S.dirty.delete(id);if(S.edit===id)S.edit=null;S.saved={sec:id,keys:chK,at:Date.now()};toast('บันทึกแล้ว');render();

function nextJobNo(){
  const d=new Date();const pre=String((d.getFullYear()+543)%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0');
  let mx=0;Object.values(S.jobs).forEach(j=>{const s=String(j.jobNo||'');if(s.length===7&&s.startsWith(pre))mx=Math.max(mx,+s.slice(4)||0)});
  return pre+String(mx+1).padStart(3,'0');
}

function xd(v){if(!(v instanceof Date)||isNaN(v))return '';const d=new Date(v.getTime()+12*3600e3);if(d.getFullYear()<2000)return '';return isoOf(d)}
const xs=v=>v==null?'':(v instanceof Date?xd(v):String(v).trim());
const real=v=>{const s=xs(v);return s&&s!=='-'?s:''};
function parseRow(r,rowNo,nowMs){
  const raw=xs(r[1]);
  const tagM=raw.match(/\((EN|SA-[A-Z0-9]+)\)/i);
  let team=xs(r[3]);team=team==='EN'?'EN':/^D\w+$/i.test(team)?'SA-'+team.toUpperCase():(tagM?tagM[1].toUpperCase():'');
  const ref=(raw.match(/ลูกค้า\s*(?:ของ)?\s*((?:พี่|คุณ)[^\s()*]+)/)||[])[1]||'';
  const name=raw.replace(/\((EN|SA-[A-Z0-9]+)\)/ig,'').replace(/\*/g,' ').replace(/\s+/g,' ').trim();
  const company=/(บริษัท|บจก|(^|\s)บ\.|จำกัด|หจก|Shop)/i.test(name);
  const O=xs(r[14]);const kw=(O.match(/(\d+(?:\.\d+)?)\s*k/i)||[])[1];const ph=(O.match(/([13])\s*เฟส/)||[])[1];const qty=(O.match(/\*\s*(\d+)/)||[])[1];
  const meterFix=s=>s.replace(/^SMD/i,'SDM');
  const sd=real(r[6]),dsd=real(r[13]),ag=real(r[16]),ins=real(r[17]);
  const docs={prepared:r[29]===true,signed:r[30]===true,sentTon:r[30]===true,summary:r[31]===true,inspected:!!real(r[32])&&real(r[32])!=='P'?true:real(r[32])==='P',inspectDate:/^\d{4}-/.test(real(r[32]))?real(r[32]):'',note:/^\d{4}-/.test(real(r[32]))||real(r[32])==='P'?'':real(r[32])};
  const installed=xs(r[21])==='P'||!!real(r[23]);
  let stage,status='active',since=nowMs,lost='';
  const t=s=>s?Date.parse(s+'T09:00:00+07:00'):0;
  if(r[33]===true||(installed&&docs.prepared&&docs.sentTon&&docs.summary&&docs.inspected)){stage=LAST;status='done';since=t(ins||ag)||nowMs}
  else if(installed){stage=real(r[23])?ST.DOCS:ST.COMM;since=t(ins||ag)||nowMs}
  else if(ag){stage=ins?ST.INSTALL:ST.INSREQ;since=t(ag)}
  else if(xs(r[12])==='Cancel'){stage=ST.OFFER;status='lost';lost='ยกเลิก (จาก Excel)';since=t(dsd||sd)||nowMs}
  else if(xs(r[12])==='P'){stage=ST.OFFER;since=t(dsd||sd)||nowMs;if(nowMs-since>60*864e5){status='lost';lost='ไม่มีข้อมูลต่อหลังส่งแบบ (นำเข้าจาก Excel)'}}
  else if(xs(r[7])==='P'||real(r[4])||real(r[5])){stage=ST.SURVEY;since=t(sd)||nowMs}
  else{stage=2;since=t(sd)||nowMs}
  const id='x'+rowNo;
  const customer={name,type:company?'บริษัท':'บุคคล',referredBy:ref,phone:'',email:'',address:'',legacy:true,createdAt:nowMs};
  const site={customerId:'c'+id,label:name,area:real(r[2]),utility:real(r[28]),phase:ph||'',createdAt:nowMs};
  const job={type:'solar',customerId:'c'+id,siteId:'s'+id,title:name,jobNo:real(r[5]),legacyRow:rowNo,
    salesTeam:team,surveyor:real(r[4]),surveyDate:sd,queueDate:sd,loggerDevice:real(r[11]),logStart:real(r[8]),logEnd:real(r[9]),
    designSentDate:dsd,proposedKw:kw?Number(kw):'',inverterQty:qty?Number(qty):(kw?1:''),proposedModel:real(r[15]),proposedNote:O,
    agreedDate:ag,installDate:ins,installTeam:real(r[18]),supervisor:real(r[19]),
    equipment:{model:real(r[22]),sn:real(r[23]),wifiSn:real(r[24]),meter:meterFix(real(r[25])),ct:real(r[26]),panels:real(r[27])?Number(r[27])||real(r[27]):'',plantName:real(r[20])},
    docs,pmChecked:r[33]===true,status,stage,stageSince:since,lostReason:lost,createdAt:nowMs,updatedAt:nowMs,
    history:[{at:nowMs,by:S.me.id||null,kind:'import',text:`นำเข้าจาก Excel แถว ${rowNo} → ${STAGES[stage].name}${status==='lost'?' (ยังไม่ตกลง)':status==='done'?' (ดูแลหลังการขาย)':''}`}]};
  return {id,customer,site,job};
}
async function pool(tasks,prog){
  let i=0,done=0;
  async function one(fn){for(let a=0;a<6;a++){try{return await fn()}catch(e){if(e?.code==='resource_exhausted'||e?.code==='unavailable'){await new Promise(r=>setTimeout(r,1500*(a+1)));continue}throw e}}throw new Error('เขียนไม่สำเร็จหลังลองซ้ำ')}
  async function run(){while(i<tasks.length){const k=i++;await one(tasks[k]);prog(++done,tasks.length)}}
  await Promise.all([run(),run(),run()]);
}
async function runImport(file){
  const out={set innerHTML(h){S.xprog=h;const el=$('#xprog');if(el)el.innerHTML=h}};
  try{
    if(Object.keys(S.jobs).some(k=>k.startsWith('x'))){const ok=await ask('นำเข้าซ้ำ?','พิมพ์ ยืนยัน เพื่อเขียนทับงานที่นำเข้าไว้เดิม');if(ok!=='ยืนยัน')return}
    
    out.innerHTML='กำลังอ่านไฟล์…';try{await loadXLSX()}catch(e){throw new Error('โหลดตัวอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต) ลองดาวน์โหลดไฟล์ไปเปิดในเบราว์เซอร์')}
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const ws=wb.Sheets['ตารางงาน'];if(!ws)throw new Error('ไม่พบชีต "ตารางงาน"');
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const now=Date.now();const items=[];
    for(let i=4;i<rows.length;i++){const r=rows[i]||[];if(!xs(r[1]))continue;items.push(parseRow(r,i+1,now))}
    const prods=[];const ls=wb.Sheets['LIST'];
    if(ls){const L=XLSX.utils.sheet_to_json(ls,{header:1,raw:true,defval:null});for(let i=1;i<L.length;i++)CATS.forEach((c,ci)=>{let m=xs((L[i]||[])[ci]);if(m){m=m.replace(/^SMD/i,'SDM');prods.push({id:pid(c,m),category:c,model:m})}})}
    const tasks=[];
    prods.filter(p=>!S.products[p.id]).forEach(p=>tasks.push(['products/'+p.id,{category:p.category,model:p.model}]));
    items.forEach(it=>{
      tasks.push(['customers/c'+it.id,it.customer]);
      tasks.push(['sites/s'+it.id,it.site]);
      tasks.push(['jobs/'+it.id,it.job]);
    });
    const pg=(d,t)=>{out.innerHTML=`<div class="bar"><i id="xbar" style="width:${t?d/t*100:0}%"></i></div><div class="sub" id="xtxt">เขียนแล้ว ${d} / ${t}</div>`};pg(0,tasks.length);
    if(S.db.batch){
      const N=15;let done=0;
      for(let i=0;i<tasks.length;i+=N){const part=tasks.slice(i,i+N);
        for(let a=0;;a++){try{const b=S.db.batch();part.forEach(([p,d])=>b.set(S.db.doc(p),d));await b.commit();break}
          catch(e){if(e?.code==='bad'&&/batch/.test(e.message||'')){for(const [p,d] of part)await S.db.doc(p).set(d);break} /* ตัวกลางรุ่นเก่า → ทีละรายการ */
            if(a<8&&['busy','network','server'].includes(e?.code)){out.innerHTML=`<div class="sub">ระบบกำลังทำงาน รอสักครู่แล้วลองต่อ… (${done} / ${tasks.length})</div>`;await new Promise(r=>setTimeout(r,5000*(a+1)));continue}throw e}}
        done+=part.length;pg(done,tasks.length)}
    }else await pool(tasks.map(([p,d])=>()=>S.db.doc(p).set(d)),pg);
    const c={active:0,lost:0,done:0};items.forEach(x=>c[x.job.status]++);
    // จองเลขใบงานของงานที่นำเข้า (กันงานใหม่ได้เลขซ้ำถ้างานนำเข้าถูกลบทีหลัง) · เลขที่จองไว้ให้งานอื่นแล้ว ข้ามไป
    {const seen=new Set();const R=items.filter(x=>x.job.jobNo&&!seen.has(x.job.jobNo)&&seen.add(x.job.jobNo)).map(x=>['jobnos/'+x.job.jobNo,{jid:x.id,at:Date.now(),by:S.me.id||null,src:'import'}]);
      for(let i=0;i<R.length;i+=15){const part=R.slice(i,i+15);try{if(!S.db.batch)throw 0;const b=S.db.batch();part.forEach(([p,d])=>b.set(S.db.doc(p),d));await b.commit()}catch(e){for(const [p,d] of part){try{await S.db.doc(p).set(d)}catch(x){}}}}}
    logRaw('import',`นำเข้า Excel ${file.name||''}: ${items.length} งาน · ${prods.length} รุ่นสินค้า`);
    const nos={};items.forEach(x=>{if(x.job.jobNo)nos[x.job.jobNo]=(nos[x.job.jobNo]||0)+1});
    const dup=Object.keys(nos).filter(k=>nos[k]>1);const noNo=items.filter(x=>!x.job.jobNo).length;
    out.innerHTML=`<div class="banner">นำเข้าแล้ว ${items.length} งาน: กำลังดำเนินการ ${c.active} · ยังไม่ตกลง ${c.lost} · ดูแลหลังการขาย ${c.done} · อุปกรณ์ ${prods.length} รุ่น<br>ยังไม่มีเลขงาน ${noNo} งาน${dup.length?' · เลขงานซ้ำ: '+dup.join(', '):''}</div>`;
  }catch(e){out.innerHTML=`<div class="banner">นำเข้าไม่สำเร็จ: ${esc(e.message||e.code||e)}</div>`}
}

  if(t.dataset.files){const jj=S.jobs[t.dataset.files]||{};if(window.CLGDB&&CLGDB.files&&S.db)CLGDB.files.open(t.dataset.files,jj.title||'',jj.folderUrl);else if(jj.folderUrl)window.open(jj.folderUrl,'_blank','noopener');return}
  if(t.dataset.mkfolder){t.disabled=true;try{const r=await S.db.folder(t.dataset.mkfolder);t.disabled=false;if(!r.id){toast('ยังสร้างโฟลเดอร์ไม่ได้ ต้องอัปเดตตัวกลางเป็น 1.2.7');return}toast('สร้างโฟลเดอร์งานแล้ว');S.db.refresh();const jj=S.jobs[t.dataset.mkfolder]||{};if(window.CLGDB&&CLGDB.files)CLGDB.files.open(t.dataset.mkfolder,jj.title||'',r.url);else if(r.url)location.href=r.url}catch(x){toast(x.message);t.disabled=false}}
});
document.addEventListener('click',e=>{if(e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;const a=e.target.closest('a[href^="#"]');if(!a||a.target)return;const h=a.getAttribute('href');if(h.length<2)return;e.preventDefault();if(location.hash!==h)location.hash=h.slice(1);else render()});
addEventListener('scroll',()=>{const b=document.body,y=scrollY;if(!b.classList.contains('pgsc')){if(y>160)b.classList.add('pgsc')}else if(y<24)b.classList.remove('pgsc')},{passive:true});

/* รอบ 4w: เมนู "อื่นๆ" — วางแผงด้วย fixed · ปิดเมื่อคลิกนอก/เลือกรายการ/Esc/เลื่อนหน้า · กดปุ่ม ⋯ ในแถวตารางไม่เปิดแผงงาน */
(function(){const closeAll=x=>document.querySelectorAll('details.mnu[open]').forEach(d=>{if(d!==x)d.open=false});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details.mnu')||!d.open)return;closeAll(d);
  const s=d.querySelector('summary').getBoundingClientRect(),p=d.querySelector('.mnu-p'),r=p.getBoundingClientRect();
  let top=s.bottom+6;if(top+r.height>innerHeight-8)top=Math.max(8,s.top-6-r.height);const left=Math.max(8,Math.min(innerWidth-r.width-8,s.right-r.width));
  let cb=d.parentElement,o={top:0,left:0};while(cb&&cb!==document.body){const c=getComputedStyle(cb);if(c.transform!=='none'||c.filter!=='none'||(c.backdropFilter&&c.backdropFilter!=='none')||(c.webkitBackdropFilter&&c.webkitBackdropFilter!=='none')||c.perspective!=='none'||/paint|layout|strict|content/.test(c.contain)){o=cb.getBoundingClientRect();break}cb=cb.parentElement}
  p.style.top=(top-o.top)+'px';p.style.left=(left-o.left)+'px'},true);   /* ชดเชยกรอบที่มี backdrop-filter/transform (fixed จะอิงกรอบนั้นแทนจอ) */
document.addEventListener('click',e=>{const d=e.target.closest&&e.target.closest('details.mnu');closeAll(d);if(!d)return;
  if(e.target.closest('.mi')){d.open=false;return}if(e.target.closest('summary'))e.stopPropagation()},true);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const d=document.querySelector('details.mnu[open]');if(!d)return;d.open=false;d.querySelector('summary').focus();e.stopPropagation()},true);
addEventListener('scroll',()=>closeAll(null),true);addEventListener('resize',()=>closeAll(null));})();
