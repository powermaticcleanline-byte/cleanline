<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEANLINE Management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23636469'/%3E%3Cpath d='M12 34V21a6 6 0 0 1 6-6h3a6 6 0 0 1 6 6v6a6 6 0 0 0 6 6h4' fill='none' stroke='%2394d30a' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left sidebar + one scrolling work column (max 1240px). Pages: วันนี้ (dark summary card, to-do, notifications, department, tools) · งานทั้งหมด · หน้างาน · เปิดงาน · ลูกค้า · ตั้งค่า. Single light theme by choice: the brand's dark card sits on a light ground. */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/1.5 var(--f);font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
.logo{display:flex;flex-direction:column;gap:9px;text-decoration:none}
.logo img{height:auto;display:block}
.logo span{font-size:11px;letter-spacing:.16em;color:var(--mut2);font-weight:600}
.nav{display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;padding:0 10px;text-decoration:none}
.nav a svg{flex:none}
.nav .c{margin-left:auto;font-size:12.5px;color:var(--mut2)}
.nav .b{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:10px;border-radius:12px}
.av{width:34px;height:34px;border-radius:10px;background:#2a2b30;color:var(--limeL);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.av.s{width:26px;height:26px;border-radius:8px;font-size:12px}
.me b{display:block;font-weight:600}
.me small{font-size:12px;color:var(--mut)}
.pmlogo{margin:2px 10px 0}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:12px;background:var(--sf);box-shadow:var(--shBtn)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.dk{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.2),0 4px 12px rgba(16,17,20,.18)}
.btn.dk:hover{background:#000}
.btn.lime{background:var(--lime);color:var(--limeInk);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn:disabled{background:#e6e8eb;color:#8a8d95;box-shadow:none;cursor:not-allowed}
.btn.bad{color:var(--crit)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.seg button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.card{background:var(--sf)}
.pad{padding:22px 24px}
.hd{display:flex;align-items:center;gap:10px}
.hd h2{margin:0}
.hd .r{margin-left:auto;font-size:13px;color:var(--mut);text-decoration:none;cursor:pointer;background:none;border:0}
h1{margin:0;font-weight:600;letter-spacing:-.02em}
.muted{color:var(--mut)}
.sub{font-size:12.5px;color:var(--mut)}
/* dark summary card */
.hro{color:#f4f5f7;padding:28px 32px;flex-direction:column;gap:22px;box-shadow:0 1px 1px rgba(0,0,0,.2),0 18px 40px -12px rgba(16,17,20,.45)}
.tile{min-width:128px;padding:14px 16px;border-radius:16px;background:#25262b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.tile b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tile span{font-size:12.5px;color:#a9abb3}
.slot{position:absolute;top:7px;bottom:7px;background:#2a2c31;padding:6px 10px;overflow:hidden;text-decoration:none;color:inherit}
.slot.ins{background:#33401a;box-shadow:inset 0 0 0 1px rgba(201,242,90,.3)}
.slot b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot span{font-size:11.5px;color:#9a9ca4;white-space:nowrap}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--limeL);border-radius:1px;box-shadow:0 0 10px rgba(201,242,90,.7)}
.prog{height:4px;border-radius:2px;background:rgba(255,255,255,.1);flex:1 1 220px}
.prog i{display:block;height:100%;border-radius:2px;background:var(--limeL);box-shadow:0 0 10px rgba(201,242,90,.5)}
/* lists */
.box{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #c2c4ca}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap;background:#f1f2f4;color:#55575e}
.tag.warn{background:var(--warnBg);color:var(--warn)}
.team{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#eef0f2;color:var(--ink2);white-space:nowrap}
.team.pm{background:var(--pmBg);color:var(--pm)}
.note{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:13px 20px;border-top:1px solid var(--ln);text-decoration:none}
.note .i{width:34px;height:34px;border-radius:10px;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.note .i.w{background:#f5f4fa;color:#1f6feb}
.note .i.g{background:var(--okBg);color:var(--ok)}
.empty{padding:28px 20px;text-align:center;color:var(--mut)}
.phase{all:unset;cursor:pointer;background:var(--sf);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.phase.on{box-shadow:0 0 0 2px var(--ink),var(--sh)}
.phase .t{display:flex;align-items:center;gap:8px;font-size:13px;color:#55575e;font-weight:500}
.phase .n{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tool{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:16px;background:var(--sf);text-decoration:none;box-shadow:var(--sh)}
.tool .ic{width:42px;height:42px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 4px 10px -4px rgba(16,17,20,.3)}
.tool .ic svg{width:20px;height:20px}
.tool b{display:block;font-weight:600;font-size:15px}
.tool span{font-size:13px;color:var(--mut);line-height:1.45}
.seg{display:inline-flex;gap:2px}
.seg button{height:32px;padding:0 12px;border:0;background:transparent;cursor:pointer}
.seg button.on{font-weight:600}
.seg button .n{color:var(--mut2);margin-left:4px}
select.sel{height:38px;padding:0 10px;border-radius:10px;border:0;background:var(--sf);box-shadow:var(--shBtn)}
.jobs{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 120px 90px;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--ln);text-decoration:none;cursor:pointer}
.row:hover{background:#eef4ff}
.row .st{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .st b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{justify-self:end}
@media (max-width:820px){
  .row{grid-template-columns:1fr auto}
  .row .st,.row .kw{display:none}
}
/* job page */
.crumb a{color:var(--mut);text-decoration:none}
.crumb b{color:var(--ink);font-weight:500}
.cols{display:flex;flex-wrap:wrap;gap:20px}
.colL{flex:999 1 540px;min-width:0;display:flex;flex-direction:column;gap:16px}
.colR{flex:1 1 320px;max-width:390px;display:flex;flex-direction:column;gap:16px}
.act{background:var(--sf);padding:22px;display:flex;flex-direction:column;gap:14px}
.act h2{margin:0;font-size:16px;font-weight:600}
.pbar{height:6px;border-radius:3px;background:#eef0f2;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lime)}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.need li{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:9px;background:#fff8f2}
.need li .k{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #c2c4ca;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.need li.ok{background:transparent;color:var(--mut)}
.need li.ok .k{background:var(--lime);box-shadow:none;color:var(--limeInk)}
.btns{display:flex;flex-direction:column;gap:8px}
.sec{background:var(--sf);padding:22px 24px;box-shadow:var(--sh)}
.sec h2{margin:0 0 14px;font-size:16px;font-weight:600}
.sec h2 .tg{font-size:11px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mut);min-width:0}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{height:40px;padding:0 12px;border:0;color:var(--ink);font-size:14px;width:100%}
.fld textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:#fff;outline:0}
.fld.chk{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);grid-column:1/-1}
.fld.chk input{width:18px;height:18px;accent-color:#1f6feb}
.formh{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--mut2);padding-top:10px;border-top:1px solid var(--ln);margin-top:4px}
.save{display:none;margin-top:16px;gap:8px}
.sec.dirty .save{display:flex}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid #8a8d95;border-bottom:2px solid #8a8d95;transform:rotate(45deg);transition:transform .15s}
details.sec[open]>summary{margin-bottom:14px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>summary .sm{font-size:12.5px;font-weight:400;color:var(--mut)}
.tl{display:flex;flex-direction:column;gap:12px}
.tl div{display:grid;grid-template-columns:12px 1fr;gap:12px}
.tl i{width:8px;height:8px;margin-top:7px;border-radius:50%;background:#c2c4ca}
.tl div:first-child i{background:var(--lime)}
.tl small{display:block;font-size:12px;color:var(--mut2)}
.tbl{font-size:13.5px}
.tbl td{vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:50;max-width:90vw}
.banner{padding:12px 16px;border-radius:12px;background:var(--okBg);color:var(--ok)}
.modalbg{position:fixed;inset:0;background:rgba(16,17,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--sf);border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.xbar{height:6px;border-radius:3px;background:#eef0f2;overflow:hidden}
.xbar i{display:block;height:100%;background:var(--lime);width:0}
@media (max-width:900px){
  .side{position:static;height:auto;flex-basis:100%}
  .shell{flex-wrap:wrap}
  main{padding:8px 16px 40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
.qd{background:#fff;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.qd.out{background:#fafbfb}
.qd.sun{background:#f7f8f9}
.qd.today{box-shadow:inset 0 0 0 2px #1f6feb}
.qf{margin-left:auto;font-size:11px;color:#1f6feb;background:#fde8e8;border-radius:6px;padding:2px 7px}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg.s{background:#16171a}
.lg.p{background:#fff;box-shadow:inset 0 0 0 1px #c3c5ca}
.lg.i{background:#e4e4e8}
.sumcard{display:flex;flex-direction:column;gap:0}
.sblk{padding:18px 0;border-top:1px solid #eef0f2;display:flex;flex-direction:column;gap:12px}
.sumcard h2+.sblk{border-top:0;padding-top:14px}
.sblk .sh{display:flex;align-items:center;gap:8px}
.sblk h3{margin:0;font-size:14px;font-weight:600}
.lnk{all:unset;cursor:pointer;margin-left:auto;font-size:13px;color:#1f6feb;padding:4px 10px;border-radius:8px}
.lnk:hover{background:#e8f1ff}
.lnk:focus-visible{outline:2px solid #1f6feb}
.kvg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.kv{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv.full{grid-column:1/-1}
.kv span{font-size:12px;color:var(--mut)}
.kv b{font-size:14px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.sumcard .sec.editing{box-shadow:none;outline:1px solid #e3e5e8;margin:8px 0}
.crow{display:grid;grid-template-columns:44px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:center;text-decoration:none;color:inherit}
.crow:first-child{border-top:0}
.crow:hover{background:var(--hv)}
.crow .cn,.crow .cj{display:flex;flex-direction:column;gap:3px;min-width:0}
.crow .cn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cj{align-items:flex-start}
.crow .cp{display:flex;align-items:center;gap:6px;font-size:13.5px}
.tag.dk{background:#16171a;color:#fff}
@media (max-width:900px){
  .kvg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crow{grid-template-columns:40px 1fr}
  .crow .cp,.crow .cj{grid-column:2}
}
.mgrp{display:flex;flex-direction:column;gap:10px}
.mh{display:flex;align-items:baseline;gap:10px;padding:6px 4px 0}
.mh h2{margin:0;font-size:16px;font-weight:600}
.crow .dt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;line-height:1.1}
.crow .dt b{font-size:16px;font-weight:600}
.crow .dt span{font-size:11px;color:var(--mut)}
.crow .nm{font-size:13.5px;color:var(--ink2)}
.crow .nm.miss{color:#a3a6ad;font-size:12.5px}
.appw{position:relative;flex:0 0 auto}
.appbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:repeat(3,4px);gap:4px;place-content:center}
.appbtn i{width:4px;height:4px;border-radius:50%;background:#55575e}
.appbtn:hover,.appbtn[aria-expanded="true"]{background:#e6e8eb}
.appbtn:focus-visible{outline:2px solid #1f6feb;outline-offset:2px}
.apppan{position:absolute;right:0;top:48px;z-index:50;width:320px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px rgba(20,22,26,.16);display:flex;flex-direction:column;gap:10px}
.apph{font-size:12px;color:var(--mut);padding:2px 6px}
.appg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.appi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;text-decoration:none;color:var(--ink);text-align:center}
.appi:hover,.appi:focus-visible{background:var(--hv);outline:none}
.appi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.appi .ic svg{width:22px;height:22px}
.appi b{font-size:13px;font-weight:600}
.appi small{font-size:11px;color:var(--mut);line-height:1.3}
.appi.soon{opacity:.7;cursor:default}
.appi.soon:hover{background:none}
.hh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:32px;align-items:center}
.hkpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.hempty{padding:28px 20px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
@media (max-width:1100px){
  .hh{grid-template-columns:1fr}
  .hkpi{grid-template-columns:repeat(2,1fr)}
}
.hsb{position:absolute;left:0;right:0;top:10px;display:flex;align-items:center;gap:18px;padding:10px 12px 10px 18px;border-radius:16px;background:rgba(27,28,32,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#f4f5f7;box-shadow:0 12px 30px -12px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .18s,transform .18s}
.hsb.on{opacity:1;transform:none;pointer-events:auto}
.hsb .btn.sm{flex:none}
@media (prefers-reduced-motion:reduce){
  .hsb{transition:none}
}
.nsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.nform{display:flex;flex-direction:column;gap:22px}
.ngrp{display:flex;flex-direction:column;gap:12px}
.ngrp h2{margin:0;font-size:15px}
.ngrp>textarea{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--hv);padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
.ngrp>textarea:focus{outline:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--lime)}
.opt{font-size:11px;color:var(--mut2);font-weight:400;margin-left:4px}
.maphelp{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ncal{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.nch{display:flex;align-items:center;justify-content:space-between}
.nch h2{margin:0;font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cw{font-size:11.5px;color:var(--mut);text-align:center;padding-bottom:2px}
.cd{all:unset;box-sizing:border-box;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:14px;transition:transform .08s}
.cd b{font-weight:600}
.cd span{font-size:10.5px;white-space:nowrap;overflow:hidden;max-width:92%;text-overflow:ellipsis}
.cd.free{background:#e8f1ff;color:#2f4d00}
.cd.free span{color:#1f6feb}
.cd.one{background:#f5f4fa;color:#1f6feb}
.cd.full{background:#f3f4f6;color:#a3a6ad}
.cd.off{background:repeating-linear-gradient(135deg,#f3f4f6 0 6px,#eceef1 6px 12px);color:#a3a6ad}
.cd.past,.cd.out{color:#c3c5ca;cursor:default}
.cd[disabled]{cursor:default}
.cd:not([disabled]):hover{transform:translateY(-1px);box-shadow:0 0 0 1.5px #1f6feb}
.cd.sel{background:#16171a !important;color:#fff !important}
.cd.sel span{color:#dcfce7 !important}
.cd:focus-visible{outline:2px solid #1f6feb;outline-offset:2px}
.clg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut)}
.clg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.clg .free{background:#cdeb8f}
.clg .one{background:#ffd9a0}
.clg .full{background:#e3e5e8}
.clg .off{background:repeating-linear-gradient(135deg,#e3e5e8 0 3px,#f3f4f6 3px 6px)}
.cslot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--ln)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{all:unset;box-sizing:border-box;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px #dfe1e5}
.slot small{font-size:10px;font-weight:400}
.slot:hover:not([disabled]){box-shadow:inset 0 0 0 1.5px #1f6feb}
.slot.on{background:#1f6feb;color:#17202b;box-shadow:none}
.slot[disabled]{color:#b3b5bb;background:#f6f7f8;cursor:default;box-shadow:none}
.slot:focus-visible{outline:2px solid #1f6feb;outline-offset:2px}

/* ================= ดีไซน์ใหม่: กรมท่า + ฟ้า (ตามภาพที่เลือก) ================= */
:root{--blue:#1f6feb;--navy:#0f2d52;--ink:#0f1f38;--mut:#64748b;--ln:#e6ebf2;--bg:#f3f6fb}
html,body{background:#f3f6fb !important;color:#0f1f38}
body{padding:0 !important}
.shell{max-width:none !important;margin:0 !important;min-height:100vh !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;background:#f3f6fb !important}
.side{border-right:0 !important}
#app,main#app{background:#f3f6fb !important;min-height:100vh}
.nvi{color:#c7d4e6 !important;height:42px !important;border-radius:10px !important;font-weight:600}
.nvi svg{color:#c7d4e6}
.nvi:hover{background:rgba(255,255,255,.08) !important;color:#fff !important}
.nvi.on{background:linear-gradient(90deg,#1f6feb,#3b82f6) !important;color:#fff !important}
.nvi.on svg{color:#fff}
.nvi i{background:#ff8a3d !important}
.gsw{margin-left:8px !important}
.card,.hbk>.card,.scd{border:1px solid #e6ebf2 !important;border-radius:16px !important;box-shadow:0 2px 10px rgba(15,45,82,.04) !important}
.ptl svg{color:#1f6feb !important}
.btn.pri{border-color:#1f6feb !important}
.ph h1{color:#0f1f38}
/* hero */
.hro{display:flex;align-items:stretch;border-radius:20px;border:1px solid #d6e4f7}
.hro-t{flex:1;min-width:0}
.hro-t p{margin:0 0 6px;font-size:13px;font-weight:600;color:#47658f}
.hro-t h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em;color:#0f2d52}
.hro-t>span{display:block;margin-top:6px;font-size:16px;color:#33507a}
.hro-t .hqa{margin-top:18px}
.htls{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:-44px 24px 20px}
.htl{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid #e6ebf2;border-radius:16px;box-shadow:0 12px 28px -18px rgba(15,45,82,.35);text-decoration:none;color:#0f1f38;transition:transform .15s}
.htl:hover{transform:translateY(-2px)}
.hti{display:grid;place-items:center;width:46px;height:46px;flex:none}
.hti svg{width:22px;height:22px}
.hti.b{background:linear-gradient(135deg,#3b82f6,#1f6feb)}
.hti.g{background:linear-gradient(135deg,#34d399,#16a34a)}
.hti.o{background:linear-gradient(135deg,#fdba74,#f97316)}
.hti.v{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.htl small{display:block;font-size:13px;font-weight:600;color:#64748b}
.htl b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.htl b em{font-style:normal;font-size:13px;font-weight:600;color:#64748b}
/* mini calendar */
.mcal{padding-bottom:16px}
.mc-m{padding:0 20px 8px;font-size:14px;font-weight:700;color:#0f1f38;text-align:center}
.mc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 14px}
.mc-h{text-align:center;font-size:12px;color:#94a3b8;padding:4px 0}
.mc-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:13px;color:#0f1f38}
.mc-d b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:600}
.mc-d.p b{color:#a3afc2}
.mc-d.t b{color:#fff}
.mc-d i,.mc-l span{display:flex;gap:3px;min-height:6px}
.mc-d u,.mc-l u{display:block;width:6px;height:6px;border-radius:50%;text-decoration:none}
u.b{background:#1f6feb}
u.g{background:#16a34a}
u.v{background:#7c3aed}
.mc-l{display:flex;justify-content:center;gap:16px;padding:12px 0 0;font-size:12px;color:#64748b}
.mc-l span{align-items:center;gap:6px}
/* board */
/* pills multi-color */
.pill{border-radius:999px !important;font-weight:700}
.pill.b{background:#e0edff !important;color:#1d4ed8 !important}
.pill.g{background:#fff1e3 !important;color:#c2410c !important}
.pill.o{background:#e3f6ec !important;color:#15803d !important}
.pill.v{background:#efe8ff !important;color:#6d28d9 !important}
.pill.ok{background:#dcfce7 !important;color:#15803d !important}
.pill.gy{background:#eef2f7 !important;color:#475569 !important}
.dbp i.a,.dlg2 i.a{background:linear-gradient(180deg,#1f6feb,#93c0ff) !important}
.dbp i.b,.dlg2 i.b{background:linear-gradient(180deg,#16a34a,#86efac) !important}
.dst b{color:#0f1f38}
.dsn{color:#16a34a}
@media (max-width:1200px){
  .htls{grid-template-columns:repeat(2,1fr)}
}
.hro{position:relative}
.hbk>.card{margin:0 0 16px !important}
.hrow3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr) minmax(280px,.9fr);gap:16px;align-items:stretch}
.hrow3 .dbars{height:220px}
@media (max-width:1300px){
  .hrow3{grid-template-columns:1fr 1fr}
}
.hro{max-height:none !important}
.hro-t{padding:30px 34px 78px !important}
.htls{margin-top:-52px !important}
.hrow3.two{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr) !important}
/* ================= ปุ่มและแถบ: มีมิติ ไล่สี เงานุ่ม ================= */
/* ปุ่มหลัก */
.btn{position:relative;height:38px !important;padding:0 16px !important;font-weight:700 !important;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s !important}
.btn:hover{transform:translateY(-1px);border-color:#b9d3ff !important;box-shadow:0 6px 16px -8px rgba(31,111,235,.45) !important;background:linear-gradient(180deg,#ffffff,#eef4ff) !important}
.btn:active{transform:translateY(0);box-shadow:0 1px 2px rgba(15,45,82,.12) inset !important}
.btn svg{width:16px;height:16px}
.btn.pri{height:42px !important;padding:0 20px !important}
.btn.pri:hover{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 14px 26px -10px rgba(31,111,235,.85) !important}
.btn.sm{height:34px !important;padding:0 14px !important;font-size:13.5px !important;border-radius:10px !important}
.btn.sm.pri{height:34px !important}
.btn.ghost{background:transparent !important;border-color:transparent !important;box-shadow:none !important}
.btn:focus-visible{outline:3px solid #b9d3ff !important;outline-offset:2px}
/* ปุ่มไอคอนในตาราง: มีสีตามหน้าที่ */
.jt2 .ib{width:34px !important;height:34px !important;border-radius:10px !important;border:0 !important;box-shadow:none !important;transition:transform .15s,box-shadow .15s,background .15s}
.jt2 .ibs .ib:nth-child(1){background:#e8f1ff !important}
.jt2 .ibs .ib:nth-child(2){background:#fff1e3 !important}
.jt2 .ibs .ib:nth-child(3){background:#e3f6ec !important}
.jt2 .ibs .ib:nth-child(4){background:#efe8ff !important}
.jt2 .ib:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px currentColor !important;filter:saturate(1.2)}
.jt2 .ib:disabled{opacity:.35 !important;filter:grayscale(1)}
/* แถบแท็บ (จองคิว) */
.bkc .tabs{display:inline-flex !important;gap:4px;padding:4px !important;margin-left:14px;background:#eef3f9 !important;border-radius:12px !important;border:0 !important}
.bkc .tabs button{height:34px !important;padding:0 14px !important;border:0 !important;border-radius:9px !important;background:transparent !important;color:#475569 !important;font-weight:700 !important;box-shadow:none !important}
.bkc .tabs button.on{background:#fff !important;color:#1f6feb !important;box-shadow:0 2px 8px -2px rgba(15,45,82,.18) !important}
.bkc .tabs button::after{display:none !important}
.bkc .tabs .n,.bkc .tabs b,.bkc .tabs span{border-radius:999px}
/* แถบสลับ (seg) */
.seg{background:#eef3f9 !important;padding:4px !important;border-radius:12px !important;border:0 !important}
.seg button{border-radius:9px !important;font-weight:700 !important;color:#475569 !important}
.seg button.on{background:linear-gradient(135deg,#3b82f6,#1f6feb) !important;color:#fff !important;box-shadow:0 6px 14px -8px rgba(31,111,235,.8) !important}
/* แถบตัวกรอง */
.jsrch,select.sel,.tqb select.sel{height:40px !important;border-radius:11px !important;background-color:#fff !important;transition:border-color .15s,box-shadow .15s}
.jsrch:focus-within,select.sel:focus{border-color:#7fb0ff !important;box-shadow:0 0 0 4px #e3eeff !important;outline:0}
select.sel{font-weight:600;color:#1e3354}
/* แถบบน */
.gs:focus-within{background:#fff !important;border-color:#7fb0ff !important;box-shadow:0 0 0 4px #e3eeff !important}
.gs kbd{background:#fff !important;border-color:#dde5f0 !important;box-shadow:0 1px 0 #dde5f0}
/* แถบเลขหน้า */
.pgb{border-radius:10px !important;transition:background .15s}
.pgb.on{color:#fff !important;box-shadow:0 6px 14px -8px rgba(31,111,235,.8)}
.pgn .ib{border-radius:10px !important;background:linear-gradient(180deg,#fff,#f4f7fb) !important;border:1px solid #dde5f0 !important}
/* แถบความคืบหน้า */
.sbar{gap:4px}
.sbar i{height:7px !important;border-radius:999px !important;background:#e6ebf2 !important}
.sbar i.d{background:linear-gradient(90deg,#60a5fa,#1f6feb) !important}
.sbar i.c{background:linear-gradient(90deg,#fdba74,#f97316) !important;box-shadow:0 0 0 3px #fff1e3}
/* ป้ายสถานะ: จุดนำหน้า */
.pill{height:26px !important;padding:0 11px !important;font-size:12.5px !important}
/* แท่งกราฟ */
.dbp i{border-radius:8px 8px 3px 3px !important;box-shadow:0 6px 12px -8px rgba(31,111,235,.6)}
.dbw:hover .dbp i{filter:brightness(1.08)}
/* การ์ดตัวเลข */
.htl{background:linear-gradient(180deg,#fff,#fbfdff) !important}
.hti{box-shadow:0 10px 18px -10px rgba(15,45,82,.55),inset 0 1px 0 rgba(255,255,255,.35)}
/* เมนูซ้าย: แถบเรืองแสงตัวที่เลือก */
.nvi.on{position:relative;box-shadow:0 10px 22px -12px rgba(59,130,246,.95),inset 0 1px 0 rgba(255,255,255,.18) !important}
.nvi.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#7fb0ff}
.scd.on .sci{background:rgba(255,255,255,.22) !important;color:#fff !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.drh2 .sbar i.d,.sbar i.d{background:linear-gradient(90deg,#60a5fa,#1f6feb) !important}
/* ================= มิติ: พื้นนุ่ม + แผงกระจกฝ้า + การ์ดซ้อนชั้น + ปุ่มวงกลมลอย ================= */
html,body,#app,main#app,.shell{background:radial-gradient(900px 500px at 85% -5%,#dbe7f7 0%,rgba(219,231,247,0) 60%),radial-gradient(800px 600px at 10% 100%,#e3e9f2 0%,rgba(227,233,242,0) 60%),linear-gradient(160deg,#eef2f7 0%,#e6ebf2 100%) !important;background-attachment:fixed !important}
/* ชั้นที่ 1: แผงกระจกฝ้า */
.card,.hbk>.card,.hro{background:rgba(255,255,255,.55) !important;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.75) !important;border-radius:28px !important;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 48px -28px rgba(15,45,82,.28),0 2px 6px rgba(15,45,82,.04) !important}
/* ชั้นที่ 2: พื้นที่ข้อมูลข้างใน เป็นการ์ดขาวซ้อนในแผง */
.tq .jtw{overflow:hidden}
.bkc .bkb{margin:0 14px 14px;overflow:hidden}
.mcal .mc-g{margin:0 14px;padding:8px 10px}
.dcp .dbars{padding:14px 14px 0;margin-left:16px !important;margin-right:16px !important}
.tqb{background:transparent !important;border-bottom:0 !important}
.pgf{background:transparent !important;border-top:0 !important}
.bt.hdr,.bkc .bt.hdr{background:#f7f9fc !important}
/* การ์ดตัวเลข: ซ้อนบนแบนเนอร์ */
.htl,.scd{background:rgba(255,255,255,.82) !important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9) !important;box-shadow:0 1px 0 #fff inset,0 18px 34px -22px rgba(15,45,82,.4) !important}
.scd.on{border-color:transparent !important}
/* ปุ่มวงกลมลอย (ไอคอน) */
.jt2 .ib,.pgn .ib,.tbr .ntw>button,.tbr .appw>button{width:38px !important;height:38px !important;border-radius:50% !important;background:linear-gradient(180deg,#ffffff,#f1f4f8) !important;border:1px solid rgba(15,45,82,.08) !important;box-shadow:0 1px 0 #fff inset,0 6px 14px -8px rgba(15,45,82,.35) !important}
.jt2 .ibs .ib:nth-child(1){color:#1f6feb !important}
.jt2 .ibs .ib:nth-child(2){color:#ea6a0c !important}
.jt2 .ibs .ib:nth-child(3){color:#16a34a !important}
.jt2 .ibs .ib:nth-child(4){color:#7c3aed !important}
.jt2 .ib:not(:disabled):hover,.pgn .ib:hover{transform:translateY(-2px)}
.jt2 .ibs{gap:8px !important}
/* ปุ่ม: แคปซูล */
.btn.pri{border-radius:999px !important}
/* แถบสลับ/แท็บ: รางยุบลง ชิปลอยขึ้น */
.seg,.bkc .tabs{border-radius:999px !important}
.seg button,.bkc .tabs button{border-radius:999px !important}
.seg button.on,.bkc .tabs button.on{box-shadow:0 6px 14px -8px rgba(15,45,82,.45),0 1px 0 #fff inset !important}
/* ช่องกรอก: ยุบลงเล็กน้อย */
.jsrch,select.sel,.tqb select.sel,.gs{border-radius:999px !important;background:rgba(255,255,255,.75) !important;border:1px solid rgba(15,45,82,.07) !important;box-shadow:inset 0 2px 4px rgba(15,45,82,.06) !important}
/* แถบบน: กระจกใส */
.tb.pmbar{-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.7) !important}
/* ป้ายสถานะ */
.pill{box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 3px 8px -5px rgba(15,45,82,.25)}
/* แผงรายละเอียด */
.drw{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.dk{box-shadow:0 8px 18px -14px rgba(15,45,82,.4),0 0 0 1px rgba(15,45,82,.05) !important}
/* ================= กรอบใหม่ตาม SugarCRM: พื้นเทา โลโก้บนซ้าย เมนูตัวหนังสือด้านบน แถบปุ่มวงกลมด้านซ้าย ================= */
:root{--cv:#e2e5ea}
html,body,.shell,#app,main#app{background:radial-gradient(1100px 600px at 70% 110%,#d6deef 0%,rgba(214,222,239,0) 60%),linear-gradient(180deg,#e6e8ec 0%,#e0e3e9 100%) !important;background-attachment:fixed !important;color:#1b1d22}
.shell{display:block !important}
/* แถบบน */
.tb.pmbar{position:fixed !important;top:0;right:0;z-index:40;height:84px !important;display:flex;align-items:center;gap:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0 !important;box-shadow:none !important}
.tnv{display:flex;align-items:center;height:44px;padding:0 20px;border-radius:999px;color:#3c3f46;text-decoration:none;font-size:14.5px;font-weight:500;transition:background .15s,color .15s}
.tnv:hover{background:rgba(255,255,255,.6)}
.tnv.on{background:#111214;color:#fff;box-shadow:0 10px 20px -10px rgba(0,0,0,.6)}
.tb.pmbar .tbr{display:flex;align-items:center;gap:10px;margin-left:0 !important}
/* ค้นหา: วงกลม ขยายเมื่อกด */
.gsw{flex:none !important;margin:0 !important;position:relative}
.gs{width:46px !important;height:46px !important;padding:0 14px !important;border-radius:999px !important;background:#f3f4f6 !important;border:1px solid rgba(0,0,0,.08) !important;box-shadow:0 1px 0 #fff inset,0 8px 16px -10px rgba(0,0,0,.35) !important;overflow:hidden;transition:width .25s}
.gs input{opacity:0;width:0;transition:opacity .2s}
.gs:focus-within,.gs:hover{width:320px !important}
.gs:focus-within input,.gs:hover input{opacity:1;width:auto}
.gqr{left:auto !important;right:0;width:420px}
.tbr .ntw>button,.tbr .appw>button{width:46px !important;height:46px !important;border-radius:50% !important;background:#f3f4f6 !important;border:1px solid rgba(0,0,0,.08) !important;box-shadow:0 1px 0 #fff inset,0 8px 16px -10px rgba(0,0,0,.35) !important;color:#2a2c31 !important}
.tav{width:46px !important;height:46px !important;font-size:15px !important;background:linear-gradient(140deg,#4b5563,#111214) !important;box-shadow:0 0 0 3px #f3f4f6,0 8px 16px -8px rgba(0,0,0,.5) !important}
/* แถบปุ่มวงกลมซ้าย */
.side{border:0 !important}
.rli{position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#f3f4f6;border:1px solid rgba(0,0,0,.07);color:#2a2c31;text-decoration:none;box-shadow:0 1px 0 #fff inset,0 10px 18px -12px rgba(0,0,0,.4);transition:transform .15s}
.rli svg{width:19px;height:19px}
.rli:hover{transform:translateY(-2px)}
.rli.on{background:#111214;color:#fff;border-color:#111214}
.rli i{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#e5484d;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #e6e8ec}
/* หัวข้อหน้า */
.ph h1,.hro-t h1{font-size:38px !important;font-weight:600 !important;letter-spacing:-.035em !important;color:#16171a !important}
/* แผง: มุมโค้งมาก ไม่มีเส้นขอบ แยกด้วยความสว่าง */
.card,.hbk>.card,.hro,.htl,.scd{background:linear-gradient(180deg,rgba(246,247,249,.92),rgba(238,240,244,.88)) !important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:0 !important;border-radius:38px !important;box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 -1px 0 rgba(0,0,0,.03) inset,0 30px 60px -40px rgba(30,40,60,.38) !important}
.htl,.scd{border-radius:30px !important}
.hro{background:linear-gradient(120deg,rgba(248,249,251,.95),rgba(232,236,245,.9)) !important}
/* การ์ดชั้นใน: ขาวกว่า มุมโค้ง 28 */
.tq .jtw,.bkc .bkb,.dcp .dbars,.mcal .mc-g{background:#f9fafb !important;border-radius:28px !important;box-shadow:0 1px 0 #fff inset,0 16px 30px -22px rgba(30,40,60,.4) !important}
.tq .jtw{margin:0 18px 18px !important}
.jt2 thead th{background:#f9fafb !important;color:#8b8f98 !important;font-weight:500 !important}
.jt2 td{border-bottom:1px solid #eef0f3 !important}
/* ปุ่มวงกลมเส้นบาง (แบบปุ่มหัวแผง) */
.jt2 .ib,.pgn .ib{width:40px !important;height:40px !important;border-radius:50% !important;background:transparent !important;border:1px solid rgba(0,0,0,.14) !important;box-shadow:none !important;color:#2a2c31 !important}
.jt2 .ibs .ib:nth-child(n){background:transparent !important;color:#2a2c31 !important}
.jt2 .ib:not(:disabled):hover,.pgn .ib:hover{background:#fff !important;box-shadow:0 8px 16px -10px rgba(0,0,0,.4) !important}
/* ปุ่มหลัก: แคปซูลดำ */
.btn{border-radius:999px !important;background:#f6f7f9 !important;border:1px solid rgba(0,0,0,.1) !important;color:#1b1d22 !important;box-shadow:0 1px 0 #fff inset,0 8px 16px -12px rgba(0,0,0,.35) !important}
.btn.pri{background:#111214 !important;color:#fff !important;border:0 !important;box-shadow:0 12px 22px -12px rgba(0,0,0,.7) !important}
.btn.pri:hover{background:#2a2c31 !important}
/* แถบสลับ/แท็บ */
.seg,.bkc .tabs{background:rgba(0,0,0,.05) !important;box-shadow:inset 0 2px 4px rgba(0,0,0,.06) !important}
.seg button.on,.bkc .tabs button.on{background:#111214 !important;color:#fff !important}
.seg button.on .n{background:rgba(255,255,255,.2) !important;color:#fff !important}
/* ช่องกรอก */
.jsrch,select.sel,.tqb select.sel{background:#f9fafb !important;border:1px solid rgba(0,0,0,.07) !important;box-shadow:inset 0 2px 4px rgba(0,0,0,.05) !important}
/* การ์ดตัวเลข: ใบที่เลือกเป็นดำ */
.scd.on{background:#111214 !important;box-shadow:0 20px 34px -18px rgba(0,0,0,.65) !important}

/* แผงรายละเอียด */

}

.pfw{position:relative}

.pfh b{display:block;font-size:14.5px;font-weight:700;color:#16171a}
.pfh small{font-size:12.5px;color:#8b8f98}
.pfi{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border:0;border-radius:999px;background:none;font:inherit;font-size:14px;font-weight:600;color:#2a2c31;text-decoration:none;cursor:pointer;text-align:left}

/* ปฏิทินงาน: พอดีหน้าจอ ไม่ต้องเลื่อน */
.pg:has(.kwrap){padding-bottom:20px !important}
.pg:has(.kwrap) .ph{margin-bottom:12px !important}
.kwrap{height:calc(100vh - 84px - 132px);min-height:520px;align-items:stretch !important}
.kcal{display:flex !important;flex-direction:column;min-height:0;height:100%}
.kcal .kgr:last-of-type,.kcal>.kgr:not(.kw){flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.kd{min-height:0 !important;overflow:hidden}
.kside{position:static !important;height:100%;overflow:auto !important}
.kcal .kgr{flex:1;min-height:0;grid-template-rows:auto !important;grid-auto-rows:minmax(0,1fr) !important}
.kel>*{flex:none !important}
.kd .kel{max-height:none;overflow:hidden}
/* ปฏิทิน: มุมมองสัปดาห์ / วัน */
.kcalb{gap:10px;flex-wrap:wrap}
.kvn{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px;border-radius:999px;background:#f6f7f9;box-shadow:0 1px 0 #fff inset,0 8px 16px -12px rgba(0,0,0,.35)}
.kvn b{min-width:220px;text-align:center;font-size:15px;font-weight:700}
.kvn .ib{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.1);background:#fff;cursor:pointer}
.kvn .ib svg{width:15px;height:15px;transform:rotate(180deg)}
.kvn .ib.nx svg{transform:none}
.kvc{display:grid;gap:3px;width:100%;padding:10px 12px;border:0;border-left:4px solid #1f6feb;border-radius:12px;background:#eef4ff;text-align:left;font:inherit;cursor:pointer;flex:none}
.kvc.p{background:#fff;border-left-color:#93c0ff;box-shadow:inset 0 0 0 1px #dbe7fb}
.kvc.i{background:#e8f8ee;border-left-color:#16a34a}

.kvt{font-size:12px;font-weight:700;color:#1f6feb}
.kvc.i .kvt{color:#15803d}
.kvc b{font-size:13.5px;font-weight:700;color:#16171a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kvm{font-size:12px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ปฏิทินแบบตารางเวลา (สัปดาห์/วัน) */
.tg{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px 16px}
.tgh,.tga,.tgb{display:grid}
.tgh{padding:12px 0 10px}
.tgd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;font:inherit;cursor:pointer;border-radius:16px}
.tgd small{font-size:12.5px;color:#8b8f98;font-weight:600}
.tgd b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:19px;font-weight:700;color:#16171a}
.tgd.t b{background:#111214;color:#fff;box-shadow:0 8px 16px -8px rgba(0,0,0,.6)}
.tgd.on:not(.t) b{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 12px -8px rgba(0,0,0,.4)}
.tgd.sun small,.tgd.sun b{color:#b0b4bb}
.tgd em{font-style:normal;font-size:11px;font-weight:700;color:#c2343a}
.tga{border-top:1px solid #eceef1;border-bottom:1px solid #eceef1;background:#f8f9fb;border-radius:14px 14px 0 0;min-height:40px}
.tgl{display:grid;place-items:center;font-size:11.5px;color:#8b8f98;font-weight:600}
.tgac{display:flex;flex-direction:column;gap:4px;padding:6px 4px;border-left:1px solid #eceef1;min-width:0}
.tgp{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:999px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tgp i{flex:none;width:7px;height:7px;border-radius:50%}
.tgp.i{background:#dcf5e5;color:#14532d}
.tgp.i i{background:#16a34a}
.tgp.s,.tgp.p{background:#e3edff;color:#1e3a8a}
.tgp.s i,.tgp.p i{background:#1f6feb}
.tgb{flex:1;min-height:0;position:relative;background:#fff;border-radius:0 0 18px 18px;box-shadow:0 14px 28px -22px rgba(0,0,0,.35)}
.tgg{position:relative}
.tgg span{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;color:#9aa0a8;font-weight:600}
.tgg span:first-child{transform:none;top:4px !important}
.tgc{position:relative;border-left:1px solid #eef0f3;background-image:repeating-linear-gradient(180deg,transparent 0,transparent calc(100%/var(--hn) - 1px),#eef0f3 calc(100%/var(--hn) - 1px),#eef0f3 calc(100%/var(--hn)))}
.tgc.sun{background-color:#f6f7f9}
.tgc.t{background-color:rgba(31,111,235,.035)}
.tge{position:absolute;left:4px;right:4px;display:flex;flex-direction:column;gap:1px;padding:6px 9px;border:0;border-radius:12px;background:linear-gradient(180deg,#3b82f6,#1f6feb);color:#fff;text-align:left;font:inherit;cursor:pointer;overflow:hidden;box-shadow:0 10px 18px -12px rgba(31,111,235,.9);transition:transform .15s}
.tge:hover{transform:translateY(-1px);z-index:2}
.tge.p{background:#fff;color:#1e3a8a;box-shadow:inset 0 0 0 1.5px #93c0ff,0 8px 14px -12px rgba(0,0,0,.4)}
.tgt{font-size:11px;font-weight:700;opacity:.9}
.tge b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgm{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgnow{position:absolute;left:-1px;right:0;height:2px;background:#e5484d;z-index:3}
.tgnow::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#e5484d}
.tg.one .tge{left:10px;right:auto;width:min(520px,calc(100% - 20px));padding:10px 14px}
.tg.one .tge b{font-size:14.5px}
.tg.one .tgt,.tg.one .tgm{font-size:12.5px}
.tg.one .tgd{flex-direction:row;justify-content:flex-start;gap:10px;padding-left:8px}
.kcap2{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e3f6ec;color:#15803d}
.kcap2.full{background:#fde8e8;color:#b42318}
.kteam{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px;border-bottom:1px solid #eceef1}
.ktm{display:grid;gap:2px;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 6px 12px -10px rgba(0,0,0,.35)}
.ktm b{font-size:13px;font-weight:700}
.ktm span{font-size:12px;color:#6b7280}

select.bki{appearance:auto;padding:0 10px;font:inherit;font-size:13px}
.klg i.cv{width:22px;height:12px;border-radius:999px;background:#e3f6ec}
.tb.pmbar{background:linear-gradient(180deg,#e6e8ec 70%,rgba(230,232,236,0)) !important}
/* งานวันนี้ */
.tday{margin:0 0 16px;align-items:stretch}
.tday .mcal{margin:0 !important}
.tdp{display:flex;flex-direction:column}

.tdr.i{border-left:4px solid #16a34a}
.tdr.v{border-left:4px solid #7c3aed}

.tde{flex:1;display:grid;place-items:center;align-content:center;gap:6px;padding:30px;text-align:center;color:#9aa0a8}
.tde svg{width:28px;height:28px;padding:8px;box-sizing:content-box;border-radius:50%;background:#fff;color:#16a34a;box-shadow:0 8px 16px -10px rgba(0,0,0,.35)}
.tde b{font-size:15px;color:#3a3d44}
.tde span{font-size:13px}
button.mc-d{border:0;background:none;font:inherit;cursor:pointer;border-radius:12px}
button.mc-d:hover b{background:#eef0f3}

/* แจ้งเตือนงานบริการ */
.sal{margin-bottom:16px}
.sall{display:flex;flex-direction:column;gap:8px;margin:0 16px 16px;padding:10px;border-radius:28px;background:#f9fafb;box-shadow:0 1px 0 #fff inset,0 16px 30px -22px rgba(30,40,60,.4);max-height:330px;overflow:auto}
.sar{display:grid;grid-template-columns:44px minmax(0,1fr) 170px auto;align-items:center;gap:14px;padding:10px 14px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 16px -14px rgba(0,0,0,.4)}
.sai{display:grid;place-items:center;width:44px;height:44px;border-radius:50%}

.sab{display:grid;min-width:0;border:0;background:none;padding:0;text-align:left;font:inherit;cursor:pointer}

.sab small{font-size:12.5px;color:#7a7f88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.saw{display:grid;justify-items:start;gap:2px}
.saw small{font-size:12px;color:#8b8f98}
.saw em{font-style:normal;font-size:13px;font-weight:700;color:#3a3d44}
.saw em.warn{color:#b45309}

.saa{display:flex;justify-content:flex-end}
/* เอาแถบปุ่มซ้ายออก: เนื้อหาเต็มความกว้าง จัดกึ่งกลาง แนวเดียวกับแถบบน */

/* ---------- db ---------- */
async function w(path,data,mode='update',note){
  if(!S.db){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้');throw new Error('no db')}
  const meta=logMeta(path,mode);
  try{const r=await S.db.doc(path)[mode](data);logPut(meta,data,note);return r}
  catch(e){toast(e?.code==='invalid_argument'?'บันทึกไม่ได้: บัญชีนี้ยังไม่มีสิทธิ์แก้ไขข้อมูล':['denied','not-found','busy','network','maintenance','pending'].includes(e?.code)?'บันทึกไม่ได้: '+e.message:'บันทึกไม่สำเร็จ ('+(e?.code||'error')+') ลองอีกครั้ง');throw e}
}
/* ---------- audit log: ใครทำอะไร เมื่อไหร่ (collection logs) ---------- */
const COLN={jobs:'งาน',customers:'ลูกค้า',sites:'ไซต์',products:'รุ่นสินค้า',members:'ผู้ใช้',config:'ตั้งค่า',articles:'บทความ',services:'งานบริการ',forms:'แบบฟอร์ม',meters:'การจองสมาร์ทมิเตอร์'};
function logMeta(path,mode){
  const [col,id]=String(path).split('/');if(!COLN[col])return null;const o=(S[col]||{})[id];
  const ttl=!o?'':col==='jobs'?(o.title||cOf(o).name||''):col==='customers'?(o.name||realName(o)):col==='sites'?o.label:col==='products'?o.model:col==='forms'?o.name:col==='meters'?o.title:col==='articles'?o.title:col==='members'?nm(id):col==='services'?((mainJob(o.siteId)||{}).title||''):'';
  return {col,id,ttl:ttl||'',act:mode==='delete'?'del':(mode==='set'&&!o)?'new':'edit'};
}
function logPut(meta,data,note){
  if(!meta||!S.db)return;const A={new:'สร้าง',edit:'แก้ไข',del:'ลบ'};
  const ttl=meta.ttl||(data&&(data.title||data.name||data.model||data.label))||'';
  const fields=data&&meta.act!=='del'?Object.keys(data).filter(k=>!['updatedAt','createdAt','history','by','createdBy'].includes(k)).slice(0,15):[];
  logRaw(meta.act,note||(A[meta.act]+COLN[meta.col]+(ttl?' '+ttl:'')),{col:meta.col,docId:meta.id,title:String(ttl).slice(0,140),fields});
}
function logRaw(act,text,extra={}){
  if(!S.db)return;
  try{S.db.doc('logs/'+S.db.collection('logs').doc().id).set({at:Date.now(),by:S.me.id||null,name:S.names[S.me.id]||'',act,text:String(text||'').slice(0,300),...extra}).catch(()=>{})}catch(e){}
}
function subscribeLogs(){
  try{S.db.collection('logs').orderBy('at','desc').limit(500).onSnapshot(sn=>{S.logs=sn.docs.map(d=>({id:d.id,...d.data()}));S.logErr=false;names(S.logs.map(x=>x.by));if(route()==='settings')schedule()},()=>{S.logErr=true;if(route()==='settings')schedule()})}catch(e){S.logErr=true}
}
/* เลขใบงานไม่ซ้ำ: จองเลขใน jobnos/<เลข> แล้วอ่านกลับ ถ้ามีคนจองทับก็ขยับเลขถัดไป */
const bumpNo=no=>no.slice(0,4)+String((+no.slice(4)||0)+1).padStart(3,'0');
const snapData=sn=>{if(!sn)return null;const ex=typeof sn.exists==='function'?sn.exists():sn.exists;return ex===false?null:(sn.data?sn.data():null)};
async function claimJobNo(jid){
  let no=nextJobNo();
  for(let a=0;a<10;a++){
    if(Object.values(S.jobs).some(x=>x.id!==jid&&x.jobNo===no)){no=bumpNo(no);continue}
    try{
      const ref=S.db.doc('jobnos/'+no);const cur=snapData(await ref.get());
      if(cur&&cur.jid&&cur.jid!==jid){no=bumpNo(no);continue}
      await ref.set({jid,at:Date.now(),by:S.me.id||null});
      await new Promise(r=>setTimeout(r,600));
      const chk=snapData(await ref.get());
      if(!chk||chk.jid===jid)return no;
      no=bumpNo(no);
    }catch(e){return no}
  }
  return no;
}
function ev(kind,text,extra={}){return {at:Date.now(),by:S.me.id||null,kind,text,...extra}}
async function pushHist(j,entry,patch={}){
  let base=j.history||[];
  try{const d=snapData(await S.db.doc('jobs/'+j.id).get());
    if(d){if(Array.isArray(d.history))base=d.history;
      if(('stage' in patch||'status' in patch)&&(d.stage!==j.stage||d.status!==j.status)){toast('งานนี้มีคนดำเนินการไปแล้ว หน้าจอจะอัปเดตเป็นข้อมูลล่าสุด');const e=new Error('stale');e.cl=1;throw e}}}
  catch(e){if(e.cl)throw e}
  const hist=[...base,entry].slice(-200);await w('jobs/'+j.id,{...patch,history:hist,updatedAt:Date.now()},'update',entry.text);
}

function subscribe(col){
  S.db.collection(col).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]={id:d.id,...d.data()}});S[col]=o;
    if(!snap.metadata.fromCache)S.loaded[col]=true;
    if(col==='jobs')names(Object.values(o).flatMap(j=>(j.history||[]).slice(-5).map(h=>h.by)));
    if(col==='members')names(Object.keys(o));
    schedule();
  },e=>{S.loaded[col]=true;toast('อ่านข้อมูลไม่ได้ ('+e.code+')');schedule()});
}

let stickObs=null;
function setupStick(){
  if(stickObs){stickObs.disconnect();stickObs=null}
  const k=document.querySelector('.hkpi'),b=$('#hsb');if(!k||!b)return;
  stickObs=new IntersectionObserver(([en])=>{const on=!en.isIntersecting&&en.boundingClientRect.top<0;b.classList.toggle('on',on);b.parentElement.setAttribute('aria-hidden',String(!on));b.querySelectorAll('a').forEach(a=>a.tabIndex=on?0:-1)},{threshold:0});
  stickObs.observe(k);
}

function dashPro(all){

function siteJobs(sid){return Object.values(S.jobs).filter(j=>j.siteId===sid).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}

function isInstalled(j){return !!j&&(j.status==='done'||(j.status==='active'&&j.stage>=ST.COMM)||(!!j.installDate&&j.installDate<=today()))}
const svcOf=sid=>Object.values(S.services||{}).filter(x=>x.siteId===sid).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||(b.createdAt||0)-(a.createdAt||0));

function warrantyTxt(d){if(!d)return '';const n=dLeft(d);if(n<0)return 'หมดประกันแล้ว';const m=Math.floor(n/30.4);return m>=1?`เหลือ ${m} เดือน`:`เหลือ ${n} วัน`}
function pmBadge(due){if(!due)return '';const n=dLeft(due);const cls=n<0?'rd':n<=30?'o':'gy';return `<span class="pill ${cls}">${n<0?`เลยกำหนดตรวจเช็ก ${-n} วัน`:n===0?'ครบกำหนดตรวจเช็กวันนี้':n<=30?`ตรวจเช็กอีก ${n} วัน`:'ตรวจเช็ก '+fd(due)}</span>`}

function fieldRow([k,l,t,o],v,pre){
  if(k==='h')return `<div class="formh">${esc(l)}</div>`;
  const id=pre+k;const opt=(o&&!Array.isArray(o)&&typeof o==='object')?o:{};const full=opt.full?'full':'';
  let inp;
  if(t==='sel')inp=`<select id="${id}" data-k="${k}"><option value="">—</option>${o.map(x=>`<option ${String(v??'')===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else if(t==='area')inp=`<textarea id="${id}" data-k="${k}" rows="3"${opt.req?' required':''}>${esc(v??'')}</textarea>`;
  else if(t==='model')inp=`<input type="text" id="${id}" data-k="${k}" list="dl-${esc(o)}" value="${esc(v??'')}">`;
  else inp=`<input type="${t}" id="${id}" data-k="${k}" value="${esc(v??'')}"${t==='number'?' step="any"':''}${opt.req?' required':''}${opt.ph?` placeholder="${esc(opt.ph)}"`:''}>`;
  return `<label class="fld ${full}" for="${id}">${esc(l)}${opt.req?' *':''}${inp}</label>`;
}

function delJobBox(j){return new Promise(res=>{
  const nm=j.title||cOf(j).name||'งานนี้';const meters=Object.values(S.meters||{}).filter(b=>b.jobId===j.id);const sv=Object.values(S.services||{}).filter(x=>x.jobId===j.id);
  const m=$('#modal');m.innerHTML=`<div class="modalbg"><form class="modal ddl" id="ddlF" role="alertdialog" aria-modal="true" aria-labelledby="ddlT">
    <span class="ddi">${svg('warn','currentColor',2)}</span><h2 id="ddlT">ลบงานนี้ถาวร?</h2>
    <p>งาน <b>${esc(nm)}</b>${j.jobNo?' (#'+esc(j.jobNo)+')':''} และประวัติทั้งหมดจะหายจากระบบ${meters.length?` รวมถึงการจองสมาร์ทมิเตอร์ ${meters.length} รายการ`:''}${sv.length?` และบันทึกตรวจเช็ก/แจ้งซ่อม ${sv.length} รายการ`:''} <b>กู้คืนไม่ได้</b></p>
    <div class="ddq"><span>พิมพ์ชื่อไซต์ด้านล่างให้ตรงเพื่อยืนยัน</span><code class="ddn">${esc(nm)}</code><input id="ddlV" aria-label="พิมพ์ชื่อไซต์เพื่อยืนยัน" autocomplete="off" spellcheck="false" placeholder="พิมพ์ชื่อไซต์ที่นี่"></div>
    <div class="ddf"><button type="button" class="btn" id="ddlN">ยกเลิก</button><button type="submit" class="btn ddy" id="ddlY" disabled>ลบถาวร</button></div></form></div>`;
  const done=v=>{m.innerHTML='';document.removeEventListener('keydown',k,true);res(v)};const k=e=>{if(e.key==='Escape'){e.stopPropagation();done(false)}};
  document.addEventListener('keydown',k,true);const i=$('#ddlV'),y=$('#ddlY');
  i.oninput=()=>{y.disabled=i.value.trim()!==nm.trim()};$('#ddlN').onclick=()=>done(false);
  $('#ddlF').onsubmit=e=>{e.preventDefault();if(!y.disabled)done(true)};setTimeout(()=>i.focus(),0);
})}
async function deleteJob(jid){const j=S.jobs[jid];if(!j)return;closeModal();
  if(!await delJobBox(j))return;
  try{
    const L=[],seen=new Set(),del=p=>{if(!seen.has(p)){seen.add(p);L.push([p,null,'delete'])}};
    for(const b of Object.values(S.meters||{}).filter(b=>b.jobId===jid))del('meters/'+b.id);
    for(const x of Object.values(S.services||{}).filter(x=>x.jobId===jid))del('services/'+x.id);
    const others=Object.values(S.jobs).filter(o=>o.id!==jid);
    del('jobs/'+jid);
    if(j.siteId&&!others.some(o=>o.siteId===j.siteId)){del('sites/'+j.siteId);for(const x of Object.values(S.services||{}).filter(x=>x.siteId===j.siteId))del('services/'+x.id)}
    if(j.customerId&&!others.some(o=>o.customerId===j.customerId))del('customers/'+j.customerId);
    await wMany(L);
    S.sel=null;document.body.classList.remove('dlock');if(route().startsWith('job-'))location.hash='jobs';else render();toast('ลบงานแล้ว');
  }catch(e){}
}

async function saveSvc(){
  const f=$('#svF');const v=readF('svF');const type=f.dataset.type;const sid=f.dataset.sid;
  if(!v.date){$('#svFE').textContent='ใส่วันที่ก่อน';return}
  if(type==='CM'&&!v.symptom){$('#svFE').textContent='ใส่อาการหรือปัญหาก่อน';$('#svF-symptom').focus();return}
  const now=Date.now();const j=mainJob(sid);
  const d={...v,type,siteId:sid,jobId:j?.id||null,updatedAt:now,by:v.by};
  if(type==='CM'){d.status=v.status==='ปิดงานแล้ว'?'closed':'open';const old=f.dataset.id?S.services[f.dataset.id]:null;if(d.status==='closed'&&!(old&&old.closedAt))d.closedAt=today();if(d.status!=='closed')d.closedAt=''}
  try{
    if(f.dataset.id)await w('services/'+f.dataset.id,d);
    else await w('services/'+S.db.collection('services').doc().id,{...d,createdAt:now,createdBy:S.me.id||null},'set');
    if(type==='PM'&&j&&(!j.lastPm||v.date>j.lastPm))await pushHist(j,ev('edit','ตรวจเช็กประจำปี '+fd(v.date)),{lastPm:v.date});
    closeModal();toast(type==='PM'?'บันทึกการตรวจเช็กแล้ว':'บันทึกแจ้งซ่อมแล้ว');
  }catch(e){}
}

function calHtml(){
  const f=S.nf||{};const t=today();
  const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+(f.mo||0));
  const y=base.getFullYear(),m=base.getMonth();const start=new Date(y,m,1);start.setDate(1-((start.getDay()+6)%7));
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const inM=d.getMonth()===m;if(i===35&&!inM)break;
    const di=dayInfo(k);const past=k<=t;const off=!!di.closed;const full=di.left===0;
    const st=!inM?'out':past?'past':off?'off':full?'full':di.left===1?'one':'free';

function shrinkImg(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function saveProfile(photo){
  const name=($('#pfname')?.value||'').trim();if(!name)return toast('ใส่ชื่อที่แสดงก่อน');
  const p={name};if(photo!==undefined)p.photo=photo;else if(S.pf2)p.photo=S.pf2;
  try{await S.db.call('profile',p);S.pf2=null;S.pfn=null;S.names[S.me.id]=name;S.db.refresh();toast('บันทึกโปรไฟล์แล้ว');render()}catch(e){toast(e.message||'บันทึกไม่ได้')}
}

  const list=L.filter(x=>(!u||x.by===u)&&(!a||x.act===a)&&(!q||[x.text,x.title,who(x),COLN[x.col]].join(' ').toLowerCase().includes(q)));

    ${S.logErr?`<p class="sub" style="margin:0 20px 16px">อ่านบันทึกไม่ได้ (บัญชีนี้อาจไม่มีสิทธิ์อ่าน หรือฐานข้อมูลยังไม่เปิดให้ใช้ logs)</p>`:`

      <select class="sel" id="lgu" aria-label="ผู้ใช้"><option value="">ทุกคน</option>${users.map(([id,n])=>`<option value="${esc(id)}" ${u===id?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <select class="sel" id="lga" aria-label="การกระทำ"><option value="">ทุกการกระทำ</option>${Object.entries(AT).map(([k,[t]])=>`<option value="${k}" ${a===k?'selected':''}>${t}</option>`).join('')}</select>
      <span class="sub">${list.length} รายการ</span></div>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th style="white-space:nowrap">เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr></thead><tbody>
    ${list.slice(0,lim).map(x=>{const t=AT[x.act]||['อื่น ๆ','gy'];const link=x.col==='jobs'&&S.jobs[x.docId]?`#job-${esc(x.docId)}`:'';
      return `<tr><td style="white-space:nowrap" class="m">${dt(x.at)}</td><td style="white-space:nowrap">${esc(who(x))}</td><td><span class="pill ${t[1]}">${t[0]}</span></td><td>${link?`<a href="${link}">${esc(x.title||'')}</a> · `:x.title&&!String(x.text).includes(x.title)?esc(x.title)+' · ':''}${esc(x.text||'')}${x.fields&&x.fields.length&&x.act==='edit'?`<div class="sub">ช่อง: ${esc(x.fields.map(fLabel).join(', '))}</div>`:''}</td></tr>`}).join('')||`<tr><td colspan="4" class="empty">${L.length?'ไม่มีรายการที่ตรงกับตัวกรอง':'ยังไม่มีบันทึก การเข้าระบบและการแก้ไขข้อมูลจะเริ่มเก็บจากนี้ไป'}</td></tr>`}
    </tbody></table></div>

}

async function saveSec(id){
  const j=S.jobs[route().slice(4)];if(!j)return;
  const sec=SECTIONS.find(x=>x.id===id);const root=document.querySelector(`[data-sec="${id}"]`);
  const data=readForm(root,sec);const now=Date.now();sec.fields.forEach(f=>{if(fieldLocked(sec,f[0]))delete data[f[0]]});
  for(const f of sec.fields)if(f[2]==='url'&&data[f[0]]){const u=normUrl(data[f[0]]);if(!u){toast('ลิงก์ "'+f[1]+'" ต้องขึ้นต้นด้วย https://');return}data[f[0]]=u}
  const old=getT(sec.tgt,j,cOf(j),sOf(j))||{};const nv=v=>v===undefined||v===null||v===false?'':String(v);
  const ch=sec.fields.filter(f=>f[2]!=='h'&&f[0] in data&&nv(data[f[0]])!==nv(old[f[0]])).map(f=>String(f[1]).replace(/\s*\(.*?\)/g,''));
  if(!ch.length){toast('ยังไม่มีการเปลี่ยนแปลง');return}
  if(!await confirmBox('บันทึกการแก้ไข "'+String(sec.title).replace(/\s*\(.*?\)/g,'')+'"?','จะเปลี่ยน: '+ch.join(', ')+' · ข้อมูลเดิมจะถูกแทนที่','บันทึก','pri'))return;
  try{
    if(sec.tgt==='customer'){if(!j.customerId)return;await w('customers/'+j.customerId,{...data,updatedAt:now})}
    else if(sec.tgt==='site'){if(!j.siteId)return;await w('sites/'+j.siteId,{...data,updatedAt:now})}
    else if(sec.tgt==='job'){await w('jobs/'+j.id,{...data,updatedAt:now})}

    S.dirty.delete(id);if(S.edit===id)S.edit=null;toast('บันทึกแล้ว');render();
  }catch(e){}
}

function xd(v){if(!(v instanceof Date)||isNaN(v))return '';const d=new Date(v.getTime()+12*3600e3);if(d.getFullYear()<2000)return '';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const xs=v=>v==null?'':(v instanceof Date?xd(v):String(v).trim());
const real=v=>{const s=xs(v);return s&&s!=='-'?s:''};
function parseRow(r,rowNo,nowMs){
  const raw=xs(r[1]);
  const tagM=raw.match(/\((EN|SA-[A-Z0-9]+)\)/i);
  let team=xs(r[3]);team=team==='EN'?'EN':/^D\w+$/i.test(team)?'SA-'+team.toUpperCase():(tagM?tagM[1].toUpperCase():'');
  const ref=(raw.match(/ลูกค้า\s*(?:ของ)?\s*((?:พี่|คุณ)[^\s()*]+)/)||[])[1]||'';
  const name=raw.replace(/\((EN|SA-[A-Z0-9]+)\)/ig,'').replace(/\*/g,' ').replace(/\s+/g,' ').trim();
  const company=/(บริษัท|บจก|(^|\s)บ\.|จำกัด|หจก|Shop)/i.test(name);
  const O=xs(r[14]);const kw=(O.match(/(\d+(?:\.\d+)?)\s*k/i)||[])[1];const ph=(O.match(/([13])\s*เฟส/)||[])[1];const qty=(O.match(/\*\s*(\d+)/)||[])[1];
  const meterFix=s=>s.replace(/^SMD/i,'SDM');
  const sd=real(r[6]),dsd=real(r[13]),ag=real(r[16]),ins=real(r[17]);
  const docs={prepared:r[29]===true,signed:r[30]===true,sentTon:r[30]===true,summary:r[31]===true,inspected:!!real(r[32])&&real(r[32])!=='P'?true:real(r[32])==='P',inspectDate:/^\d{4}-/.test(real(r[32]))?real(r[32]):'',note:/^\d{4}-/.test(real(r[32]))||real(r[32])==='P'?'':real(r[32])};
  const installed=xs(r[21])==='P'||!!real(r[23]);
  let stage,status='active',since=nowMs,lost='';
  const t=s=>s?Date.parse(s+'T09:00:00+07:00'):0;
  if(r[33]===true||(installed&&docs.prepared&&docs.sentTon&&docs.summary&&docs.inspected)){stage=LAST;status='done';since=t(ins||ag)||nowMs}
  else if(installed){stage=real(r[23])?ST.DOCS:ST.COMM;since=t(ins||ag)||nowMs}
  else if(ag){stage=ins?ST.INSTALL:ST.INSREQ;since=t(ag)}
  else if(xs(r[12])==='Cancel'){stage=ST.OFFER;status='lost';lost='ยกเลิก (จาก Excel)';since=t(dsd||sd)||nowMs}
  else if(xs(r[12])==='P'){stage=ST.OFFER;since=t(dsd||sd)||nowMs;if(nowMs-since>60*864e5){status='lost';lost='ไม่มีข้อมูลต่อหลังส่งแบบ (นำเข้าจาก Excel)'}}
  else if(xs(r[7])==='P'||real(r[4])||real(r[5])){stage=ST.SURVEY;since=t(sd)||nowMs}
  else{stage=2;since=t(sd)||nowMs}
  const id='x'+rowNo;
  const customer={name,type:company?'บริษัท':'บุคคล',referredBy:ref,phone:'',email:'',address:'',legacy:true,createdAt:nowMs};
  const site={customerId:'c'+id,label:name,area:real(r[2]),utility:real(r[28]),phase:ph||'',createdAt:nowMs};
  const job={type:'solar',customerId:'c'+id,siteId:'s'+id,title:name,jobNo:real(r[5]),legacyRow:rowNo,
    salesTeam:team,surveyor:real(r[4]),surveyDate:sd,queueDate:sd,loggerDevice:real(r[11]),logStart:real(r[8]),logEnd:real(r[9]),
    designSentDate:dsd,proposedKw:kw?Number(kw):'',inverterQty:qty?Number(qty):(kw?1:''),proposedModel:real(r[15]),proposedNote:O,
    agreedDate:ag,installDate:ins,installTeam:real(r[18]),supervisor:real(r[19]),
    equipment:{model:real(r[22]),sn:real(r[23]),wifiSn:real(r[24]),meter:meterFix(real(r[25])),ct:real(r[26]),panels:real(r[27])?Number(r[27])||real(r[27]):'',plantName:real(r[20])},
    docs,pmChecked:r[33]===true,status,stage,stageSince:since,lostReason:lost,createdAt:nowMs,updatedAt:nowMs,
    history:[{at:nowMs,by:S.me.id||null,kind:'import',text:`นำเข้าจาก Excel แถว ${rowNo} → ${STAGES[stage].name}${status==='lost'?' (ยังไม่ตกลง)':status==='done'?' (ดูแลหลังการขาย)':''}`}]};
  return {id,customer,site,job};
}
async function pool(tasks,prog){
  let i=0,done=0;
  async function one(fn){for(let a=0;a<6;a++){try{return await fn()}catch(e){if(e?.code==='resource_exhausted'||e?.code==='unavailable'){await new Promise(r=>setTimeout(r,1500*(a+1)));continue}throw e}}throw new Error('เขียนไม่สำเร็จหลังลองซ้ำ')}
  async function run(){while(i<tasks.length){const k=i++;await one(tasks[k]);prog(++done,tasks.length)}}
  await Promise.all([run(),run(),run()]);
}
async function runImport(file){
  const out={set innerHTML(h){S.xprog=h;const el=$('#xprog');if(el)el.innerHTML=h}};
  try{
    if(Object.keys(S.jobs).some(k=>k.startsWith('x'))){const ok=await ask('นำเข้าซ้ำ?','พิมพ์ ยืนยัน เพื่อเขียนทับงานที่นำเข้าไว้เดิม');if(ok!=='ยืนยัน')return}
    if(S.demo){for(const [c,ids] of [['jobs',Object.keys(S.jobs).filter(k=>/^d\d+$/.test(k))],['customers',Object.keys(S.customers).filter(k=>/^cd\d+$/.test(k))],['sites',Object.keys(S.sites).filter(k=>/^sd\d+$/.test(k))],['services',['v1']],['meters',['m1']]])for(const id of ids)await S.db.doc(c+'/'+id).delete()}
    out.innerHTML='กำลังอ่านไฟล์…';try{await loadXLSX()}catch(e){throw new Error('โหลดตัวอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต) ลองดาวน์โหลดไฟล์ไปเปิดในเบราว์เซอร์')}
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const ws=wb.Sheets['ตารางงาน'];if(!ws)throw new Error('ไม่พบชีต "ตารางงาน"');
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    const now=Date.now();const items=[];
    for(let i=4;i<rows.length;i++){const r=rows[i]||[];if(!xs(r[1]))continue;items.push(parseRow(r,i+1,now))}
    const prods=[];const ls=wb.Sheets['LIST'];
    if(ls){const L=XLSX.utils.sheet_to_json(ls,{header:1,raw:true,defval:null});for(let i=1;i<L.length;i++)CATS.forEach((c,ci)=>{let m=xs((L[i]||[])[ci]);if(m){m=m.replace(/^SMD/i,'SDM');prods.push({id:pid(c,m),category:c,model:m})}})}
    const tasks=[];
    prods.filter(p=>!S.products[p.id]).forEach(p=>tasks.push(['products/'+p.id,{category:p.category,model:p.model}]));
    items.forEach(it=>{
      tasks.push(['customers/c'+it.id,it.customer]);
      tasks.push(['sites/s'+it.id,it.site]);
      tasks.push(['jobs/'+it.id,it.job]);
    });
    const pg=(d,t)=>{out.innerHTML=`<div class="bar"><i id="xbar" style="width:${t?d/t*100:0}%"></i></div><div class="sub" id="xtxt">เขียนแล้ว ${d} / ${t}</div>`};pg(0,tasks.length);
    if(S.db.batch){
      const N=15;let done=0;
      for(let i=0;i<tasks.length;i+=N){const part=tasks.slice(i,i+N);
        for(let a=0;;a++){try{const b=S.db.batch();part.forEach(([p,d])=>b.set(S.db.doc(p),d));await b.commit();break}
          catch(e){if(e?.code==='bad'&&/batch/.test(e.message||'')){for(const [p,d] of part)await S.db.doc(p).set(d);break} /* ตัวกลางรุ่นเก่า → ทีละรายการ */
            if(a<8&&['busy','network','server'].includes(e?.code)){out.innerHTML=`<div class="sub">ระบบกำลังทำงาน รอสักครู่แล้วลองต่อ… (${done} / ${tasks.length})</div>`;await new Promise(r=>setTimeout(r,5000*(a+1)));continue}throw e}}
        done+=part.length;pg(done,tasks.length)}
    }else await pool(tasks.map(([p,d])=>()=>S.db.doc(p).set(d)),pg);
    const c={active:0,lost:0,done:0};items.forEach(x=>c[x.job.status]++);
    logRaw('import',`นำเข้า Excel ${file.name||''}: ${items.length} งาน · ${prods.length} รุ่นสินค้า`);
    const nos={};items.forEach(x=>{if(x.job.jobNo)nos[x.job.jobNo]=(nos[x.job.jobNo]||0)+1});
    const dup=Object.keys(nos).filter(k=>nos[k]>1);const noNo=items.filter(x=>!x.job.jobNo).length;
    out.innerHTML=`<div class="banner">นำเข้าแล้ว ${items.length} งาน: กำลังดำเนินการ ${c.active} · ยังไม่ตกลง ${c.lost} · ดูแลหลังการขาย ${c.done} · อุปกรณ์ ${prods.length} รุ่น<br>ยังไม่มีเลขงาน ${noNo} งาน${dup.length?' · เลขงานซ้ำ: '+dup.join(', '):''}</div>`;
  }catch(e){out.innerHTML=`<div class="banner">นำเข้าไม่สำเร็จ: ${esc(e.message||e.code||e)}</div>`}
}

  const subs={};const snap=c=>({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,data:()=>v})),metadata:{fromCache:false}});

  const coll=c=>{const q={onSnapshot:f=>{(subs[c]=subs[c]||[]).push(f);fire(c)},doc:()=>({id:'n'+Math.random().toString(36).slice(2,10)}),orderBy:()=>q,limit:()=>q,where:()=>q};return q};
  const db={collection:coll,doc:path=>{const [c,id]=path.split('/');data[c]=data[c]||{};return {
    get:async()=>({exists:!!data[c][id],data:()=>data[c][id]&&JSON.parse(JSON.stringify(data[c][id]))}),
    set:async d=>{data[c][id]=JSON.parse(JSON.stringify(d));fire(c)},update:async d=>{data[c][id]={...data[c][id],...JSON.parse(JSON.stringify(d))};fire(c)},delete:async()=>{delete data[c][id];fire(c)}}}};
  S.demo=true;S.noDb=false;S.db=db;S.user={profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:i==='demo-me'?'แอดมิน ตัวอย่าง':'ผู้ใช้'}]))};
  S.me={id:'demo-me',owner:true,edit:true};S.names['demo-me']='แอดมิน ตัวอย่าง';data.members['demo-me']={role:'admin',team:''};
  ['jobs','customers','sites','products','members','config','articles','services','forms','meters'].forEach(subscribe);subscribeLogs();
  logRaw('login','เข้าใช้งานระบบ (โหมดตัวอย่าง)');render();
}
document.addEventListener('click',e=>{if(e.target.closest('[data-demo]'))startDemo();if(e.target.closest('[data-goimp]'))setTimeout(()=>{const x=document.getElementById('xfile');if(x){x.closest('section').scrollIntoView({behavior:'smooth',block:'center'});x.closest('label')?.focus()}},250)});

/* ---------- boot ---------- */
(async()=>{
  if(window.CLEANLINE_CONFIG&&CLEANLINE_CONFIG.api&&window.CLGDB&&!/[?&]demo\b/.test(location.search)){
    try{
      const {db,user,me}=await CLGDB.connect('admin');
      document.body.classList.add('rocat');S.db=db;S.user=user;S.me.id=me.id;S.me.owner=!!me.owner;S.me.edit=['admin','sysadmin'].includes(me.role);S.me.role=me.role;S.me.email=me.email;S.me.name=me.name;
      ['jobs','customers','sites','products','members','config','articles','services','forms','meters','messages','photos'].forEach(subscribe);
      names([S.me.id]).then(schedule);render();
    }catch(e){toast(e.message||'เชื่อมต่อไม่สำเร็จ');S.noDb=true;render()}
    return;
  }
  const timer=setTimeout(()=>{if(!S.db){S.noDb=true;render()}},10000);
  if(!window.claude?.use){S.noDb=true;render();return}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  clearTimeout(timer);
  if(!db){S.noDb=true;render();return}
  S.db=db;S.user=user;
  if(user){try{S.me.id=await user.id();S.me.owner=!!(await user.isOwner());S.me.edit=!!(await user.canEdit());names([S.me.id]).then(schedule)}catch(e){}}
  ['jobs','customers','sites','products','members','config','articles','services','forms','meters'].forEach(subscribe);
  subscribeLogs();
  setTimeout(()=>{let first=true;try{first=!sessionStorage.getItem('cl.in');sessionStorage.setItem('cl.in','1')}catch(e){}if(first)logRaw('login','เข้าใช้งานระบบ')},1500);
  setTimeout(()=>{if(!S.loaded.jobs){S.loaded.jobs=true;toast('ยังโหลดข้อมูลไม่ได้ ข้อมูลที่เห็นอาจไม่ใช่ล่าสุด');render()}},10000);
  render();
})();
render();

/* ลิงก์ภายใน (#...) เปลี่ยนหน้าด้วย JS: บางหน้าตัวอย่าง/iframe ดักการคลิกลิงก์ ทำให้ปุ่มอย่าง "เปิดหน้างาน" ไม่ไป */
document.addEventListener('click',e=>{if(document.body.classList.contains('rocat')&&e.target.closest('[data-fmnew],[data-fmedit],[data-fmdel],[data-eqnew],[data-eqedit],[data-eqdel],label[for="eqxfile"]')){e.preventDefault();e.stopImmediatePropagation();toast('เพิ่ม/แก้ เอกสารและแคตตาล็อก ทำได้ที่หน้าหลังบ้าน (ผู้ดูแลระบบ)')}},true);
document.addEventListener('change',async e=>{if(e.target.id==='pfphoto'){const f=e.target.files[0];e.target.value='';if(!f)return;try{S.pfn=$('#pfname')?.value;S.pf2=await shrinkImg(f,256);render()}catch(x){toast('อ่านรูปไม่ได้')}}});
document.addEventListener('input',e=>{if(e.target.id==='pfname')S.pfn=e.target.value});
document.addEventListener('click',async e=>{
  const t=e.target.closest('#signout,[data-mkfolder],#pfsave,#pfdelphoto,[data-unlock]');if(!t)return;
  if(t.id==='pfsave'){t.disabled=true;await saveProfile();return}
  if(t.dataset.unlock){const j=S.jobs[t.dataset.unlock];const L=SV_APPROVAL.filter(x=>j.queueUnlock!==x);const who=L.length===1?L[0]:await ask('ขอใช้ใคร','พิมพ์ชื่อ: '+L.join(' / '));if(!who)return;if(!L.includes(who))return toast('ไม่พบชื่อ '+who);
    const why=await ask('ขอใช้ '+who+' สำหรับงานนี้','เหตุผล (บันทึกไว้ในประวัติงาน)');if(!why)return;
    try{await pushHist(j,ev('edit','ขอใช้ '+who+' สำรวจงานนี้: '+why),{queueUnlock:who});toast('ปลดให้เลือก '+who+' แล้ว (เฉพาะงานนี้)')}catch(x){}return}
  if(t.id==='pfdelphoto'){await saveProfile('');return}
  if(t.id==='signout'){CLGDB.user.signOut();return}
  if(t.dataset.mkfolder){t.disabled=true;try{const r=await S.db.folder(t.dataset.mkfolder);toast('สร้างโฟลเดอร์งานแล้ว');S.db.refresh();if(r.url)window.open(r.url,'_blank','noopener')}catch(x){toast(x.message);t.disabled=false}}
});
document.addEventListener('click',e=>{if(e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;const a=e.target.closest('a[href^="#"]');if(!a||a.target)return;const h=a.getAttribute('href');if(h.length<2)return;e.preventDefault();if(location.hash!==h)location.hash=h.slice(1);else render()});
addEventListener('scroll',()=>{const b=document.body,y=scrollY;if(!b.classList.contains('pgsc')){if(y>160)b.classList.add('pgsc')}else if(y<24)b.classList.remove('pgsc')},{passive:true});
</script>
