:root{--bg:#f4f5f9;--top:#eef6e4;--sf:#fff;--ink:#16171d;--ink2:#3a3d47;--mut:#6b6f7b;--mut2:#9a9eaa;--ln:#e8eaf0;--hv:#f5f6fa;
 --acc:#4f9a12;--accBg:#e8f5d9;--accSoft:#f2f9e9;--ok:#16a34a;--okBg:#dcf7e6;--okSoft:#ecfaf1;--warn:#c2570c;--warnBg:#ffedd8;--warnSoft:#fff5ea;
 --red:#dc2626;--redBg:#fee2e2;--redSoft:#fff1f1;--vio:#7c5cff;--vioBg:#efeaff;
 --r:24px;--sh:0 1px 2px rgba(20,24,40,.04),0 0 0 1px rgba(20,24,40,.05),0 10px 24px -16px rgba(20,24,40,.22);
 --f:'Prompt','Sarabun','Noto Sans Thai','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--nav:70px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--safe))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
#app{position:relative;isolation:isolate}
.glow{position:absolute;inset:0 0 auto 0;height:360px;z-index:-1;pointer-events:none;
 background:radial-gradient(120% 70% at 0% 0%,#e3f2cf 0%,rgba(228,226,255,0) 60%),radial-gradient(90% 60% at 100% 0%,#edf7e0 0%,rgba(220,234,255,0) 65%),linear-gradient(var(--top),var(--bg))}
.glow.warm{background:radial-gradient(110% 70% at 0% 0%,#ffe6d6 0%,rgba(255,230,214,0) 60%),radial-gradient(90% 60% at 100% 0%,#e6f3d5 0%,rgba(230,228,255,0) 65%),linear-gradient(#fbf1ec,var(--bg))}
.wrap{max-width:480px;margin:0 auto;padding:4px 16px 24px}
.top{position:sticky;top:0;z-index:20}
.top.solid{background:rgba(244,245,249,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .in{max-width:480px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:600}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sf);box-shadow:var(--sh);flex:none;position:relative}
.ib .bd{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.mode{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--warnBg);color:var(--warn);white-space:nowrap}
.mode.live{background:var(--okBg);color:var(--ok)}
.pagehead{margin:6px 2px 14px}.pagehead h1{font-size:28px;margin:0;font-weight:600;line-height:1.2}.pagehead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tile{background:var(--sf);border-radius:20px;box-shadow:var(--sh);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px}
.tile .tic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.tile .tic svg{width:18px;height:18px}
.tile b{font-size:24px;font-weight:600;line-height:1}
.tile span{font-size:12.5px;color:var(--mut);line-height:1.25}
.t-blu .tic{background:var(--accBg);color:var(--acc)}.t-grn .tic{background:var(--okBg);color:var(--ok)}.t-org .tic{background:var(--warnBg);color:var(--warn)}.t-red .tic{background:var(--redBg);color:var(--red)}
.shd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}
.shd h2{font-size:19px;margin:0;font-weight:600}
.sec{font-size:15px;font-weight:600;color:var(--ink2);margin:20px 2px 10px;display:flex;align-items:center;gap:8px}
.cnt{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:#e6e8ef;color:var(--ink2);font-size:12.5px;font-weight:600;display:inline-grid;place-items:center}
.mine-t{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 6px;border-radius:99px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);font-size:13.5px;font-weight:500;color:var(--ink2)}.mine-t b{font-weight:600;color:var(--mut)}
.mine-t .sw{width:30px;height:18px;border-radius:9px;background:#d5dae2;position:relative;transition:background .2s}.mine-t .sw i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mine-t.on{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}.mine-t.on .sw{background:var(--acc)}.mine-t.on .sw i{left:14px}.mine-t.on b{color:var(--acc)}
.scope button{min-height:36px;padding:0 13px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.scope button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.scope .cnt{min-width:20px;height:20px;font-size:11.5px;background:transparent;padding:0 2px}
.scope button.on .cnt{background:var(--ink);color:#fff;padding:0 6px}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}










.meta{color:var(--mut);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}.meta svg{width:15px;height:15px}
.segbar{display:flex;gap:4px;margin-top:12px}.segbar i{flex:1;height:7px;border-radius:99px;background:rgba(20,24,40,.09)}.segbar i.ok{background:var(--ok)}.segbar i.cur{background:var(--acc)}
.seglb{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:13.5px;color:var(--mut)}.seglb b{color:var(--ink);font-size:14px}
.seglb+.segbar{margin-top:6px}
.foot{display:flex;align-items:center;gap:8px;margin-top:14px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;flex:none;background:linear-gradient(135deg,#8dc63f,#4f9a12);box-shadow:0 0 0 2px #fff}

const COLS=['jobs','customers','sites','products','members','services','meters','messages','photos'];
class ConflictError extends Error{constructor(){super('งานนี้มีคนดำเนินการไปแล้ว');this.code='conflict'}}
/* งานสำรวจเป็นของฉันไหม: มี surveyorId → ตรง id · ไม่มี → ตรงชื่อ หรือส่งให้ทีมของฉัน (ข้อมูลแบบเดิม) */
function svMine(j,u){if(!j||!u)return false;if(j.surveyorId)return j.surveyorId===u.id;
  return (!!j.surveyor&&j.surveyor===u.name)||(!!u.team&&j.surveyTeam===u.team&&(!j.surveyor||j.surveyor===j.surveyTeam||/^ทีม \d/.test(j.surveyor)))}
class BaseAdapter{
  constructor(){this.c={};COLS.forEach(k=>this.c[k]={});this.subs=new Set();this.user=null}
  cache(){return this.c}
  me(){return this.user}
  onChange(cb){this.subs.add(cb);return()=>this.subs.delete(cb)}
  _emit(){this.subs.forEach(f=>{try{f()}catch(e){console.error(e)}})}
  isMine(j,u){
    u=u||this.user;if(!u||!j)return false;
    if(u.role==='lead'||u.role==='admin')return true;
    const n=u.name;
    return svMine(j,u)||supMine(j,u)||j.installTeam===n;
  }
  listMyJobs(userId){const u=userId===this.user?.id?this.user:this.userById(userId);return Object.values(this.c.jobs).filter(j=>this.isMine(j,u))}
  listAllJobs(){return Object.values(this.c.jobs)}
  userById(id){const m=this.c.members[id];return m?{id,...m}:null}
  async getJob(id){const d=await this._get('jobs/'+id);return d?{id,...d}:null}
  watchJob(id,cb){const f=()=>cb(this.c.jobs[id]||null);f();return this.onChange(f)}
  watchMyJobs(userId,cb){const f=()=>cb(this.listMyJobs(userId));f();return this.onChange(f)}
  listProducts(){return Object.values(this.c.products)}
  async updateJob(id,patch,historyEntry,expect){
    const cur=await this._get('jobs/'+id);
    if(!cur)throw new Error('ไม่พบงาน');
    if(expect&&(('stage' in expect&&cur.stage!==expect.stage)||('status' in expect&&cur.status!==expect.status)))throw new ConflictError();
    const now=Date.now();const p={...patch,updatedAt:now};
    if(historyEntry)p.history=[...(cur.history||[]),{at:now,by:this.user?.id||null,...historyEntry}].slice(-200);
    if('stage' in patch&&patch.stage!==cur.stage)p.stageSince=now;
    await this._update('jobs/'+id,p);
    await this.log(historyEntry?.kind==='handoff'||historyEntry?.kind==='back'||historyEntry?.kind==='surveyed'?'stage':'edit',
      historyEntry?.text||'แก้ไขงาน',{col:'jobs',docId:id,title:cur.title||cur.jobNo||'',fields:Object.keys(patch)});
    return {id,...cur,...p};
  }
  async updateSite(id,patch){await this._update('sites/'+id,{...patch,updatedAt:Date.now()});await this.log('edit','แก้ไขข้อมูลไซต์',{col:'sites',docId:id,title:this.c.sites[id]?.label||'',fields:Object.keys(patch)})}
  listPhotos(jobId){return Object.values(this.c.photos).filter(p=>p.jobId===jobId).sort((a,b)=>a.at-b.at)}
  async removePhoto(id){const p=this.c.photos[id];await this._delete('photos/'+id);await this.log('del','ลบรูป '+(p?.kind||''),{col:'photos',docId:id,title:p?.jobId||'',fields:[]})}
  async addPhoto(jobId,kind,blob){
    const dataRef=typeof blob==='string'?blob:await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)});
    const id=rid('ph');const doc={jobId,kind,dataRef,at:Date.now(),by:this.user?.id||null};
    await this._set('photos/'+id,doc);await this.log('new','เพิ่มรูป '+kind,{col:'photos',docId:id,title:jobId,fields:['kind']});
    return {id,...doc};
  }
  async addMessage(jobId,text,kind='msg',extra={}){
    const id=rid('m');const doc={jobId,at:Date.now(),by:this.user?.id||null,text:String(text||''),kind,...extra};
    await this._set('messages/'+id,doc);await this.log('new','ข้อความในงาน',{col:'messages',docId:id,title:jobId,fields:['text']});
    return {id,...doc};
  }
  async saveService(doc){
    const id=doc.id||rid('sv');const {id:_,...d}=doc;const isNew=!doc.id;
    const o={...(isNew?{createdAt:Date.now(),createdBy:this.user?.id||null}:{}),...d};
    await (isNew?this._set('services/'+id,o):this._update('services/'+id,o));
    await this.log(isNew?'new':'edit',(o.type||'')+' '+(o.symptom||o.action||''),{col:'services',docId:id,title:o.siteId||'',fields:Object.keys(d)});
    return {id,...o};
  }
  async updateMeter(id,patch){await this._update('meters/'+id,patch);await this.log('edit','สมาร์ทมิเตอร์ '+id,{col:'meters',docId:id,title:id,fields:Object.keys(patch)})}
  async log(act,text,extra={}){
    const id=rid('lg');
    try{await this._set('logs/'+id,{at:Date.now(),by:this.user?.id||null,name:this.user?.name||'',act,text,col:'',docId:'',title:'',fields:[],...extra})}
    catch(e){console.warn('log failed',e)}
  }
}
class DemoAdapter extends BaseAdapter{
  constructor(seed){super();this.mode='demo';this.logs=[];Object.keys(seed).forEach(k=>{this.c[k]=Object.fromEntries(Object.entries(seed[k]).map(([id,d])=>[id,{id,...d}]))})}
  async init(userId){this.user=this.userById(userId);return this.user}
  _split(p){const i=p.indexOf('/');return [p.slice(0,i),p.slice(i+1)]}
  async _get(p){const [c,id]=this._split(p);if(c==='logs')return null;return clone(this.c[c]?.[id]||null)}
  async _set(p,d){const [c,id]=this._split(p);if(c==='logs'){this.logs.push({id,...d});return}
    (this.c[c]||(this.c[c]={}))[id]={id,...clone(d)};this._emit()}
  async _delete(p){const [c,id]=this._split(p);if(this.c[c])delete this.c[c][id];this._emit()}
  async _update(p,d){const [c,id]=this._split(p);const cur=this.c[c]?.[id];if(!cur)throw new Error('not found');this.c[c][id]={...cur,...clone(d)};this._emit()}
}
class ClaudeDbAdapter extends BaseAdapter{
  constructor(db,user){super();this.mode='live';this.db=db;this.u=user;this.loaded=new Set()}
  async init(){
    const uid=await this.u.id();
    await new Promise(res=>{
      const t=setTimeout(res,10000);
      COLS.forEach(col=>this.db.collection(col).onSnapshot(snap=>{
        const o={};snap.docs.forEach(d=>{o[d.id]={id:d.id,...d.data()}});this.c[col]=o;
        this.loaded.add(col);if(this.loaded.size===COLS.length){clearTimeout(t);res()}
        this._emit();
      },e=>{console.warn(col,e);this.loaded.add(col);if(this.loaded.size===COLS.length){clearTimeout(t);res()}}));
    });
    const m=this.c.members[uid]||{};let name='';
    try{const ps=await this.u.profiles([uid]);name=ps?.[uid]?.name||''}catch(e){}
    this.user={id:uid,name:m.name||name||'ผู้ใช้',role:m.role||'',team:m.team||''};
    return this.user;

function msgResolve(mid){const m=C().messages[mid];if(!m)return;
  const md=$('#modal');md.innerHTML=`<div class="ov" data-ov><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mrT"><h3 id="mrT">แจ้งว่าแก้แล้ว</h3><p style="margin-bottom:10px">เรื่อง: ${esc(m.text)}</p>
    <label class="fl"><span>ข้อความเพิ่มเติม (ไม่บังคับ)</span><textarea id="mr-t" rows="2" placeholder="เช่น เพิ่มรูปมิเตอร์ในใบสำรวจแล้ว"></textarea></label>
    <div class="acts"><button class="btn" data-no>ยกเลิก</button><button class="btn pri" data-yes>${ic('check')}ส่ง แก้แล้ว</button></div></div></div>`;
  const done=()=>{md.innerHTML=''};
  md.querySelector('[data-no]').onclick=done;md.querySelector('[data-ov]').onclick=e=>{if(e.target.dataset.ov!==undefined)done()};
  md.querySelector('[data-yes]').onclick=async()=>{const t=$('#mr-t').value.trim();done();
    try{await S.api.addMessage(m.jobId,t||'แก้แล้ว','resolved',{replyTo:mid});toast('ส่งแล้ว')}catch(e){toast('ส่งไม่สำเร็จ ลองอีกครั้ง')}};
  $('#mr-t').focus();
}
function viewJob(id){
  const j=C().jobs[id];
  if(!j)return topBar('รายละเอียดงาน',{back:true})+`<main class="wrap">${emptyBox('ไม่พบงานนี้','อาจถูกลบหรือย้ายไปแล้ว','x')}</main>`;
  markSeen(j.id+':'+j.stage);
  const c=cOf(j),s=sOf(j),r=j.request||{},stt=statusOf(j);
  const row=(l,v)=>v?`<div class="sr"><span>${l}</span><b>${v}</b></div>`:'';
  const hist=(j.history||[]).slice().reverse().slice(0,6);
  const nameOf=uid=>C().members[uid]?.name||(uid?'ผู้ใช้':'ระบบ');
  let now=STAGES[j.stage]?.name||'',next='',prog='';
  if(j.status==='done'){now='ปิดงานแล้ว';next='ดูแลหลังการขาย (PM/CM)'}
  else if(j.status==='cancelled'){now='ยกเลิก';next=j.cancelReason||''}
  else if(j.status==='lost'){now='ลูกค้ายังไม่ตกลง';next='รอเซลส์ติดตาม'}
  else{const nx=STAGES[j.stage+1];next=nx?nx.name:'';
    if(j.stage===ST.SURVEY){const st=svSteps(j,s),n=st.filter(x=>x.ok).length;now=needDraw(j)?'รอวาดแบบที่ออฟฟิศ':'กำลังสำรวจ';
      prog=`<div class="seglb"><span>ขั้นย่อยงานสำรวจ</span><b>${n}/8</b></div><div class="segbar">${st.map(x=>`<i class="${x.ok?'ok':''}"></i>`).join('')}</div>`}}
  const pv=hasSurvey(j)?propsView(j):[];
  const qa=[['nav','นำทาง',`data-map="${esc(j.id)}"`,!!mapUrl(j)],['phone','โทร',`data-tel="${esc(j.id)}"`,!!telOf(j)],
    ['doc','ใบสำรวจ',`data-go="#rpt-${esc(j.id)}"`,hasSurvey(j)],['cam','บันทึกสลิป',`data-slipimg="${esc(j.id)}"`,hasSurvey(j)]];
  const appt=j.stage<=ST.SURVEY?row('วันนัดสำรวจ',fd(j.surveyDate||j.queueDate)+(j.queueTime?' · '+esc(j.queueTime):''))+row('ผู้สำรวจ',esc([j.surveyor||'ยังไม่ระบุ',j.surveyTeam].filter(Boolean).join(' · ')))
    :row('วันติดตั้ง',j.installDate?fdRange(j.installDate,j.installEnd):'ยังไม่กำหนด')+row('ผู้คุมงาน',esc(j.supervisor||'ยังไม่ระบุ'))+row('ทีมติดตั้ง',esc(j.installTeam||'ยังไม่ระบุ'))+row('ผู้สำรวจ',esc(j.surveyor||''));
  const cta=j.stage===ST.SURVEY?(canTake(j)?`<button class="btn blu" data-take="${esc(j.id)}">${ic('swap')}รับงานต่อ แล้วสำรวจ</button>`:canAct(j)?`<button class="btn pri" data-go="#ns-${esc(j.id)}">${ic('play')}${j.sv?.onsite?'สำรวจต่อ':'เริ่มสำรวจ'}</button>`:'')
    :j.stage===ST.COMM?(canTake(j)?`<button class="btn blu" data-take="${esc(j.id)}">${ic('swap')}รับงานต่อ แล้วปิดงานติดตั้ง</button>`:icCan(j)?`<button class="btn pri" data-go="#ic-${esc(j.id)}">${ic('check')}ปิดงานติดตั้ง</button>`:'')
    :j.stage===ST.INSTALL&&j.status==='active'&&me().role==='lead'?`<button class="btn pri" data-lead="${esc(j.id)}">${ic('users')}มอบงานติดตั้ง</button>`:'';
  return `<div class="jb"><div class="hbin">
    <div class="jbt"><button class="jbk" data-back aria-label="ย้อนกลับ">${ic('back')}</button><span class="jbn">#${esc(j.jobNo||'—')}</span>${S.api.mode==='demo'?'<span class="hbm">ข้อมูลตัวอย่าง</span>':''}</div>
    <h1>${esc(j.title||s.label||'งาน')}</h1><p>${esc([c.name,s.area].filter(Boolean).join(' · '))}</p></div></div>
   <main class="wrap jm ${cta?'hasbar':''}">
    <section class="qa jqa">${qa.map(([i,t,a,on])=>`<button ${a} ${on?'':'disabled'}><span class="ki ki-b">${ic(i)}</span><small>${t}</small></button>`).join('')}</section>
    ${canTake(j)?`<div class="take"><b>งานนี้ของ ${esc(assignee(j)||'ยังไม่ระบุ')}</b><p>ถ้าเจ้าของงานติดธุระ กดรับงานต่อแล้วทำแทนได้ทันที ระบบบันทึกในประวัติงาน</p><button class="btn blu" style="width:100%" data-take="${esc(j.id)}">${ic('swap')}รับงานต่อ</button></div>`:''}
    ${openReqs(j.id).map(m=>`<button class="alert alb" data-msgjump>${ic('bolt')}<span><b>${esc((C().members[m.by]||{}).name?C().members[m.by].name+' ':'')}ขอข้อมูลเพิ่ม</b>${esc(m.text)}</span>${ic('go')}</button>`).join('')}
    <section class="card jc2"><div class="jst"><span class="pill ${stt.c==='f-red'?'r':stt.c==='f-grn'?'g':''}">${esc(now)}</span><small>ขั้น ${j.stage} จาก 8</small></div>${prog}
     ${next?`<div class="jnx">${ic('go')}<span>ถัดไป: <b>${esc(next)}</b></span></div>`:''}</section>
    ${pv.length?`<section class="card jc2"><div class="jh"><b>สิ่งที่เสนอ</b>${pv.length>1?`<span class="cnt">${pv.length} แบบ</span>`:''}</div>
      ${pv.map((p,k)=>`<div class="slp"><div class="slph"><span>${pv.length>1?'แบบที่ '+(k+1)+' · ':''}${esc(p.systemType||'')}</span><b>${p.kw?esc(p.kw)+' kW':'—'}</b></div>
       ${quoteItems(j,p).map(x=>`<div class="sr it"><span>${esc(x.t)}</span><b>${x.approx?'~':''}${esc(x.q)} <em>${x.u}</em></b></div>`).join('')}</div>`).join('')}</section>`:''}
    <section class="card jc2"><div class="jh"><b>ลูกค้าและไซต์</b></div>${row('ลูกค้า',esc(c.name||'—'))}${row('โทร',esc(c.phone||''))}${row('ที่อยู่',esc(s.address||''))}${row('ทีมขาย',esc([j.salesTeam,j.salesPerson].filter(Boolean).join(' · ')))}</section>
    <section class="card jc2"><div class="jh"><b>นัดหมาย</b></div>${appt}${j.folderUrl&&safeUrl(j.folderUrl)?`<div class="sr"><span>โฟลเดอร์งาน</span><b><button class="lk" style="min-height:0;padding:0" data-open="${esc(j.folderUrl)}">เปิดใน Google Drive</button> · <button class="lk" style="min-height:0;padding:0" data-fname="${esc(j.id)}">เปลี่ยนชื่อ</button></b></div>`:''}
     ${r.systemType||r.wantKwp?row('ลูกค้าอยากได้',esc([r.systemType,r.wantKwp?r.wantKwp+' kWp':''].filter(Boolean).join(' · '))):''}
     ${j.salesNote?`<div class="jnote"><small>หมายเหตุจากเซลส์</small>${esc(j.salesNote)}</div>`:''}${j.woNote?`<div class="jnote"><small>หมายเหตุใบงาน</small>${esc(j.woNote)}</div>`:''}</section>
    ${chatCard(j)}
    ${hist.length?`<section class="card jc2"><div class="jh"><b>ความเคลื่อนไหวล่าสุด</b></div><ul class="tl hist">${hist.map(x=>`<li><span class="dt"></span><b>${esc(x.text)}</b><small>${fdt(x.at)} · ${esc(nameOf(x.by))}</small></li>`).join('')}</ul></section>`:''}
   </main>${cta?`<div class="abar"><div class="in" style="display:grid;gap:8px">${canBack(j)?`<button class="btn" data-bfjob="${esc(j.id)}">${ic('doc')}สำรวจไปแล้ว · กรอกย้อนหลัง</button>`:''}${cta}</div></div>`:''}`;
}
function scopeBar(){
  const u=me();if(u.role==='lead')return '';
  const nAll=S.api.listAllJobs().filter(actionable).length,nMine=S.api.listAllJobs().filter(j=>actionable(j)&&ownedByMe(j)).length;
  const on=S.scope==='mine';
  return `<button class="mine-t ${on?'on':''}" data-scope="${on?'all':'mine'}" aria-pressed="${on}"><span class="sw"><i></i></span>เฉพาะงานของฉัน <b>${nMine}</b></button>`;
}
function pendBanner(){return S.pending.length?`<div class="pend">${ic('cloud')}รอส่ง ${S.pending.length} รายการ (จะส่งเมื่อมีสัญญาณ)</div>`:''}
function navBar(r){
  const u=me();const nNew=S.api.listMyJobs(u.id).filter(unread).length;
  const B=(h,k,t,icon,bd='')=>`<button data-go="${h}" class="${r===k?'on':''}" aria-label="${t}" ${r===k?'aria-current="page"':''}>${ic(icon)}<span>${t}</span>${bd}</button>`;
  return `<nav class="nav" aria-label="เมนูหลัก"><div class="in">${B('#today','today','หน้าหลัก','home')}${B('#mine','mine','งาน','list',nNew?`<span class="bd">${nNew}</span>`:'')}
   <button class="navc" data-qa="#find" aria-label="ค้นหางาน"><span>${ic('search')}</span><small>ค้นหา</small></button>${B('#service','service','บริการ','tool')}${B('#me','me','ฉัน','me')}</div></nav>`;
}

const readDataUrl=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('อ่านไฟล์ไม่ได้'));r.readAsDataURL(f)});
async function decodeImg(file){
  if(window.createImageBitmap){try{const bm=await createImageBitmap(file);return {src:bm,w:bm.width,h:bm.height,close:()=>bm.close&&bm.close()}}catch(e){}}
  const url=await readDataUrl(file);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('ถอดรหัสรูปไม่ได้'));i.src=url});
  return {src:img,w:img.naturalWidth,h:img.naturalHeight,close(){}};
}
async function shrink(file,max=1280,q=.72){
  const im=await decodeImg(file);
  try{const r=Math.min(1,max/Math.max(im.w,im.h));const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.w*r));c.height=Math.max(1,Math.round(im.h*r));c.getContext('2d').drawImage(im.src,0,0,c.width,c.height);
    let d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);return d}
  finally{im.close()}
}

function initSig(){

  if(!S.sig||S.sig.id!==id)S.sig={id,strokes:[]};
  const box=cv.parentElement,w=box.clientWidth,h=200,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  const draw=()=>{g.clearRect(0,0,w,h);S.sig.strokes.forEach(s=>{g.beginPath();s.forEach(([x,y],i)=>i?g.lineTo(x*w,y*h):g.moveTo(x*w,y*h));g.stroke()});$('#sigph').hidden=S.sig.strokes.length>0};
  draw();let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];S.sig.strokes.push(cur);draw()};
  cv.onpointermove=e=>{if(!cur)return;cur.push(pt(e));draw()};

async function nsSave(id,pg){

      if(u.role==='lead'){u.realRole='lead';u.role='eng'}
      if(u.role!=='eng'){S.api=null;landing('บัญชีนี้ใช้ Man ไม่ได้ ให้ผู้ดูแลระบบตั้งค่าใน Console');return}
      render();window.__splOut&&__splOut();
    }catch(e){console.error(e);S.api=null;landing((e&&e.message)||'เชื่อมต่อไม่สำเร็จ')}
    return;
  }
  if(!window.claude||typeof window.claude.use!=='function'){landing('เปิดหน้านี้บน claude.ai เพื่อใช้ข้อมูลจริง หรือกดดูตัวอย่างได้เลย');return}
  landing('กำลังเชื่อมต่อฐานข้อมูล…');
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){landing('ยังเชื่อมต่อฐานข้อมูลไม่ได้ (ต้องลงชื่อเข้าใช้ claude.ai) กดดูตัวอย่างได้');return}
    S.api=new ClaudeDbAdapter(db,user);S.api.onChange(schedule);
    const u=await S.api.init();
    if(!['eng','lead','admin'].includes(u.role)){S.api=null;landing('บัญชีนี้ยังไม่ได้ตั้งค่า ให้ผู้ดูแลระบบตั้งค่าใน Console');return}
    S.api.log('login','เข้า Man');render();window.__splOut&&__splOut();
  }catch(e){console.error(e);S.api=null;landing('เชื่อมต่อไม่สำเร็จ กดดูตัวอย่างได้')}
}
const DEVICES=[['360','Android 360',360,780],['390','iPhone 390',390,844],['430','Pro Max 430',430,932]];
const FR={on:lsGet('cle.frame',null),dev:lsGet('cle.dev','390')};
function frameApply(){
  const wide=innerWidth>=600&&matchMedia('(pointer:fine)').matches;
  const on=FR.on===null?wide:FR.on&&innerWidth>=480;
  const d=DEVICES.find(x=>x[0]===FR.dev)||DEVICES[1];
  const H=document.documentElement;H.classList.toggle('framed',on);
  H.style.setProperty('--pw',d[2]+'px');H.style.setProperty('--ph',d[3]+'px');
  H.style.setProperty('--sc',String(Math.min(1,(innerHeight-24)/(d[3]+24),(innerWidth-24)/(d[2]+24))));
  const dv=$('#dev');dv.hidden=innerWidth<480;
  dv.innerHTML=on?DEVICES.map(x=>`<button data-dev="${x[0]}" class="${x[0]===d[0]?'on':''}">${x[1]}</button>`).join('')+'<button data-frame="0" aria-label="ปิดกรอบมือถือ">'+ic('x')+'</button>'
    :'<button data-frame="1">แสดงในกรอบมือถือ</button>';
  const t=new Date();$('#sbt').textContent=t.getHours()+':'+pad(t.getMinutes());
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dev],[data-frame]');if(!b)return;
  if(b.dataset.dev){FR.dev=b.dataset.dev;lsSet('cle.dev',FR.dev)}else{FR.on=b.dataset.frame==='1';lsSet('cle.frame',FR.on)}frameApply()});
addEventListener('resize',frameApply);setInterval(frameApply,30000);frameApply();
boot();
</script>
