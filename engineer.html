:root{--bg:#f4f5f9;--top:#eef6e4;--sf:#fff;--ink:#16171d;--ink2:#3a3d47;--mut:#6b6f7b;--mut2:#6a6f7e;--ln:#e8eaf0;--hv:#f5f6fa;
 --acc:#44840f;--accTx:#3d7c0e;--accBg:#e8f5d9;--accSoft:#f2f9e9;--ok:#16a34a;--okBg:#dcf7e6;--okSoft:#ecfaf1;--warn:#c2570c;--warnBg:#ffedd8;--warnSoft:#fff5ea;
 --red:#d52222;--redBg:#fee2e2;--redSoft:#fff1f1;--vio:#7c5cff;--vioBg:#efeaff;
 --r:24px;--sh:0 1px 2px rgba(20,24,40,.04),0 0 0 1px rgba(20,24,40,.05),0 10px 24px -16px rgba(20,24,40,.22);
 --f:'Prompt','Sarabun','Noto Sans Thai','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--nav:70px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--safe))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
#app{position:relative;isolation:isolate}
.glow{position:absolute;inset:0 0 auto 0;height:360px;z-index:-1;pointer-events:none;
 background:radial-gradient(120% 70% at 0% 0%,#e3f2cf 0%,rgba(228,226,255,0) 60%),radial-gradient(90% 60% at 100% 0%,#edf7e0 0%,rgba(220,234,255,0) 65%),linear-gradient(var(--top),var(--bg))}
.glow.warm{background:radial-gradient(110% 70% at 0% 0%,#ffe6d6 0%,rgba(255,230,214,0) 60%),radial-gradient(90% 60% at 100% 0%,#e6f3d5 0%,rgba(230,228,255,0) 65%),linear-gradient(#fbf1ec,var(--bg))}
.wrap{max-width:480px;margin:0 auto;padding:4px 16px 24px}
.top{position:sticky;top:0;z-index:20}
.top.solid{background:rgba(244,245,249,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .in{max-width:480px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:8px}
.top .ttl{flex:1;min-width:0;text-align:center;font-size:16px;font-weight:600}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sf);box-shadow:var(--sh);flex:none;position:relative}
.ib .bd{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.mode{font-size:12px;font-weight:600;padding:4px 8px;border-radius:99px;background:var(--warnBg);color:var(--warn);white-space:nowrap}
.mode.live{background:var(--okBg);color:#117d39}
.pagehead{margin:8px 2px 16px}.pagehead h1{font-size:28px;margin:0;font-weight:600;line-height:1.2}.pagehead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--sf);border-radius:20px;box-shadow:var(--sh);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px}
.tile .tic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.tile .tic svg{width:18px;height:18px}
.tile b{font-size:24px;font-weight:600;line-height:1}
.tile span{font-size:12px;color:var(--mut);line-height:1.25}
.t-blu .tic{background:var(--accBg);color:var(--accTx)}.t-grn .tic{background:var(--okBg);color:var(--ok)}.t-org .tic{background:var(--warnBg);color:var(--warn)}.t-red .tic{background:var(--redBg);color:var(--red)}
.shd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px}
.shd h2{font-size:20px;margin:0;font-weight:600}
.sec{font-size:16px;font-weight:600;color:var(--ink2);margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.cnt{min-width:22px;height:22px;padding:0 8px;border-radius:99px;background:#e6e8ef;color:var(--ink2);font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.mine-t{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 8px;border-radius:99px;background:var(--sf);box-shadow:inset 0 0 0 1.5px var(--ln);font-size:14px;font-weight:500;color:var(--ink2)}.mine-t b{font-weight:600;color:var(--mut)}
.mine-t .sw{width:30px;height:18px;border-radius:9px;background:#d5dae2;position:relative;transition:background .2s}.mine-t .sw i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mine-t.on{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--accTx)}.mine-t.on .sw{background:var(--acc)}.mine-t.on .sw i{left:14px}.mine-t.on b{color:var(--accTx)}
.scope button{min-height:36px;padding:0 12px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut);display:inline-flex;align-items:center;gap:8px}
.scope button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.scope .cnt{min-width:20px;height:20px;font-size:12px;background:transparent;padding:0 2px}
.scope button.on .cnt{background:var(--ink);color:#fff;padding:0 8px}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}










.meta{color:var(--mut);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}.meta svg{width:15px;height:15px}
.segbar{display:flex;gap:4px;margin-top:12px}.segbar i{flex:1;height:7px;border-radius:99px;background:rgba(20,24,40,.09)}.segbar i.ok{background:var(--ok)}.segbar i.cur{background:var(--acc)}
.seglb{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:14px;color:var(--mut)}.seglb b{color:var(--ink);font-size:14px}
.seglb+.segbar{margin-top:8px}
.foot{display:flex;align-items:center;gap:8px;margin-top:16px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;flex:none;background:linear-gradient(135deg,#8dc63f,#4f9a12);box-shadow:0 0 0 2px #fff}

        const o={};snap.docs.forEach(d=>{o[d.id]={id:d.id,...d.data()}});this.c[col]=o;
        this.loaded.add(col);if(COLS_WAIT.every(c=>this.loaded.has(c))){clearTimeout(t);res()}

    });
    const m=this.c.members[uid]||{};let name='';
    try{const ps=await this.u.profiles([uid]);name=ps?.[uid]?.name||''}catch(e){}

async function scanCodes(f){   // คืนข้อความบาร์โค้ด/QR ทั้งหมดในรูป (ไม่ซ้ำ)
  const out=[],add=v=>{v=String(v||'').trim();if(v&&!out.includes(v))out.push(v)};
  if('BarcodeDetector' in window){try{(await new BarcodeDetector().detect(await createImageBitmap(f))).forEach(r=>add(r.rawValue))}catch(e){}}
  if(out.length)return out;
  const Z=await zxLoad(),O={tryHarder:true,maxNumberOfSymbols:8};
  let R=[];try{R=await Z.readBarcodes(f,O)}catch(e){}
  if(!R.some(r=>r.isValid)){try{const b=await createImageBitmap(f),k=Math.min(1,3000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);R=await Z.readBarcodes(x.getImageData(0,0,c.width,c.height),O)}catch(e){}}
  R.filter(r=>r.isValid).forEach(r=>add(r.text));return out;
}

function initSig(){
  const cv=$('#sigpad');if(!cv)return;const id=route().slice(3);
  if(!S.sig||S.sig.id!==id)S.sig={id,strokes:[]};
  const box=cv.parentElement,w=box.clientWidth,h=200,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  const draw=()=>{g.clearRect(0,0,w,h);S.sig.strokes.forEach(s=>{g.beginPath();s.forEach(([x,y],i)=>i?g.lineTo(x*w,y*h):g.moveTo(x*w,y*h));g.stroke()});$('#sigph').hidden=S.sig.strokes.length>0};
  draw();let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];S.sig.strokes.push(cur);draw()};
  cv.onpointermove=e=>{if(!cur)return;cur.push(pt(e));draw()};
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
}

}

async function nsSave(id,pg){

function lPdfBlob(pages){

  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const n=pages.length,kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  pages.forEach((p,i)=>{const pg=3+i*3,im=pg+1,ct=pg+2,cs=enc.encode(`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`);
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${ct} 0 R >>`);
    obj(im,`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>`,p.jpg);

}

function ask(title,text,{ok='ยืนยัน',danger=false}={}){

    const done=v=>{m.innerHTML='';document.removeEventListener('keydown',kd);res(v)};
    const kd=e=>{if(e.key==='Escape')done(false)};document.addEventListener('keydown',kd);
    m.querySelector('[data-yes]').onclick=()=>done(true);m.querySelector('[data-no]').onclick=()=>done(false);

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('article[data-go],[data-go][tabindex]')){e.preventDefault();go(e.target.dataset.go)}});

function onField(e){const el=e.target;const f=el.dataset?.f;if(!f)return;const id=route().slice(3);const j=C().jobs[id];if(!j)return;
  if(el.type==='radio'&&!el.checked)return;const d=draftOf(j);setP(d,f,el.type==='checkbox'?el.checked:el.value);
  if(/^props\.\d+\.panelQty$/.test(f)){const h=$('#kwphint'),n=+el.value||0;if(h)h.textContent=n?`รวม ${kwpOf(n)} kWp`:'ใส่จำนวนแผง'}
  if(/^props\.\d+\.batteryModel$/.test(f)){if(el.value&&!d.props[+f.split('.')[1]].batteryQty)d.props[+f.split('.')[1]].batteryQty=1;rerenderEq(d)}
  if(/^props\.\d+\.(proposedModel|batteryQty)$/.test(f)&&el.type!=='number'||/^props\.\d+\.batteryQty$/.test(f)){rerenderEq(d);if(el.type==='number')setTimeout(()=>{const x=document.getElementById(el.id);if(x){x.focus()}},0)}
  if(/^props\.\d+\.(proposedModel|inverterQty)$/.test(f)){const k=+f.split('.')[1],l=$('#kwline b');if(l){const v=kwOf(d.props[k]);l.textContent=v?v+' kW':'—'}}
    if(f==='site.phase'||f==='request.systemType'||/^props\.\d+\.systemType$/.test(f)){if(fixProps(d))toast('ล้างรุ่นอินเวอร์เตอร์ที่ไม่ตรงเฟส/ระบบแล้ว');rerenderEq(d)}
  if(f==='signWho'){const cn=cOf(j).name||'';if(el.value==='ผู้แทน'&&d.signName===cn)d.signName='';if(el.value==='ลูกค้า'&&!d.signName)d.signName=cn;render()}}

function landing(msg){

async function boot(){
  if(!(window.CLEANLINE_CONFIG&&CLEANLINE_CONFIG.api&&window.CLGDB)){landing('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต แล้วกดลองอีกครั้ง');return}
  try{
    const {db,user}=await CLGDB.connect('engineer');
    S.api=new ClaudeDbAdapter(db,user);S.api.onChange(schedule);
    const u=await S.api.init();
    /* หัวหน้าตรวจแบบ = ทำงานได้แบบวิศวกร (มอบงานติดตั้งย้ายไปเว็บแอดมินของหัวหน้าจัดงาน) */
    if(u.role==='lead'){u.realRole='lead';u.role='eng'}
    if(u.role!=='eng'){S.api=null;landing('บัญชีนี้ใช้ Man ไม่ได้ ให้ผู้ดูแลระบบตั้งค่าใน Console');return}
    render();window.__splOut&&__splOut();
  }catch(e){console.error(e);S.api=null;landing((e&&e.message)||'เชื่อมต่อไม่สำเร็จ')}
}
const DEVICES=[['360','Android 360',360,780],['390','iPhone 390',390,844],['430','Pro Max 430',430,932]];
const FR={on:lsGet('cle.frame',null),dev:lsGet('cle.dev','390')};
function frameApply(){
  const wide=innerWidth>=600&&matchMedia('(pointer:fine)').matches;
  const on=FR.on===true&&innerWidth>=480;   // จอคอม: ค่าเริ่ม = เลย์เอาต์จอคอม (เดิมเปิดกรอบมือถือ) · กรอบมือถือเปิดได้จากปุ่มมุมซ้าย
  const d=DEVICES.find(x=>x[0]===FR.dev)||DEVICES[1];
  const H=document.documentElement;H.classList.toggle('framed',on);
  const dk=!on&&innerWidth>=1024,was=H.classList.contains('desk');H.classList.toggle('desk',dk);if(dk!==was&&S.api&&S.api.me())render();
  H.style.setProperty('--pw',d[2]+'px');H.style.setProperty('--ph',d[3]+'px');
  H.style.setProperty('--sc',String(Math.min(1,(innerHeight-24)/(d[3]+24),(innerWidth-24)/(d[2]+24))));
  const dv=$('#dev');dv.hidden=innerWidth<480;
  dv.innerHTML=on?DEVICES.map(x=>`<button data-dev="${x[0]}" class="${x[0]===d[0]?'on':''}">${x[1]}</button>`).join('')+'<button data-frame="0" aria-label="ปิดกรอบมือถือ">'+ic('x')+'</button>'
    :'<button data-frame="1">แสดงในกรอบมือถือ</button>';
  const t=new Date();$('#sbt').textContent=t.getHours()+':'+pad(t.getMinutes());
}
