<!doctype html>
<html lang="th">
<head>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;600&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEANLINE Console</title>
<meta name="robots" content="noindex">
<style>
/* Console โฉมกระจก (27 พ.ย. 69) — แผงกระจกฝ้าบนฟ้ารุ่งสาง · ตัวหนังสือขั้นต่ำ 14px
   ชื่อคลาสเดิมคงไว้ทั้งหมด (card pill btn row …) หน้าเดิมเปลี่ยนแค่หน้าตา */
:root{--t:#f4f7f6;--m:rgba(244,247,246,.76);--m2:rgba(244,247,246,.6);--g:rgba(10,32,42,.36);--gl:rgba(255,255,255,.08);--b:rgba(255,255,255,.2);--sun:#ffc46b;--leaf:#b6e35a;--warnc:#ff9a7a;--sky:#bdf0f2;
 --ink:#f4f7f6;--sub:rgba(244,247,246,.76);--line:rgba(255,255,255,.12);--card:var(--g);--acc:#b6e35a;--accS:rgba(182,227,90,.18);--bad:#ff8a73;--badS:rgba(255,138,115,.2);--warn:#ffc46b;--warnS:rgba(255,196,107,.18);--r:24px}
*{box-sizing:border-box;min-width:0}html,body{margin:0}
body{font-family:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;color:var(--t);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;background:#0b2230}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 600px at 92% 108%,rgba(255,200,120,.55),transparent 60%),radial-gradient(700px 420px at 18% -8%,rgba(127,211,216,.35),transparent 70%),linear-gradient(172deg,#0b2230 0%,#103a4c 36%,#1f6468 66%,#5f7d68 86%,#b98a5a 100%)}
::selection{background:rgba(255,196,107,.4)}
.glass,.card,aside,.prbar,#modal .bx{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 40px -24px rgba(0,0,0,.55)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside{margin:16px 0 16px 16px;border-radius:26px;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto}
.brand{font-weight:700;font-size:20px;letter-spacing:.06em;padding:0 10px}.brand i{font-style:normal;color:var(--leaf)}.brand small{display:none}
nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:14px;color:var(--m2);padding:14px 12px 4px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:13px;display:flex;align-items:center;gap:11px;color:var(--m);font-size:15px}
nav button svg,.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.08);color:var(--t)}nav button.on{background:rgba(255,255,255,.93);color:#0b2230;font-weight:600}
nav button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
nav .n{margin-left:auto;background:var(--warnc);color:#2a0d05;border-radius:999px;font-size:14px;min-width:22px;text-align:center;padding:0 6px;line-height:22px;font-weight:600}
nav .n.s{background:var(--sun)}
.kbd{margin:14px 6px 0;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--b);color:var(--m);font-size:14px;cursor:pointer;font:inherit;font-size:14px;text-align:left}
.kbd:hover{color:var(--t)}.kbd kbd{margin-left:auto;font:inherit;font-size:14px;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.12)}
.me{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--m2)}
.me b{display:block;color:var(--t);font-size:15px;font-weight:600}.me a,.me button{color:var(--t);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:none;margin-right:14px;opacity:.85}.me a:hover,.me button:hover{opacity:1;text-decoration:underline}
main{padding:28px 32px 60px;max-width:1520px;width:100%}
h1{font-size:32px;line-height:1.2;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}.lead{color:var(--m);margin:0 0 22px}
.card{border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;font-weight:500;background:var(--accS);color:#dcf6ab;white-space:nowrap}
.pill.bad{background:var(--badS);color:#ffd0c5}.pill.warn{background:var(--warnS);color:#ffe2b0}.pill.gray{background:rgba(255,255,255,.12);color:var(--t)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:14px;color:var(--m2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.who{display:flex;align-items:center;gap:10px}.who img,.av{width:34px;height:34px;border-radius:50%;background:var(--accS);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:600;color:#dcf6ab}
.who small{display:block;color:var(--m2);font-size:14px}
select,input[type=text],input[type=search],input[type=tel],input[type=number],textarea{font:inherit;font-size:15px;border:1px solid var(--b);border-radius:12px;padding:8px 11px;background:rgba(4,18,26,.38);color:var(--t);min-width:0}
select option{color:#0a1a24;background:#fff}
input::placeholder,textarea::placeholder{color:rgba(244,247,246,.5)}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input[type=text],input[type=tel]{width:150px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid #fff;border-radius:999px;padding:8px 16px;cursor:pointer;background:#fff;color:#0b2230;white-space:nowrap;min-height:38px;transition:background .15s}

.btn.l{background:rgba(255,255,255,.1);border-color:var(--b);color:var(--t)}.btn.l:hover{background:rgba(255,255,255,.18)}
.btn.g{background:var(--leaf);border-color:var(--leaf);color:#14260a}.btn.bad{background:var(--bad);border-color:var(--bad);color:#2a0d05}.btn.sm{padding:5px 13px;min-height:34px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.empty{color:var(--m);text-align:center;padding:26px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--gl);border-radius:16px;padding:14px}.stat b{display:block;font-size:24px;font-weight:600}.stat span{color:var(--m);font-size:14px}
.log td{font-size:15px;padding:8px 10px}.log .t{white-space:nowrap;color:var(--m2);font-size:14px}
.note{background:var(--warnS);border:1px solid rgba(255,196,107,.35);border-radius:14px;padding:10px 14px;font-size:14px;color:#ffe7bf}
.ok{background:var(--accS);border-radius:14px;padding:10px 14px;font-size:14px;color:#e2f7bc}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}.switch input{display:none}
.switch i{width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;transition:.2s}.switch i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--warnc)}.switch input:checked+i:after{left:23px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#0b2230;font-weight:600;border-radius:999px;padding:10px 20px;font-size:15px;z-index:70;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad);color:#2a0d05}
#modal{position:fixed;inset:0;background:rgba(3,10,14,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60}
#modal .bx{background:rgba(14,40,52,.94);border-radius:24px;padding:24px;max-width:440px;width:92%;max-height:90vh;overflow:auto}#modal .bx.wide{max-width:680px}
.prc table input,.prc table select{width:100%;padding:6px 8px}.prc td{padding:4px 6px}.prg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.prg .fg{grid-template-columns:1fr 1fr}
.prbar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;border-radius:20px;padding:12px 16px;background:rgba(6,22,30,.72)}.prbar.on{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun),0 18px 40px -20px rgba(0,0,0,.6)}.prerr{color:#ffc1b3;font-size:14px}
.prwarn{background:rgba(255,196,107,.16);border:1px solid rgba(255,196,107,.45);color:#ffe7bf;border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:15px}
@media(max-width:900px){.prg{grid-template-columns:1fr}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--m)}.fg input,.fg select,.fg textarea{width:100%}#modal h3{margin:0 0 8px;font-size:18px}#modal p{color:var(--m);margin:0 0 14px}
.mut{color:var(--m2);font-size:14px}a{color:var(--sky)}
/* ---------- ภาพรวม ---------- */
.hd{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.hd .lead{margin:0}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--m);padding:6px 12px;border-radius:999px;background:var(--g);border:1px solid var(--b)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(182,227,90,.6)}70%{box-shadow:0 0 0 9px rgba(182,227,90,0)}100%{box-shadow:0 0 0 0 rgba(182,227,90,0)}}
.dg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dg>.card{margin:0}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c12{grid-column:span 12}
@media(max-width:1200px){.c8,.c4,.c7,.c5,.c6{grid-column:span 12}}
.card .hx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.card .hx h2{margin:0}.card .hx .mut{font-size:14px}
.arcw{position:relative;height:270px}.arcw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arcw .dot{cursor:pointer;transition:r .15s}.arcw .dot:hover,.arcw .dot:focus{r:8}
.arcw .dot.new{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{r:0;opacity:0}60%{r:11}100%{r:5.5;opacity:1}}
.arcw .sunr{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.5}}
.tip{position:absolute;pointer-events:none;background:rgba(6,18,26,.94);border:1px solid var(--b);border-radius:12px;padding:8px 12px;font-size:14px;white-space:nowrap;transform:translate(-50%,-115%);z-index:5}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--m)}.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:50%}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.kp div{padding:10px 12px;border-radius:16px;background:var(--gl)}
.kp b{display:block;font-size:26px;font-weight:600;line-height:1.25}.kp b span{font-size:inherit;color:inherit}.kp span{font-size:14px;color:var(--m)}.kp em{font-style:normal;font-size:14px;margin-left:4px}.kp em.up{color:var(--leaf)}.kp em.dn{color:var(--warnc)}
.att{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--gl);margin-bottom:8px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.att:hover{border-color:var(--b)}.att .ic{margin-top:3px}.att b{display:block;font-size:15px;font-weight:600}.att span{font-size:14px;color:var(--m)}
.att.w .ic{color:var(--warnc)}.att.ok .ic{color:var(--leaf)}.att.s .ic{color:var(--sun)}.att.i .ic{color:var(--sky)}
.pipe{display:grid;gap:9px}
.st{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14px}
.st .bar{height:22px;border-radius:8px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.st .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,rgba(127,211,216,.5),rgba(127,211,216,.92));transform-origin:left}.fx .st .bar i,.fx .bx2 .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.fx .dg>.card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.fx .dg>.card:nth-child(2){animation-delay:.06s}.fx .dg>.card:nth-child(3){animation-delay:.12s}.fx .dg>.card:nth-child(4){animation-delay:.18s}.fx .dg>.card:nth-child(n+5){animation-delay:.24s}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.st .bar em{position:absolute;top:0;bottom:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(135deg,rgba(255,154,122,.9) 0 5px,rgba(255,154,122,.55) 5px 10px)}
@keyframes grow{from{transform:scaleX(0)}}
.st.off .bar i{background:rgba(255,255,255,.24)}.st b{text-align:right;font-size:15px;font-weight:600}.st .nm{color:var(--m)}
.tm{display:grid;grid-template-columns:36px minmax(0,1fr) 120px 44px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
.tm:first-of-type{border-top:0}.tm b{font-weight:600;display:block;font-size:15px}.tm span{font-size:14px;color:var(--m)}.tm .on{color:var(--leaf)}
.tm .av,.fd .av{color:#0a1a24!important;font-size:14px}
.spk{display:flex;gap:2px;align-items:flex-end;height:26px}.spk i{flex:1;background:rgba(127,211,216,.75);border-radius:2px}
.tm .cnt{text-align:right;font-weight:600;font-size:16px}
.hm{display:grid;grid-template-columns:44px repeat(14,minmax(0,1fr));gap:4px;font-size:14px}
.hm i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.06)}.hm .l{color:var(--m2);align-self:center}.hm .h{color:var(--m2);text-align:center}
.trend{position:relative;height:170px}.trend svg{position:absolute;inset:0;width:100%;height:100%}
.hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hl>div{padding:12px 14px;border-radius:16px;background:var(--gl)}.hl span{font-size:14px;color:var(--m)}.hl b{display:block;font-size:18px;font-weight:600}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--leaf);border-radius:99px;min-width:3px}
.bx2{display:grid;gap:8px}.bx2 div{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}.bx2 .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bx2 .bar i{display:block;height:100%;border-radius:99px;background:var(--sun);transform-origin:left}.bx2 b{text-align:right;font-weight:600}
.fd{display:flex;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.08);align-items:flex-start}.fd:first-of-type{border-top:0}
.fd .t{flex:0 0 52px;color:var(--m2);font-size:14px;padding-top:4px}.fd .x b{font-weight:600}.fd .x span{color:var(--m);font-size:14px;display:block}
.fd.new{animation:slidein .6s ease-out}@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
/* ค้นหาด่วน Ctrl+K */
#pal{position:fixed;inset:0;background:rgba(3,10,14,.5);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:65;padding:12vh 16px 16px}
#pal .bx{width:100%;max-width:560px;border-radius:22px;background:rgba(14,40,52,.95);border:1px solid var(--b);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px;background:transparent}
#pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}#pal li{padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
#pal li.on{background:rgba(255,255,255,.12)}#pal li small{margin-left:auto;color:var(--m2);font-size:14px}
/* มือถือ */
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{position:sticky;top:0;z-index:20;margin:0;border-radius:0 0 22px 22px;height:auto;padding:12px 12px 8px;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible}
 .brand{padding:0 4px;flex:1}.kbd{display:none}
 nav{order:3;flex:1 1 100%;flex-direction:row;overflow-x:auto;margin-top:8px;scrollbar-width:none;gap:6px}nav .grp{display:none}
 nav button{flex:none;padding:6px 12px;border:1px solid var(--b);border-radius:999px;font-size:14px}nav button svg{display:none}
 .me{margin:0;border:0;padding:0;font-size:14px}.me b,.me .em{display:none}.me div{margin:0!important}
 main{padding:18px 12px 60px}
 .kp{grid-template-columns:repeat(2,minmax(0,1fr))}.arcw{height:210px}
 .st{grid-template-columns:112px minmax(0,1fr) 34px}
 .tm{grid-template-columns:36px minmax(0,1fr) 44px}.tm .spk{display:none}
 .hm .h:nth-child(odd){visibility:hidden}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 table{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside>
    <div class="brand">CLEANL<i>I</i>NE<small>Console</small></div>
    <button class="kbd" id="kbd" type="button"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>ค้นหาด่วน<kbd>Ctrl K</kbd></button>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="modal"><div class="bx" id="mbx"></div></div>
<div id="pal"><div class="bx"><input type="search" id="palq" placeholder="ไปที่เมนู ค้นหาคน หรือสั่งงาน" autocomplete="off"><ul id="pall"></ul></div></div>
<script src="config.js"></script>
<script src="gdb.js"></script>
<script src="shared.js"></script>
<script>
'use strict';
const ROLE = {admin:'แอดมิน',dispatch:'หัวหน้าจัดงาน',lead:'หัวหน้าตรวจแบบ',eng:'วิศวกร',sales:'เซลส์'};
const ROLE_PAGE = {admin:'Management · ดูโฟลเดอร์',dispatch:'Management · ดูโฟลเดอร์',lead:'Man · แก้ไขโฟลเดอร์',eng:'Man · แก้ไขโฟลเดอร์',sales:'Management · เฉพาะงานที่ตัวเองแจ้ง'};
const SALES_TEAMS = ['EN','SA-D1','SA-D2','SA-D3','SA-D4','SA-D5','SA-DD','SA-DP'];

async function run(fn,okMsg){

}

const baht=n=>n===''||n==null||!isFinite(+n)?'':(+n).toLocaleString('th-TH');
function prCheck(D){
  const e=[];const nm=new Set();

/* นำเข้าแคตตาล็อกจาก Excel (Catalog.xlsx: สินค้า ยี่ห้อ รุ่น เฟส กำลังผลิต Smart Meter CT หมายเหตุ) */
function catParse(rows){
  const hi=rows.findIndex(r=>(r||[]).some(c=>String(c??'').trim()==='สินค้า'));if(hi<0)throw new Error('ไม่พบหัวตาราง "สินค้า" ในไฟล์');
  const H=rows[hi].map(c=>String(c??'').trim());const col=t=>H.findIndex(x=>x===t);
  const C={cat:col('สินค้า'),brand:col('ยี่ห้อ'),model:col('รุ่น'),phase:col('เฟส'),pow:col('กำลังผลิต'),sm:H.findIndex(x=>/smart\s*meter/i.test(x)),ct:col('CT'),note:col('หมายเหตุ')};
  if(C.model<0)throw new Error('ไม่พบคอลัมน์ "รุ่น"');
  const v=(r,k)=>C[k]<0?'':String(r[C[k]]??'').trim();const out=[],bad=[];
  rows.slice(hi+1).forEach((r,i)=>{r=r||[];const t=v(r,'cat'),model=v(r,'model');if(!t||!model)return;
    const cat=/แผง|panel/i.test(t)?'SOLAR PANEL':/อินเวอร์เตอร์|inverter/i.test(t)?'INVERTER':/แบต|battery/i.test(t)?'BATTERY':'';
    if(!cat){bad.push(`แถว ${hi+i+2}: ไม่รู้จักประเภท "${t}"`);return}
    const d={category:cat,model,brand:v(r,'brand')};const pw=catNum(v(r,'pow'));
    if(cat==='INVERTER'){Object.assign(d,{kw:pw,phase:String(catNum(v(r,'phase'))||''),type:/hybrid/i.test(v(r,'note'))?'Hybrid':/on.?grid/i.test(v(r,'note'))?'On Grid':''});
      const smB=C.sm<0?'':String(r[C.sm]??'').trim(),smM=C.sm<0?'':String(r[C.sm+1]??'').trim();if(smM)d.meters=smM;if(v(r,'ct'))d.cts=v(r,'ct');if(smM)d.note=`Smart meter ${[smB,smM].filter(Boolean).join(' ')}${d.cts?' · CT '+d.cts:''}`}
    else if(cat==='BATTERY')d.kwh=pw;else d.watt=pw;
    Object.keys(d).forEach(k=>{if(d[k]===''||d[k]==null)delete d[k]});out.push(d)});
  return {out,bad};
}
async function catImport(file){
  let r;try{await loadXLSX();const wb=XLSX.read(await file.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];r=catParse(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null}))}catch(e){return toast('อ่านไฟล์ไม่ได้: '+(e.message||e),true)}
  const have=S.products,seen=new Set(),L=[];r.out.forEach(d=>{const id=pid(d.category,d.model);if(seen.has(id))return;seen.add(id);L.push({id,d,upd:!!have[id]})});
  if(!L.length)return toast('ไม่พบรุ่นในไฟล์',true);
  const nN=L.filter(x=>!x.upd).length,nU=L.length-nN;

    for(let i=0;i<L.length;i+=40){const part=L.slice(i,i+40);const b=S.db.batch();part.forEach(x=>{const ref=S.db.doc('products/'+x.id),d={...x.d,updatedAt:Date.now()};if(x.upd)b.update(ref,d);else b.set(ref,d)});

/* ---------- ภาพรวม (แดชบอร์ดเจ้าของ · 27 พ.ย. 69) ----------
 * ทุกตัวเลขคำนวณจากข้อมูลจริงในเครื่อง: logs (บันทึกการใช้งาน) · jobs · members · joinreq · pricing · health/backups จากตัวกลาง
 * ไม่มีราคา/เงินในหน้านี้ (กติกา "ระบบไม่ยุ่งกับราคา") */
const STG=['','จองคิวสำรวจ','รอจัดคนสำรวจ','สำรวจ ออกแบบ','เสนอลูกค้า','จองคิวติดตั้ง','มอบงานติดตั้ง','กำลังติดตั้ง','เอกสารขนานไฟฟ้า'];
const PAL=['#7fd3d8','#b6e35a','#ffc46b','#f7a6c9','#a9b8ff','#ff9a7a','#8ee6b5','#e9c3ff','#ffe08a','#9fd4ff'];
const DAY=864e5,H0=6,H1=19;
const d0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return 'เมื่อสักครู่';if(m<60)return m+' นาทีที่แล้ว';const h=Math.round(m/60);if(h<24)return h+' ชม.ที่แล้ว';const d=Math.round(h/24);return d===1?'เมื่อวาน':d+' วันที่แล้ว'};
const nf=n=>Number(n||0).toLocaleString('th-TH');
function colorOf(id){const ids=Object.keys(S.members).sort();let i=ids.indexOf(id);if(i<0){i=0;for(const c of String(id))i=(i*31+c.charCodeAt(0))>>>0}return PAL[i%PAL.length]}
function nameOf(l){const m=S.members[l.by];return (m&&m.name)||l.byName||'ไม่ทราบชื่อ'}
function allLogs(){return Object.entries(S.logs).map(([id,l])=>({id,...l})).filter(l=>l.at&&!(l.act==='login'&&S.me&&l.by===S.me.id)).sort((a,b)=>a.at-b.at)}
function lastMove(j){let t=Math.max(+j.updatedAt||0,+j.stageSince||0,+j.createdAt||0);(j.history||[]).forEach(h=>{t=Math.max(t,+(h&&h.at)||0)});return t}
function openJobs(){return Object.entries(S.jobs).map(([id,j])=>({id,...j})).filter(j=>!j.trashedAt&&(j.status||'active')==='active')}
function actTxt(l){const c=COLN[l.col]||l.col||'';return l.act==='login'?'เข้าสู่ระบบ':(ACT[l.act]||l.act)+(c?' '+c:'')}
function homeData(){
  const now=Date.now(),t0=d0(now),L=allLogs(),today=L.filter(l=>l.at>=t0),yday=L.filter(l=>l.at>=t0-DAY&&l.at<now-DAY);
  const wr=x=>x.filter(l=>l.act!=='login');
  const mem=Object.entries(S.members).map(([id,m])=>({id,...m})).filter(m=>m.status!=='suspended'&&m.id!==S.me.id);
  const last={};L.forEach(l=>{last[l.by]=l.at});
  const activeNow=new Set(L.filter(l=>l.at>now-15*6e4&&l.by!==S.me.id).map(l=>l.by));
  const usedToday=new Set(today.filter(l=>l.by!==S.me.id).map(l=>l.by));
  const J=Object.entries(S.jobs).map(([id,j])=>({id,...j})).filter(j=>!j.trashedAt);
  const newW=J.filter(j=>+j.createdAt>=now-7*DAY).length,newPW=J.filter(j=>+j.createdAt>=now-14*DAY&&+j.createdAt<now-7*DAY).length;
  const ym=new Date(now).toISOString().slice(0,7);
  const doneM=J.filter(j=>j.installDate&&String(j.installDate).startsWith(ym)&&(+j.stage>=8||j.status==='done')&&j.status!=='cancelled');
  const kwM=Math.round(doneM.reduce((a,j)=>a+(parseFloat((j.equipment||{}).kw||j.proposedKw)||0),0)*10)/10;
  const O=openJobs(),stuckCut=now-14*DAY;
  const stages=STG.map((n,i)=>{if(!i)return null;const L2=O.filter(j=>+(j.stage||1)===i);return {i,n,all:L2.length,stuck:i===4?0:L2.filter(j=>(+j.stageSince||lastMove(j))<stuckCut).length}}).filter(Boolean);
  const stale=O.filter(j=>+(j.stage||1)<=3&&lastMove(j)>0&&lastMove(j)<now-50*DAY);
  const dels=today.filter(l=>l.act==='del');
  const night=L.filter(l=>l.act==='login'&&l.at>=now-7*DAY&&((h=>h>=22||h<5)(new Date(l.at).getHours())));
  return {now,t0,L,today,yday,wr,mem,last,activeNow,usedToday,newW,newPW,doneM,kwM,O,stages,stale,dels,night};
}
function delta(a,b){if(!b)return a?'<em class="up">ใหม่</em>':'';const p=Math.round((a-b)/b*100);return p===0?'':`<em class="${p>0?'up':'dn'}">${p>0?'+':''}${p}%</em>`}

let arcRO=null,trRO=null;
function homeAfter(){
  const a=$('#arcw'),t=$('#trend');

  if(t){trRO=new ResizeObserver(drawTrend);trRO.observe(t);drawTrend()}

  const L=allLogs();S.seenAt=L.length?L[L.length-1].at:Date.now();
}
function drawArc(){
  const box=$('#arcw'),s=$('#arcsvg');if(!box||!s)return;
  const W=box.clientWidth,H=box.clientHeight;if(!W)return;
  const small=W<520,cx=W/2,r=Math.max(60,Math.min(W/2-30,H-40)),cy=H-22,now=new Date(),nowH=now.getHours()+now.getMinutes()/60;
  const pt=(h,rr)=>{const a=Math.PI*(1-(Math.max(H0,Math.min(H1,h))-H0)/(H1-H0));return [cx+rr*Math.cos(a),cy-rr*Math.sin(a)]};
  const [sx,sy]=pt(nowH,r),t0=d0(Date.now()),ev=allLogs().filter(l=>l.at>=t0);
  let o=`<defs><radialGradient id="sg"><stop offset="0" stop-color="#fff3c9"/><stop offset=".45" stop-color="#ffc46b"/><stop offset="1" stop-color="#ffc46b" stop-opacity="0"/></radialGradient><linearGradient id="past" x1="0" x2="1"><stop offset="0" stop-color="#7fd3d8" stop-opacity=".25"/><stop offset="1" stop-color="#ffc46b"/></linearGradient></defs>`;
  o+=`<path d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>`;
  if(nowH>H0)o+=`<path d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${sx} ${sy}" fill="none" stroke="url(#past)" stroke-width="3" stroke-linecap="round"/>`;
  o+=`<line x1="${cx-r-16}" x2="${cx+r+16}" y1="${cy}" y2="${cy}" stroke="rgba(255,255,255,.25)"/>`;
  [6,8,10,12,14,16,18].forEach(h=>{if(small&&h%4)return;const [x,y]=pt(h,r+17);o+=`<text x="${x}" y="${Math.min(y,cy+14)}" fill="rgba(244,247,246,.62)" font-size="14" text-anchor="middle" dominant-baseline="middle">${String(h).padStart(2,'0')}</text>`});
  const lane={};ev.forEach((l,i)=>{const h=new Date(l.at).getHours()+new Date(l.at).getMinutes()/60;const slot=Math.round(h*12);lane[slot]=(lane[slot]||0)+1;const k=lane[slot]-1;const [x,y]=pt(h,r-20-k*12);
    o+=`<circle class="dot ${l.at>S.seenAt&&S.seenAt?'new':''}" tabindex="0" data-li="${esc(l.id)}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="${colorOf(l.by)}" stroke="rgba(6,18,26,.65)" stroke-width="1.5"><title>${esc(hm(l.at)+' '+nameOf(l)+' · '+actTxt(l)+(l.ttl?' · '+l.ttl:''))}</title></circle>`});
  if(nowH>=H0-.5&&nowH<=H1+.5)o+=`<circle class="sunr" cx="${sx}" cy="${sy}" r="48" fill="url(#sg)" opacity=".8"/><circle cx="${sx}" cy="${sy}" r="11" fill="#ffe3a3"/>`;
  const pct=Math.round(Math.max(0,Math.min(1,(nowH-8)/(17-8)))*100);
  o+=`<text x="${cx}" y="${cy-32}" text-anchor="middle" fill="#f4f7f6" font-size="${small?32:44}" font-weight="600">${hm(Date.now())}</text><text x="${cx}" y="${cy-8}" text-anchor="middle" fill="rgba(244,247,246,.76)" font-size="14">${nowH<8?'ยังไม่ถึงเวลาทำงาน':nowH>=17?'เลยเวลาทำงานแล้ว':'ผ่านไป '+pct+'% ของวันทำงาน'} · ${ev.length} บันทึก</text>`;
  s.innerHTML=o;
}
function drawTrend(){
  const box=$('#trend'),s=$('#trsvg');if(!box||!s)return;
  const W=box.clientWidth,H=box.clientHeight;if(!W)return;
  const t0=d0(Date.now()),L=allLogs(),J=Object.values(S.jobs),N=30,pad={l:30,r:8,t:10,b:24};
  const days=[...Array(N)].map((_,i)=>{const s0=t0-(N-1-i)*DAY;return {s0,w:L.filter(l=>l.at>=s0&&l.at<s0+DAY&&l.act!=='login').length,j:J.filter(j=>+j.createdAt>=s0&&+j.createdAt<s0+DAY).length}});
  const mw=Math.max(4,...days.map(d=>d.w)),mj=Math.max(2,...days.map(d=>d.j)),iw=W-pad.l-pad.r,ih=H-pad.t-pad.b,bw=iw/N;
  let o='';[0,.5,1].forEach(f=>{const y=pad.t+ih*(1-f);o+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.08)"/><text x="${pad.l-6}" y="${y}" fill="rgba(244,247,246,.6)" font-size="14" text-anchor="end" dominant-baseline="middle">${Math.round(mw*f)}</text>`});
  days.forEach((d,i)=>{const h=d.w/mw*ih,x=pad.l+i*bw+bw*.18;o+=`<rect x="${x}" y="${pad.t+ih-h}" width="${bw*.64}" height="${Math.max(h,d.w?2:0)}" rx="3" fill="rgba(127,211,216,${i===N-1?.95:.6})"><title>${new Date(d.s0).toLocaleDateString('th-TH',{day:'numeric',month:'short'})} · บันทึก ${d.w} · งานใหม่ ${d.j}</title></rect>`});
  const pts=days.map((d,i)=>[pad.l+i*bw+bw/2,pad.t+ih-d.j/mj*ih*.9]);
  o+=`<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#ffc46b" stroke-width="2" stroke-linejoin="round"/>`+pts.map((p,i)=>days[i].j?`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#ffc46b"/>`:'').join('');
  [0,Math.floor(N/2),N-1].forEach(i=>{const x=pad.l+i*bw+bw/2;o+=`<text x="${x}" y="${H-6}" fill="rgba(244,247,246,.6)" font-size="14" text-anchor="${i===0?'start':i===N-1?'end':'middle'}">${i===N-1?'วันนี้':new Date(days[i].s0).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</text>`});
  s.innerHTML=o;
}

    const nid=id||pid(cat,v.model);if(!id&&S.products[nid])return toast('มีรุ่นนี้อยู่แล้ว',true);
    await run(()=>S.db.doc('products/'+nid).set({...(id?cur:{}),...v,category:cat,updatedAt:Date.now()}),'บันทึกแล้ว');return}
  if(d.pdel){const p=S.products[d.pdel];if(!await ask('ลบรุ่นนี้?',`"${esc(p.model)}" จะหายจากตัวเลือกในใบสำรวจ งานที่เคยเลือกรุ่นนี้ไว้ไม่ได้รับผลกระทบ`,'ลบ',true))return;
    await run(()=>S.db.doc('products/'+d.pdel).delete(),'ลบแล้ว');return}
  if(d.bknow!==undefined){await run(()=>S.db.call('backup').then(loadBackups),'สำรองแล้ว');return}
  if(d.restore){if(!await ask('กู้ข้อมูลจากชุดนี้?',`<b>${esc(d.rname)}</b><br>ข้อมูลที่บันทึกหลังจากเวลานั้นจะหายจากระบบ (ระบบสำรองข้อมูลปัจจุบันให้ก่อน 1 ชุด เผื่อเปลี่ยนใจ) · แนะนำเปิด "ปิดปรับปรุง" ก่อน`,'กู้ข้อมูล',true,'กู้'))return;
    await run(()=>S.db.call('restore',{fileId:d.restore}).then(()=>{loadBackups();S.db.refresh()}),'กู้ข้อมูลแล้ว ทุกเครื่องจะโหลดใหม่');return}
  if(d.mmsg!==undefined){const msg=$('#mmsg').value;await run(()=>S.db.call('setSys',{flags:{maintenance:!!S.sys.maintenance,msg}}).then(r=>S.sys=r.sys),'บันทึกข้อความแล้ว');return}
  if(d.health!==undefined){loadHealth();return}
  if(d.dlim!==undefined){const n=Math.max(1,Math.min(20,+$('#dlim').value||3));await run(()=>S.db.doc('config/queue').set({...(S.config.queue||{}),drawLimit:n,updatedAt:Date.now()}),'บันทึกแล้ว');return}
});
document.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset;
  const set=(id,k,v)=>{S.edit[id]={...(S.edit[id]||{}),[k]:v};render()};
  if(d.prole)return set(d.prole,'role',t.value);
  if(d.pteam)return set(d.pteam,'queue',t.value);
  if(d.psteam)return set(d.psteam,'team',t.value);
  if(d.mrole)return set(d.mrole,'role',t.value);
  if(d.mteam)return set(d.mteam,'queue',t.value);
  if(d.msteam)return set(d.msteam,'team',t.value);
  if(t.id==='lby'){S.lby=t.value;S.llim=150;render();return}
  if(t.id==='lcol'){S.lcol=t.value;S.llim=150;render();return}
  if(t.id==='eqx'){const f=t.files[0];t.value='';if(f)catImport(f);return}
  if(t.id==='prx'){const f=t.files[0];t.value='';if(f)prImport(f);return}
  if(d.pr){prSet(d.pr,t.value);render();return}
  if(t.id==='mt'){const on=t.checked,msg=$('#mmsg').value;
    if(on&&!await ask('ปิดปรับปรุงระบบ?','ทุกคนจะบันทึกอะไรไม่ได้จนกว่าคุณจะเปิดกลับ','ปิดปรับปรุง',true)){t.checked=false;return}
    await run(()=>S.db.call('setSys',{flags:{maintenance:on,msg}}).then(r=>S.sys=r.sys),on?'ปิดปรับปรุงแล้ว':'เปิดใช้งานปกติแล้ว');return}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.pr&&t.tagName==='INPUT'){prSet(d.pr,t.value);const b=document.querySelector('.prbar');if(b){const on=prDirty(),err=prCheck(prDraft());b.classList.toggle('on',on);b.querySelector('[data-prsave]').disabled=!on||!!err.length||S.busy;b.querySelector('[data-prreset]').disabled=!on;const m=b.querySelector('.prerr,.mut');if(m){m.className=err.length?'prerr':'mut';m.textContent=err.length?err[0]+(err.length>1?` (อีก ${err.length-1} ข้อ)`:''):(on?'มีการแก้ไขที่ยังไม่บันทึก':'บันทึกแล้ว')}}return}
  const keep=(id,k)=>{S.edit[id]={...(S.edit[id]||{}),[k]:t.value}};
  if(d.pname)return keep(d.pname,'name');
  if(d.mname){keep(d.mname,'name');return softRender(t)}
  if(d.mphone){keep(d.mphone,'phone');return softRender(t)}
  if(t.id==='lq'){S.lq=t.value;S.llim=150;softRender(t)}
  if(t.id==='mmsg')S.mmsg=t.value;
  if(t.id==='dq'){S.dq=t.value;softRender(t)}
  if(t.id==='eqq'){S.eqq=t.value;softRender(t)}
});
// วาดใหม่โดยไม่เสียตำแหน่งเคอร์เซอร์
function softRender(el){const sel=el.selectionStart,key=[...el.attributes].filter(a=>a.name.startsWith('data-')||a.name==='id').map(a=>`[${a.name}="${a.value}"]`).join('');render();const n=document.querySelector(key);if(n){n.focus();try{n.setSelectionRange(sel,sel)}catch(x){}}}
async function loadBackups(){try{S.backups=(await S.db.call('backups')).list}catch(e){S.backups=[];toast(e.message,true)}render()}
async function loadHealth(quiet){const t1=performance.now();try{const h=await S.db.call('health');S.lat=Math.round(performance.now()-t1);S.health=h;S.sys=h.sys||{}}catch(e){if(!quiet)toast(e.message,true)}const a=document.activeElement;if(quiet&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.closest('main'))return;render()}

/* ---------- เริ่ม ---------- */
CLGDB.connect('console').then(({db,me})=>{
  S.db=db;S.me=me;$('#app').hidden=false;
  const live=(col)=>db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S[col]=o;
    const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.closest('main'))return; render()},e=>toast(e.message,true));
  live('members');live('joinreq');live('logs');live('forms');live('products');live('config');live('pricing');live('jobs');
  render();loadHealth(true);loadBackups();
}).catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p style="padding:40px;text-align:center">${esc(e.message)}</p>`)});
</script>
</body>
</html>
