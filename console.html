/* Console โฉมกระจก (27 พ.ย. 69) — แผงกระจกฝ้าบนฟ้ารุ่งสาง · ตัวหนังสือขั้นต่ำ 14px

:root{--t:#f4f7f6;--m:rgba(244,247,246,.76);--m2:rgba(244,247,246,.6);--g:rgba(10,32,42,.36);--gl:rgba(255,255,255,.08);--b:rgba(255,255,255,.2);--sun:#ffc46b;--leaf:#b6e35a;--warnc:#ff9a7a;--sky:#bdf0f2;
 --ink:#f4f7f6;--sub:rgba(244,247,246,.76);--line:rgba(255,255,255,.12);--card:var(--g);--acc:#b6e35a;--accS:rgba(182,227,90,.18);--bad:#ff8a73;--badS:rgba(255,138,115,.2);--warn:#ffc46b;--warnS:rgba(255,196,107,.18);--r:24px}
*{box-sizing:border-box;min-width:0}html,body{margin:0}
body{font-family:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;color:var(--t);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;background:#0b2230}

::selection{background:rgba(255,196,107,.4)}
.glass,.card,aside,.prbar,#modal .bx{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 40px -24px rgba(0,0,0,.55)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}

nav .n.s{background:var(--sun)}

.kbd:hover{color:var(--t)}.kbd kbd{margin-left:auto;font:inherit;font-size:14px;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.12)}
.me{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--m2)}
.me b{display:block;color:var(--t);font-size:15px;font-weight:600}.me a,.me button{color:var(--t);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:none;margin-right:14px;opacity:.85}.me a:hover,.me button:hover{opacity:1;text-decoration:underline}
main{padding:28px 32px 60px;max-width:1520px;width:100%}
h1{font-size:32px;line-height:1.2;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}.lead{color:var(--m);margin:0 0 22px}
.card{border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}

.pill.bad{background:var(--badS);color:#ffd0c5}.pill.warn{background:var(--warnS);color:#ffe2b0}.pill.gray{background:rgba(255,255,255,.12);color:var(--t)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:14px;color:var(--m2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:middle}tr:last-child td{border-bottom:0}

input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input[type=text],input[type=tel]{width:150px}

.btn.l{background:rgba(255,255,255,.1);border-color:var(--b);color:var(--t)}.btn.l:hover{background:rgba(255,255,255,.18)}
.btn.g{background:var(--leaf);border-color:var(--leaf);color:#14260a}.btn.bad{background:var(--bad);border-color:var(--bad);color:#2a0d05}.btn.sm{padding:5px 13px;min-height:34px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.note{background:var(--warnS);border:1px solid rgba(255,196,107,.35);border-radius:14px;padding:10px 14px;font-size:14px;color:#ffe7bf}
.ok{background:var(--accS);border-radius:14px;padding:10px 14px;font-size:14px;color:#e2f7bc}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}.switch input{display:none}
.switch i{width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;transition:.2s}.switch i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--warnc)}.switch input:checked+i:after{left:23px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#0b2230;font-weight:600;border-radius:999px;padding:10px 20px;font-size:15px;z-index:70;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad);color:#2a0d05}
#modal{position:fixed;inset:0;background:rgba(3,10,14,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60}
#modal .bx{background:rgba(14,40,52,.94);border-radius:24px;padding:24px;max-width:440px;width:92%;max-height:90vh;overflow:auto}#modal .bx.wide{max-width:680px}
.prc table input,.prc table select{width:100%;padding:6px 8px}.prc td{padding:4px 6px}.prg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.prg .fg{grid-template-columns:1fr 1fr}
.prbar{position:sticky;bottom:12px;display:flex;gap:10px;align-items:center;border-radius:20px;padding:12px 16px;background:rgba(6,22,30,.72)}.prbar.on{border-color:var(--sun);box-shadow:0 0 0 1px var(--sun),0 18px 40px -20px rgba(0,0,0,.6)}.prerr{color:#ffc1b3;font-size:14px}
.prwarn{background:rgba(255,196,107,.16);border:1px solid rgba(255,196,107,.45);color:#ffe7bf;border-radius:16px;padding:12px 14px;margin-bottom:16px;font-size:15px}
@media(max-width:900px){.prg{grid-template-columns:1fr}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--m)}.fg input,.fg select,.fg textarea{width:100%}#modal h3{margin:0 0 8px;font-size:18px}#modal p{color:var(--m);margin:0 0 14px}
.mut{color:var(--m2);font-size:14px}a{color:var(--sky)}
/* ---------- ภาพรวม ---------- */
.hd{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.hd .lead{margin:0}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--m);padding:6px 12px;border-radius:999px;background:var(--g);border:1px solid var(--b)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(182,227,90,.6)}70%{box-shadow:0 0 0 9px rgba(182,227,90,0)}100%{box-shadow:0 0 0 0 rgba(182,227,90,0)}}
.dg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dg>.card{margin:0}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c12{grid-column:span 12}
@media(max-width:1200px){.c8,.c4,.c7,.c5,.c6{grid-column:span 12}}
.card .hx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.card .hx h2{margin:0}.card .hx .mut{font-size:14px}
.arcw{position:relative;height:270px}.arcw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arcw .dot{cursor:pointer;transition:r .15s}.arcw .dot:hover,.arcw .dot:focus{r:8}
.arcw .dot.new{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{r:0;opacity:0}60%{r:11}100%{r:5.5;opacity:1}}
.arcw .sunr{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.5}}
.tip{position:absolute;pointer-events:none;background:rgba(6,18,26,.94);border:1px solid var(--b);border-radius:12px;padding:8px 12px;font-size:14px;white-space:nowrap;transform:translate(-50%,-115%);z-index:5}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--m)}.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:50%}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.kp div{padding:10px 12px;border-radius:16px;background:var(--gl)}
.kp b{display:block;font-size:26px;font-weight:600;line-height:1.25}.kp b span{font-size:inherit;color:inherit}.kp span{font-size:14px;color:var(--m)}.kp em{font-style:normal;font-size:14px;margin-left:4px}.kp em.up{color:var(--leaf)}.kp em.dn{color:var(--warnc)}
.att{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--gl);margin-bottom:8px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.att:hover{border-color:var(--b)}.att .ic{margin-top:3px}.att b{display:block;font-size:15px;font-weight:600}.att span{font-size:14px;color:var(--m)}
.att.w .ic{color:var(--warnc)}.att.ok .ic{color:var(--leaf)}.att.s .ic{color:var(--sun)}.att.i .ic{color:var(--sky)}
.pipe{display:grid;gap:9px}
.st{display:grid;grid-template-columns:150px minmax(0,1fr) 40px 92px;gap:12px;align-items:center;font-size:14px}
.st .bar{height:22px;border-radius:8px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.st .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,rgba(127,211,216,.5),rgba(127,211,216,.92));transform-origin:left}.fx .st .bar i,.fx .bx2 .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.fx .dg>.card{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.fx .dg>.card:nth-child(2){animation-delay:.06s}.fx .dg>.card:nth-child(3){animation-delay:.12s}.fx .dg>.card:nth-child(4){animation-delay:.18s}.fx .dg>.card:nth-child(n+5){animation-delay:.24s}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.st .bar em{position:absolute;top:0;bottom:0;border-radius:0 8px 8px 0;background:repeating-linear-gradient(135deg,rgba(255,154,122,.9) 0 5px,rgba(255,154,122,.55) 5px 10px)}
@keyframes grow{from{transform:scaleX(0)}}
.st.off .bar i{background:rgba(255,255,255,.24)}.st b{text-align:right;font-size:15px;font-weight:600}.st .nm{color:var(--m)}
.tm{display:grid;grid-template-columns:36px minmax(0,1fr) 120px 44px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
.tm:first-of-type{border-top:0}.tm b{font-weight:600;display:block;font-size:15px}.tm span{font-size:14px;color:var(--m)}.tm .on{color:var(--leaf)}
.tm .av,.fd .av{color:#0a1a24!important;font-size:14px}

.fd.new{animation:slidein .6s ease-out}@keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
/* ค้นหาด่วน Ctrl+K */
#pal{position:fixed;inset:0;background:rgba(3,10,14,.5);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:65;padding:12vh 16px 16px}

 .app{grid-template-columns:1fr}
 aside{position:sticky;top:0;z-index:20;margin:0;border-radius:0 0 22px 22px;height:auto;padding:12px 12px 8px;flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible}

@property --s1{syntax:'<color>';inherits:true;initial-value:#0b2230}

:root{--sx:88%;--sy:104%;transition:--s1 3s,--s2 3s,--s3 3s,--s4 3s,--glow 3s,--stars 3s}
body:before{background:radial-gradient(760px 520px at var(--sx) var(--sy),var(--glow),transparent 62%),radial-gradient(700px 420px at 14% -10%,rgba(127,211,216,.22),transparent 70%),linear-gradient(176deg,var(--s1) 0%,var(--s2) 38%,var(--s3) 70%,var(--s4) 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--stars);
 background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 42%,#fff,transparent),radial-gradient(1.4px 1.4px at 46% 12%,#fff,transparent),radial-gradient(1px 1px at 63% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 9%,#fff,transparent),radial-gradient(1px 1px at 88% 36%,#fff,transparent),radial-gradient(1px 1px at 36% 64%,rgba(255,255,255,.7),transparent),radial-gradient(1.3px 1.3px at 70% 58%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 8% 72%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 54% 82%,rgba(255,255,255,.5),transparent);
 background-size:640px 520px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{filter:brightness(1.6)}}

.brand{font-family:"Chakra Petch",sans-serif}
.card,aside{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 42%),var(--g);border-color:transparent}

const gHash=t=>{let h=5381;for(const ch of String(t))h=((h<<5)+h+ch.charCodeAt(0))>>>0;return h.toString(36)};
const gDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const GSTOP=new Set(['survey','solar','installation','install','ติดตั้ง','สำรวจ','เซอร์เวย์','คุณ','บ้าน','ทีม','ที่อยู่','เลขที่','หมู่บ้าน','แผน','ลูกค้า','งาน','และ','ระบบ','kw','kwp']);
const gToks=t=>String(t||'').toLowerCase().replace(/[*()\[\]:;,.+\/|"'“”]/g,' ').split(/\s+/).map(x=>x.replace(/^คุณ/,'')).filter(x=>x.length>=2&&!GSTOP.has(x));
function gJobEv(j){const L=[];if(!j||['lost','cancelled'].includes(j.status)||j.trashedAt)return L;const sd=j.surveyDate||j.queueDate;if(sd)L.push({k:'s',d:sd,end:sd});
  if(j.installDate)L.push({k:'i',d:j.installDate,end:j.installEnd&&j.installEnd>j.installDate?j.installEnd:j.installDate});return L}
function gHay(j){const c=S.customers[j.customerId]||{},s=S.sites[j.siteId]||{};return [j.title,c.name,c.firstName,c.lastName,s.label,s.area,s.address,j.jobNo].filter(Boolean).join(' ').toLowerCase()}
function gCands(e){const T=gToks(e.n),end=e.end||e.d;
  return Object.entries(S.jobs).map(([id,j])=>{const ev=gJobEv(j);if(!ev.length)return null;const ov=ev.some(x=>x.d<=end&&x.end>=e.d);const near=Math.min(...ev.map(x=>Math.abs(gDiff(x.d,e.d))));if(!ov&&near>3)return null;
    const hay=gHay(j);let sc=0,hit=0;T.forEach(t=>{if(hay.includes(t)){sc+=t.length>=4?2:1;hit++}});if(!hit)return null;return {id,j,sc:sc+(ov?3:1),ov,ev}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,6)}
const gSure=c=>c.length&&c[0].ov&&c[0].sc>=6&&(!c[1]||c[0].sc-c[1].sc>=2);
function gMonth(){if(!S.gm)S.gm=today().slice(0,8)+'01';return S.gm}
function gRange(m){const d=new Date(m+'T00:00:00');return [m,isoOf(new Date(d.getFullYear(),d.getMonth()+1,0))]}
async function gLoad(force){const m=gMonth();if(!force&&S.gcal[m]&&S.gcal[m]!=='err')return;S.gcal[m]='busy';render();const [a,b]=gRange(m);
  try{S.gcal[m]=await S.db.call('gcalList',{from:a,to:b})}catch(e){S.gcal[m]='err';S.gerr=e.message||'อ่านปฏิทินไม่ได้'}render()}
function gState(){const lk={},no={};Object.entries(S.appts).forEach(([id,a])=>{if(a&&a.link&&a.gid)lk[a.gid]={id,...a};if(a&&a.nolink&&a.gid)no[a.gid]={id,...a}});return {lk,no}}
function gJobLab(j,ev){return `${esc(j.title||'ไม่มีชื่อ')} · ${GSTG[j.stage]||''}${ev&&ev.length?' · '+ev.map(x=>(x.k==='i'?'ติดตั้ง ':'สำรวจ ')+fd(x.d)+(x.end!==x.d?'–'+fd(x.end):'')).join(', '):''}`}
function gRows(){const m=gMonth(),D=S.gcal[m];if(!D||typeof D!=='object')return null;const {lk,no}=gState();
  return {all:D.ev,rows:D.ev.filter(g=>!lk[g.id]&&!no[g.id]).map(g=>({g,c:gCands(g)})).filter(r=>r.c.length).sort((a,b)=>a.g.d.localeCompare(b.g.d)),lk:D.ev.filter(g=>lk[g.id]).map(g=>({g,L:lk[g.id]})),no:D.ev.filter(g=>no[g.id]).map(g=>({g,N:no[g.id]}))}}
function vGdup(){const m=gMonth(),D=S.gcal[m];if(!D)setTimeout(gLoad,0);const R2=gRows(),dt=new Date(m+'T00:00:00');
  const head=`<h1>จับคู่นัด Google</h1><p class="lead">นัดที่ทีมพิมพ์เองใน Google (Tasks EN Team) ที่น่าจะเป็นงานเดียวกับงานในระบบ เช่น งานที่นำเข้าจาก Excel · ลิงก์แล้วปฏิทินใน Management จะแสดงนัดของ Team EN และซ่อนนัดที่ระบบสร้างจากข้อมูลเดิม</p>`;

  if(D==='busy'||!D)return head+`<section class="card"><h2>${nav}</h2><div class="empty">กำลังอ่านปฏิทิน Google…</div></section>`;
  if(D==='err')return head+`<section class="card"><h2>${nav}</h2><div class="empty">อ่านปฏิทิน Google ไม่ได้: ${esc(S.gerr||'')}<br><button class="btn g sm" data-greload style="margin-top:10px">ลองอีกครั้ง</button></div></section>`;
  const sure=R2.rows.filter(r=>gSure(r.c));

    <td><b>${esc(r.g.n)}</b>${r.g.by?`<br><small class="mut">${esc(r.g.by)}</small>`:''}</td>
    <td><select data-gsel="${esc(r.g.id)}" aria-label="งานในระบบ">${r.c.map(c=>`<option value="${esc(c.id)}" ${c.id===pick?'selected':''}>${gJobLab(c.j,c.ev)}</option>`).join('')}</select>${gSure(r.c)?' <span class="pill">มั่นใจ</span>':''}</td>
    <td style="text-align:right;white-space:nowrap"><button class="btn l sm" data-gno="${esc(r.g.id)}" ${S.busy?'disabled':''}>ไม่ใช่</button> <button class="btn g sm" data-glink="${esc(r.g.id)}" ${S.busy?'disabled':''}>ลิงก์</button></td></tr>`};
  return head+`<section class="card"><h2>${nav}<span class="sp"></span><span class="mut" style="font-size:14px;font-weight:500">นัดใน Google ${R2.all.length} · น่าจะซ้ำ ${R2.rows.length} · ลิงก์แล้ว ${R2.lk.length}</span>
     <button class="btn g sm" data-gsure ${!sure.length||S.busy?'disabled':''}>ลิงก์คู่ที่มั่นใจ (${sure.length})</button><button class="btn l sm" data-greload ${S.busy?'disabled':''}>โหลดใหม่</button></h2>
   ${R2.rows.length?`<table><thead><tr><th>วันที่</th><th>นัดใน Google</th><th>งานในระบบที่น่าจะใช่</th><th></th></tr></thead><tbody>${R2.rows.map(row).join('')}</tbody></table>`:'<div class="empty">เดือนนี้ไม่มีนัดที่น่าจะซ้ำแล้ว</div>'}
   <p class="note" style="margin:14px 0 0">ระบบหาคู่จากวันที่ทับกันกับชื่อลูกค้า ชื่อไซต์ หรือเลขที่ที่ตรงกัน · “มั่นใจ” = วันทับกันและชื่อตรงชัดเจน · ถ้าเปิดส่งนัดขึ้น Google อยู่ หลังลิงก์ทีละมาก ๆ ให้กด “ซิงก์ทั้งหมดตอนนี้” ใน Management เพื่อลบนัดซ้ำที่ระบบเคยส่งขึ้นไป</p></section>
   ${R2.lk.length?`<section class="card"><details><summary><b>ลิงก์แล้วเดือนนี้ (${R2.lk.length})</b></summary><table><tbody>${R2.lk.map(({g,L})=>`<tr><td class="mut" style="white-space:nowrap">${fd(g.d)}</td><td>${esc(g.n)}</td><td>${S.jobs[L.jobId]?gJobLab(S.jobs[L.jobId],gJobEv(S.jobs[L.jobId])):'<span class="mut">ไม่พบงาน</span>'}</td><td style="text-align:right"><button class="btn l sm" data-gundo="${esc(L.id)}">ยกเลิกลิงก์</button></td></tr>`).join('')}</tbody></table></details></section>`:''}
   ${R2.no.length?`<section class="card"><details><summary><b>ตอบว่า “ไม่ใช่” แล้ว (${R2.no.length})</b></summary><table><tbody>${R2.no.map(({g,N})=>`<tr><td class="mut" style="white-space:nowrap">${fd(g.d)}</td><td>${esc(g.n)}</td><td style="text-align:right"><button class="btn l sm" data-gundo="${esc(N.id)}">เอากลับมาจับคู่</button></td></tr>`).join('')}</tbody></table></details></section>`:''}`}
async function gLink(g,jobId){await S.db.doc('appts/gl'+gHash(g.id)).set({link:true,gid:g.id,jobId,gn:String(g.n||'').slice(0,200),gd:g.d,gend:g.end||g.d,createdAt:Date.now(),createdBy:S.me.id||null})}

  const cur=prDraft(),idOf=(L,k,v,pre)=>((L.find(x=>x[k]===v)||{}).id)||PRID(pre);
  const pkgs=[],bats=[],sets=[];let panel=null;const rates={};
  T.slice(2).forEach(r=>{r=r||[];
    if(r[1]&&r[4]!=null){const name=String(r[1]).trim(),t=tech[name]||{},m=String(r[3]||'').match(/\*\s*(\d+)/);

/* นำเข้าแคตตาล็อกจาก Excel (Catalog.xlsx: สินค้า ยี่ห้อ รุ่น เฟส กำลังผลิต Smart Meter CT หมายเหตุ) */
function catParse(rows){
  const hi=rows.findIndex(r=>(r||[]).some(c=>String(c??'').trim()==='สินค้า'));if(hi<0)throw new Error('ไม่พบหัวตาราง "สินค้า" ในไฟล์');
  const H=rows[hi].map(c=>String(c??'').trim());const col=t=>H.findIndex(x=>x===t);
  const C={cat:col('สินค้า'),brand:col('ยี่ห้อ'),model:col('รุ่น'),phase:col('เฟส'),pow:col('กำลังผลิต'),sm:H.findIndex(x=>/smart\s*meter/i.test(x)),ct:col('CT'),note:col('หมายเหตุ')};
  if(C.model<0)throw new Error('ไม่พบคอลัมน์ "รุ่น"');
  const v=(r,k)=>C[k]<0?'':String(r[C[k]]??'').trim();const out=[],bad=[];
  rows.slice(hi+1).forEach((r,i)=>{r=r||[];const t=v(r,'cat'),model=v(r,'model');if(!t||!model)return;
    const cat=/แผง|panel/i.test(t)?'SOLAR PANEL':/อินเวอร์เตอร์|inverter/i.test(t)?'INVERTER':/แบต|battery/i.test(t)?'BATTERY':'';
    if(!cat){bad.push(`แถว ${hi+i+2}: ไม่รู้จักประเภท "${t}"`);return}
    const d={category:cat,model,brand:v(r,'brand')};const pw=catNum(v(r,'pow'));
    if(cat==='INVERTER'){Object.assign(d,{kw:pw,phase:String(catNum(v(r,'phase'))||''),type:/hybrid/i.test(v(r,'note'))?'Hybrid':/on.?grid/i.test(v(r,'note'))?'On Grid':''});
      const smB=C.sm<0?'':String(r[C.sm]??'').trim(),smM=C.sm<0?'':String(r[C.sm+1]??'').trim();if(smM)d.meters=smM;if(v(r,'ct'))d.cts=v(r,'ct');if(smM)d.note=`Smart meter ${[smB,smM].filter(Boolean).join(' ')}${d.cts?' · CT '+d.cts:''}`}
    else if(cat==='BATTERY')d.kwh=pw;else d.watt=pw;
    Object.keys(d).forEach(k=>{if(d[k]===''||d[k]==null)delete d[k]});out.push(d)});
  return {out,bad};
}
async function catImport(file){
  let r;try{await loadXLSX();const wb=XLSX.read(await file.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];r=catParse(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null}))}catch(e){return toast('อ่านไฟล์ไม่ได้: '+(e.message||e),true)}
  const have=S.products,seen=new Set(),L=[];r.out.forEach(d=>{const id=pid(d.category,d.model);if(seen.has(id))return;seen.add(id);L.push({id,d,upd:!!have[id]})});
  if(!L.length)return toast('ไม่พบรุ่นในไฟล์',true);
  const nN=L.filter(x=>!x.upd).length,nU=L.length-nN;
  if(!await ask('นำเข้าแคตตาล็อก: '+file.name,`เพิ่มใหม่ <b>${nN}</b> รุ่น · อัปเดต <b>${nU}</b> รุ่น${r.bad.length?'<br><span style="color:var(--bad)">ข้าม '+r.bad.length+' แถว: '+esc(r.bad.slice(0,3).join(' · '))+'</span>':''}<br>รุ่นเดิมที่ไม่อยู่ในไฟล์จะไม่ถูกลบ`,'นำเข้า'))return;
  await run(async()=>{
    const one=x=>{const ref=S.db.doc('products/'+x.id),d={...x.d,updatedAt:Date.now()};return x.upd?ref.update(d):ref.set(d)};
    for(let i=0;i<L.length;i+=40){const part=L.slice(i,i+40);const b=S.db.batch();part.forEach(x=>{const ref=S.db.doc('products/'+x.id),d={...x.d,updatedAt:Date.now()};if(x.upd)b.update(ref,d);else b.set(ref,d)});
      try{await b.commit()}catch(e){if(e.code==='bad'&&/batch/.test(e.message||'')){for(const x of part)await one(x)}else throw e}} /* ตัวกลางรุ่นเก่า → ทีละรุ่น */
  },`นำเข้าแล้ว ${L.length} รุ่น`);
}

document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.pr&&t.tagName==='INPUT'){prSet(d.pr,t.value);const b=document.querySelector('.prbar');if(b){const on=prDirty(),err=prCheck(prDraft());b.classList.toggle('on',on);b.querySelector('[data-prsave]').disabled=!on||!!err.length||S.busy;b.querySelector('[data-prreset]').disabled=!on;const m=b.querySelector('.prerr,.mut');if(m){m.className=err.length?'prerr':'mut';m.textContent=err.length?err[0]+(err.length>1?` (อีก ${err.length-1} ข้อ)`:''):(on?'มีการแก้ไขที่ยังไม่บันทึก':'บันทึกแล้ว')}}return}
  const keep=(id,k)=>{S.edit[id]={...(S.edit[id]||{}),[k]:t.value}};
  if(d.pname)return keep(d.pname,'name');
  if(d.mname){keep(d.mname,'name');return softRender(t)}
  if(d.mphone){keep(d.mphone,'phone');return softRender(t)}
  if(t.id==='lq'){S.lq=t.value;S.llim=150;S.lpg=0;softRender(t)}
  if(t.id==='mmsg')S.mmsg=t.value;
  if(t.id==='dq'){S.dq=t.value;softRender(t)}
  if(t.id==='eqq'){S.eqq=t.value;softRender(t)}
});
// วาดใหม่โดยไม่เสียตำแหน่งเคอร์เซอร์
function softRender(el){const sel=el.selectionStart,key=[...el.attributes].filter(a=>a.name.startsWith('data-')||a.name==='id').map(a=>`[${a.name}="${a.value}"]`).join('');render();const n=document.querySelector(key);if(n){n.focus();try{n.setSelectionRange(sel,sel)}catch(x){}}}
async function loadBackups(){try{S.backups=(await S.db.call('backups')).list}catch(e){S.backups=[];toast(e.message,true)}render()}
async function loadHealth(quiet){const t1=performance.now();try{const h=await S.db.call('health');S.lat=Math.round(performance.now()-t1);S.health=h;S.sys=h.sys||{}}catch(e){if(!quiet)toast(e.message,true)}const a=document.activeElement;if(quiet&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.closest('main'))return;render()}

/* ---------- เริ่ม ---------- */
CLGDB.connect('console').then(({db,me})=>{
  S.db=db;S.me=me;$('#app').hidden=false;
  const live=(col)=>db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S[col]=o;if(col==='logs')pulseNew();
    const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.closest('main'))return; render()},e=>toast(e.message,true));
  live('members');live('joinreq');live('logs');live('forms');live('products');live('config');live('pricing');live('jobs');live('appts');live('customers');live('sites');
  render();loadHealth(true);loadBackups();
}).catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p style="padding:40px;text-align:center">${esc(e.message)}</p>`)});
</script>
</body>
