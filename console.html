<!doctype html>
<html lang="th">
<head>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEANLINE Console</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#15230f;--sub:#5b6656;--line:#e3e8da;--bg:#f2f5ec;--card:#fff;--acc:#4f9a12;--accS:#eef6e2;--bad:#c62828;--badS:#fdecec;--warn:#f0b23a;--warnS:#fff6e0;--r:18px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Noto Sans Thai Looped","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--ink);color:#e9efe1;padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:20px;letter-spacing:.5px;padding:0 10px}.brand small{display:block;font-weight:500;font-size:13px;color:#9acd3c;letter-spacing:0}
nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:10px;color:#cfd8c4;font-size:15px}
nav button:hover{background:rgba(255,255,255,.06)}nav button.on{background:#9acd3c;color:var(--ink);font-weight:600}
nav .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:20px;font-weight:600}
.me{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#b8c3ac}
.me b{display:block;color:#fff;font-size:14px}.me a,.me button{color:#9acd3c;background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:none;margin-right:12px}
main{padding:28px 36px;max-width:1200px;width:100%}
h1{font-size:26px;margin:0 0 4px}.lead{color:var(--sub);margin:0 0 22px}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 0 var(--line)}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;background:var(--accS);color:var(--acc)}
.pill.bad{background:var(--badS);color:var(--bad)}.pill.warn{background:var(--warnS);color:#8a5a00}.pill.gray{background:#eef0ea;color:var(--sub)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:13px;color:var(--sub);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}.who img,.av{width:34px;height:34px;border-radius:50%;background:var(--accS);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--acc)}
.who small{display:block;color:var(--sub);font-size:12.5px}
select,input[type=text],input[type=search],input[type=tel]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink);min-width:0}
input[type=text],input[type=tel]{width:150px}
.btn{font:inherit;font-size:14px;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--ink);color:#fff;white-space:nowrap}
.btn.l{background:#eef0ea;color:var(--ink)}.btn.g{background:var(--acc)}.btn.bad{background:var(--bad)}.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.empty{color:var(--sub);text-align:center;padding:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--bg);border-radius:14px;padding:14px}.stat b{display:block;font-size:24px}.stat span{color:var(--sub);font-size:13px}
.log td{font-size:14px;padding:8px 10px}.log .t{white-space:nowrap;color:var(--sub);font-size:13px}
.note{background:var(--warnS);border-radius:12px;padding:10px 14px;font-size:14px;color:#6b4800}
.ok{background:var(--accS);border-radius:12px;padding:10px 14px;font-size:14px;color:#2f6b0a}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}.switch input{display:none}
.switch i{width:48px;height:28px;border-radius:999px;background:#cfd6c6;position:relative;transition:.2s}.switch i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--bad)}.switch input:checked+i:after{left:23px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-size:14px;z-index:50;display:none}
#toast.bad{background:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(21,35,15,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal .bx{background:#fff;border-radius:22px;padding:24px;max-width:440px;width:92%;max-height:90vh;overflow:auto}#modal .bx.wide{max-width:680px}
.prc table input,.prc table select{width:100%;padding:6px 8px}.prc td{padding:4px 6px}.prg{display:grid;grid-template-columns:1fr 1fr;gap:18px}.prg .fg{grid-template-columns:1fr 1fr}
.prbar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);border-radius:var(--r);padding:12px 16px;box-shadow:0 -1px 0 var(--line),0 6px 20px rgba(0,0,0,.08)}.prbar.on{box-shadow:0 0 0 2px #93c5fd}.prerr{color:var(--bad);font-size:14px}
@media(max-width:900px){.prg{grid-template-columns:1fr}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}.fg input,.fg select,.fg textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}#modal h3{margin:0 0 8px}#modal p{color:var(--sub);margin:0 0 14px}
.mut{color:var(--sub);font-size:13px}a{color:var(--acc)}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside>
    <div class="brand">CLEANLINE<small>Console</small></div>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<div id="modal"><div class="bx" id="mbx"></div></div>
<script src="config.js"></script>
<script src="gdb.js"></script>
<script src="shared.js"></script>
<script>
'use strict';
const ROLE = {admin:'แอดมิน',dispatch:'หัวหน้าจัดงาน',lead:'หัวหน้าตรวจแบบ',eng:'วิศวกร',sales:'เซลส์'};
const ROLE_PAGE = {admin:'Management · ดูโฟลเดอร์',dispatch:'Management · ดูโฟลเดอร์',lead:'Man · แก้ไขโฟลเดอร์',eng:'Man · แก้ไขโฟลเดอร์',sales:'Management · เฉพาะงานที่ตัวเองแจ้ง'};
const SALES_TEAMS = ['EN','SA-D1','SA-D2','SA-D3','SA-D4','SA-D5','SA-DD','SA-DP'];
const QUEUE = [['regular','ประจำ'],['approval','ต้องขออนุมัติ'],['none','ไม่ลงคิว']];
const COLN = {jobs:'งาน',customers:'ลูกค้า',sites:'ไซต์',products:'สินค้า',members:'ผู้ใช้',services:'งานบริการ',messages:'ข้อความ',photos:'รูป',meters:'มิเตอร์',config:'ตั้งค่า',jobnos:'เลขใบงาน',forms:'แบบฟอร์ม',articles:'บทความ'};
const FN = {name:'ชื่อ',phone:'เบอร์',role:'บทบาท',team:'ทีม',status:'สถานะ',title:'ชื่องาน',stage:'ขั้นงาน',history:'ประวัติ',surveyTeam:'ทีมสำรวจ',surveyor:'ผู้สำรวจ',supervisor:'ผู้คุมงาน',installTeam:'ทีมติดตั้ง',jobNo:'เลขใบงาน',queueDate:'วันนัด',queueTime:'เวลานัด',installDate:'วันติดตั้ง',sv:'ขั้นย่อยสำรวจ',request:'ความต้องการลูกค้า',proposals:'ที่เสนอ',equipment:'อุปกรณ์ที่ติด',checkins:'เช็กอิน',file:'ไฟล์',text:'ข้อความ',kind:'ประเภท',folderId:'โฟลเดอร์',folderUrl:'โฟลเดอร์'};
const ACT = {new:'เพิ่ม',edit:'แก้ไข',del:'ลบ',login:'เข้าสู่ระบบ',import:'บันทึกรวด'};
const TABS = [['users','ผู้ใช้และสิทธิ์'],['docs','เอกสาร'],['cat','แคตตาล็อกสินค้า'],['price','ราคาวิเคราะห์โหลด'],['logs','บันทึกการใช้งาน'],['backup','สำรอง / กู้ข้อมูล'],['system','ระบบ']];
/* เอกสาร (แบบฟอร์ม) และแคตตาล็อก — ช่องเหมือนเว็บแอดมินเดิม */
const FMC=['งานสำรวจ','งานติดตั้ง','เอกสารขนานไฟฟ้า','ตรวจเช็ก / แจ้งซ่อม','อื่น ๆ'];
const FMF=[['code','รหัสแบบฟอร์ม','text',{ph:'เช่น FM-EN-028-A'}],['rev','ฉบับที่ / Rev.','text',{ph:'เช่น Rev.03'}],['name','ชื่อเอกสาร','text',{req:1,full:1}],['cat','หมวด','sel',FMC],['used','ใช้ตอนไหน','text',{ph:'เช่น ตอนเซลส์แจ้งงานสำรวจ'}],
  ['file','ลิงก์ไฟล์ หรือที่อยู่ไฟล์','text',{full:1,ph:'https://...  หรือ  \\\\192.168.200.249\\...'}],['note','หมายเหตุ','area',{full:1}]];
const LNK=[['img','ลิงก์รูปสินค้า','url',{full:1,ph:'https://... (ไม่ใส่ก็ได้)'}],['note','รายละเอียด','area',{full:1}],['datasheet','ลิงก์ Datasheet','url',{full:1,ph:'https://...'}],['manual','ลิงก์คู่มือ','url',{full:1}],['other','ลิงก์เอกสารอื่น','url',{full:1}]];
const EQT=[['INVERTER','อินเวอร์เตอร์'],['BATTERY','แบตเตอรี่'],['SOLAR PANEL','แผงโซลาร์']];
const EQF={
 'INVERTER':[['model','รุ่น','text',{req:1}],['brand','ยี่ห้อ','text'],['kw','กำลัง (kW)','number'],['phase','ประเภทไฟฟ้า (เฟส)','sel',['1','3']],['type','ประเภทระบบ','sel',['On Grid','Hybrid']],...LNK,
   ['meters','Smart meter ที่ใช้คู่ (คั่นด้วย ,)','text',{full:1,ph:'DDSU666, SDM120CT'}],['cts','CT ที่ใช้คู่ (คั่นด้วย ,)','text',{full:1,ph:'100/40mA, 100/5A'}]],
 'BATTERY':[['model','รุ่น','text',{req:1}],['brand','ยี่ห้อ','text'],['kwh','ความจุ (kWh)','number'],['volt','แรงดัน','sel',['LV','HV']],...LNK],
 'SOLAR PANEL':[['model','รุ่น','text',{req:1}],['brand','ยี่ห้อ','text'],['watt','กำลัง (W)','number'],['cell','ชนิดเซลล์','text'],...LNK]};
const eqSpec=p=>p.category==='INVERTER'?[p.kw?p.kw+' kW':'',p.phase?p.phase+' เฟส':'',p.type].filter(Boolean).join(' · '):p.category==='BATTERY'?[p.kwh?p.kwh+' kWh':'',p.volt].filter(Boolean).join(' · '):[p.watt?p.watt+' W':'',p.cell].filter(Boolean).join(' · ');
const S = {tab:'users', members:{}, joinreq:{}, logs:{}, forms:{}, products:{}, config:{}, pricing:{}, pd:null, eqc:'INVERTER', dq:'', eqq:'', me:null, db:null, health:null, backups:null, sys:{}, lq:'', lcol:'', lby:'', llim:150, edit:{}, busy:false, shares:null};
const fdt = ms => { if(!ms) return '-'; const d=new Date(ms); return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); };
const ini = n => (String(n||'?').trim()[0]||'?');
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className=bad?'bad':'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function ask(title,body,okText,danger,typed){
  return new Promise(res=>{
    $('#mbx').innerHTML=`<h3>${esc(title)}</h3><p>${body}</p>${typed?`<p style="margin:0 0 6px">พิมพ์ <b>${esc(typed)}</b> เพื่อยืนยัน</p><input type="text" id="mty" style="width:100%;margin-bottom:14px">`:''}
      <div class="row" style="justify-content:flex-end"><button class="btn l" id="mno">ยกเลิก</button><button class="btn ${danger?'bad':'g'}" id="mok" ${typed?'disabled':''}>${esc(okText)}</button></div>`;
    $('#modal').style.display='flex';
    const done=v=>{$('#modal').style.display='none';res(v)};
    $('#mno').onclick=()=>done(false);$('#mok').onclick=()=>done(true);
    if(typed){const i=$('#mty');i.focus();i.oninput=()=>$('#mok').disabled=i.value.trim()!==typed}
  });
}
async function run(fn,okMsg){
  if(S.busy) return; S.busy=true; render();
  try{const r=await fn(); if(okMsg) toast(okMsg); return r}
  catch(e){toast(e.message||'ทำไม่สำเร็จ',true)}
  finally{S.busy=false; render()}
}

/* ---------- หน้าจอ ---------- */
function render(){
  const pend=Object.keys(S.joinreq).length;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}${k==='users'&&pend?`<span class="n">${pend}</span>`:''}</button>`).join('');
  $('#me').innerHTML=`<b>${esc(S.me.name)}</b>${esc(S.me.email)}<div style="margin-top:8px"><a href="index.html">เปิด Management</a><button id="out">ออกจากระบบ</button></div>`;
  $('#main').innerHTML=({users:vUsers,docs:vDocs,cat:vCat,price:vPrice,logs:vLogs,backup:vBackup,system:vSystem})[S.tab]();
}
function memberRows(){return Object.entries(S.members).filter(([id])=>id!==S.me.id).map(([id,m])=>({id,...m})).sort((a,b)=>(a.status==='suspended')-(b.status==='suspended')||Object.keys(ROLE).indexOf(a.role)-Object.keys(ROLE).indexOf(b.role)||String(a.name).localeCompare(String(b.name),'th'))}
function who(m){return `<div class="who">${m.picture?`<img src="${esc(m.picture)}" alt="" onerror="this.outerHTML='<div class=av>${esc(ini(m.name))}</div>'">`:`<div class="av">${esc(ini(m.name||m.email))}</div>`}<div>${esc(m.name||'-')}<small>${esc(m.email||'')}</small></div></div>`}
function roleSel(id,v,attr){return `<select ${attr}="${id}"><option value="">— เลือกบทบาท —</option>${Object.entries(ROLE).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`}
function teamSel(id,v,attr,role,team){if(role==='sales')return `<select ${attr.replace('team','steam')}="${id}" aria-label="ทีมขาย"><option value="">— ทีมขาย —</option>${SALES_TEAMS.map(t=>`<option ${team===t?'selected':''}>${t}</option>`).join('')}</select>`;const need=role==='eng'||role==='lead';const cur=v||(role==='eng'?'regular':role==='lead'?'approval':'none');return `<select ${attr}="${id}" ${need?'':'disabled'}>${QUEUE.map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('')}</select>`}
function vUsers(){
  const pend=Object.entries(S.joinreq).map(([id,r])=>({id,...r})).sort((a,b)=>b.at-a.at);
  const mem=memberRows();
  const P=S.edit;
  return `<h1>ผู้ใช้และสิทธิ์</h1><p class="lead">อนุมัติ ตั้งบทบาท ระงับบัญชี · สิทธิ์โฟลเดอร์ Drive ปรับตามบทบาทอัตโนมัติ</p>
  <section class="card"><h2>รออนุมัติ ${pend.length?`<span class="pill bad">${pend.length}</span>`:''}</h2>
  ${pend.length?`<table><thead><tr><th>บัญชี Google</th><th>ขอเมื่อ</th><th>ชื่อที่แสดง</th><th>บทบาท</th><th>ลงคิวสำรวจ / ทีมขาย</th><th></th></tr></thead><tbody>
  ${pend.map(r=>{const e=P[r.id]||{};const role=e.role||'';return `<tr><td>${who(r)}</td><td class="mut">${fdt(r.at)}</td>
    <td><input type="text" data-pname="${r.id}" value="${esc(e.name??r.name??'')}"></td><td>${roleSel(r.id,role,'data-prole')}</td><td>${teamSel(r.id,e.queue||'','data-pteam',role,e.team||'')}</td>
    <td class="row" style="flex-wrap:nowrap"><button class="btn g sm" data-approve="${r.id}" ${role&&!S.busy?'':'disabled'}>อนุมัติ</button><button class="btn l sm" data-reject="${r.id}" ${S.busy?'disabled':''}>ไม่อนุมัติ</button></td></tr>`}).join('')}
  </tbody></table>`:`<div class="empty">ไม่มีคำขอใหม่</div>`}</section>
  <section class="card"><h2>ผู้ใช้ทั้งหมด <span class="pill gray">${mem.length} คน</span><span class="sp"></span><button class="btn l sm" data-shares ${S.busy?'disabled':''}>ตรวจสิทธิ์โฟลเดอร์ Drive</button></h2>
  ${S.shares?`<div class="ok" style="margin-bottom:12px">ตรวจแล้ว · เพิ่ม ${S.shares.added.length} · เปลี่ยน ${S.shares.changed.length} · ถอน ${S.shares.removed.length}${S.shares.removed.length?' ('+esc(S.shares.removed.join(', '))+')':''}</div>`:''}
  ${mem.length?`<table><thead><tr><th>ผู้ใช้</th><th>ชื่อที่แสดง</th><th>เบอร์</th><th>บทบาท</th><th>ลงคิวสำรวจ / ทีมขาย</th><th>ใช้หน้า / โฟลเดอร์</th><th></th></tr></thead><tbody>
  ${mem.map(m=>{const e=P[m.id]||{};const role=e.role??m.role;const sus=m.status==='suspended';const dirty=['name','phone','role','queue','team'].some(k=>k in e&&e[k]!==(m[k]||''));
    return `<tr style="${sus?'opacity:.55':''}"><td>${who(m)}</td>
    <td><input type="text" data-mname="${m.id}" value="${esc(e.name??m.name??'')}"></td><td><input type="tel" data-mphone="${m.id}" value="${esc(e.phone??m.phone??'')}" style="width:120px"></td>
    <td>${roleSel(m.id,role,'data-mrole')}</td><td>${teamSel(m.id,e.queue??m.queue??'','data-mteam',role,e.team??m.team??'')}</td>
    <td class="mut">${sus?'<span class="pill bad">ระงับอยู่</span>':esc(ROLE_PAGE[role]||'-')}</td>
    <td class="row" style="flex-wrap:nowrap;justify-content:flex-end">${dirty?`<button class="btn g sm" data-save="${m.id}" ${S.busy?'disabled':''}>บันทึก</button>`:''}
      <button class="btn l sm" data-sus="${m.id}" ${S.busy?'disabled':''}>${sus?'เปิดใช้':'ระงับ'}</button><button class="btn l sm" data-del="${m.id}" title="ลบผู้ใช้" ${S.busy?'disabled':''}>ลบ</button></td></tr>`}).join('')}
  </tbody></table>`:'<div class="empty">ยังไม่มีผู้ใช้</div>'}
  <p class="mut" style="margin:12px 0 0">ลงคิวสำรวจ: ประจำ = เลือกได้ตอนจองคิว · ต้องขออนุมัติ = แสดงสีเทา ขอใช้ได้ทีละงาน</p></section>`;
}
function vDocs(){
  const q=S.dq.trim().toLowerCase();
  const L=Object.entries(S.forms).map(([id,x])=>({id,...x})).filter(x=>!q||[x.code,x.name,x.cat,x.used,x.note].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>FMC.indexOf(a.cat)-FMC.indexOf(b.cat)||String(a.code||a.name).localeCompare(String(b.code||b.name),'th',{numeric:true}));
  return `<h1>เอกสาร</h1><p class="lead">แบบฟอร์มฉบับล่าสุด · Management ดูได้อย่างเดียว</p>

function prSet(path,val){const D=prDraft(),k=path.split('.');let o=D;for(let i=0;i<k.length-1;i++){o=o[k[i]]=o[k[i]]??{}}const last=k[k.length-1];

/* นำเข้าจากไฟล์รายงานการตรวจวัดโหลด 7.x: ชีต "ตั้งราคาสินค้า" (ราคา) + "ฐานข้อมูล" (Hybrid/เฟส/kW ของ Package) */
async function prImport(file){
  let wb;try{await loadXLSX();wb=XLSX.read(await file.arrayBuffer())}catch(e){return toast('อ่านไฟล์ไม่ได้: '+(e.message||e),true)}
  const sh=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null;
  const T=sh('ตั้งราคาสินค้า');if(!T)return toast('ไม่พบชีต "ตั้งราคาสินค้า" (ต้องเป็นไฟล์รายงานการตรวจวัดโหลด 7.x)',true);
  const DB=sh('ฐานข้อมูล')||[],tech={};DB.slice(1).forEach(r=>{if(r&&r[0])tech[String(r[0]).trim()]={hybrid:/hybrid/i.test(r[2]||''),phase:/1/.test(r[4]||'')?'1 เฟส':'3 เฟส',kw:+r[10]||parseFloat(r[3])||0,panels:+r[12]||0}});
  const H=T[1]||[],hx=t=>H.findIndex((h,i)=>String(h||'').trim()===t);
  const n=v=>{const x=parseFloat(String(v??'').replace(/,/g,''));return isFinite(x)?x:''};
  const cur=prDraft(),idOf=(L,k,v,pre)=>((L.find(x=>x[k]===v)||{}).id)||PRID(pre);
  const pkgs=[],bats=[],sets=[];let panel=null;const rates={};
  T.slice(2).forEach(r=>{r=r||[];
    if(r[1]&&r[4]!=null){const name=String(r[1]).trim(),t=tech[name]||{},m=String(r[3]||'').match(/\*\s*(\d+)/);
      pkgs.push({id:idOf(cur.packages,'name',name,'p'),name,inverter:String(r[2]||'').trim(),hybrid:t.hybrid??/pro/i.test(name),phase:t.phase||(/3P|3 เฟส/i.test(name)?'3 เฟส':'1 เฟส'),kw:t.kw||'',panels:m?+m[1]:(t.panels||''),price:n(r[4])})}
    if(r[7]&&r[9]!=null){const model=String(r[7]).trim();bats.push({id:idOf(cur.batteries,'model',model,'b'),model,kwh:n(String(r[8]||'').replace(/kwh/i,'')),price:n(r[9])})}
    if(!panel&&r[13]&&r[14]!=null)panel={brand:String(r[12]||'').trim(),model:String(r[13]).trim(),watt:n(r[14]),price:n(r[15]),install:n(r[16])};
    const lab=String(r[20]||'');if(/TOU/i.test(lab)){rates.onPeak=n(r[21]);rates.offPeak=n(r[22])}else if(/ทั่วไป|ปกติ/.test(lab))rates.normal=n(r[21]);
  });
  T.slice(2).forEach(r=>{r=r||[];if(r[24]&&r[25]&&r[26]!=null){const p=pkgs.find(x=>x.name===String(r[24]).trim()),b=bats.find(x=>x.model===String(r[25]).trim());if(p&&b)sets.push({pkgId:p.id,batId:b.id,price:n(r[26])})}});
  if(!pkgs.length)return toast('ไม่พบ Package ในชีต "ตั้งราคาสินค้า"',true);
  if(!await ask('นำเข้าราคาจาก '+file.name,`Package <b>${pkgs.length}</b> · แบต <b>${bats.length}</b> · ชุดคู่แบต <b>${sets.length}</b>${panel?' · แผง '+esc(panel.model):''}<br>จะแทนตารางที่แก้อยู่ ตรวจแล้วค่อยกด "บันทึกราคา"`,'นำเข้า'))return;
  S.pd={packages:pkgs,batteries:bats,panel:panel||cur.panel||{},rates:{...cur.rates,...rates},sets,source:file.name};render();toast('นำเข้าแล้ว · ตรวจแล้วกดบันทึกราคา');
}

      const miss=F.find(([k,,,op])=>op&&op.req&&!o[k]);if(miss){$('#ferr').textContent='ใส่ '+miss[1]+' ก่อน';return}
      const badUrl=F.find(([k,,t])=>t==='url'&&o[k]&&!/^(https?:\/\/|\\\\)/i.test(o[k]));if(badUrl){$('#ferr').textContent=badUrl[1]+' ต้องขึ้นต้นด้วย https://';return}
      done(o)};
  });

/* นำเข้าแคตตาล็อกจาก Excel (Catalog.xlsx: สินค้า ยี่ห้อ รุ่น เฟส กำลังผลิต Smart Meter CT หมายเหตุ) */
function catParse(rows){
  const hi=rows.findIndex(r=>(r||[]).some(c=>String(c??'').trim()==='สินค้า'));if(hi<0)throw new Error('ไม่พบหัวตาราง "สินค้า" ในไฟล์');
  const H=rows[hi].map(c=>String(c??'').trim());const col=t=>H.findIndex(x=>x===t);
  const C={cat:col('สินค้า'),brand:col('ยี่ห้อ'),model:col('รุ่น'),phase:col('เฟส'),pow:col('กำลังผลิต'),sm:H.findIndex(x=>/smart\s*meter/i.test(x)),ct:col('CT'),note:col('หมายเหตุ')};
  if(C.model<0)throw new Error('ไม่พบคอลัมน์ "รุ่น"');
  const v=(r,k)=>C[k]<0?'':String(r[C[k]]??'').trim();const out=[],bad=[];
  rows.slice(hi+1).forEach((r,i)=>{r=r||[];const t=v(r,'cat'),model=v(r,'model');if(!t||!model)return;
    const cat=/แผง|panel/i.test(t)?'SOLAR PANEL':/อินเวอร์เตอร์|inverter/i.test(t)?'INVERTER':/แบต|battery/i.test(t)?'BATTERY':'';
    if(!cat){bad.push(`แถว ${hi+i+2}: ไม่รู้จักประเภท "${t}"`);return}
    const d={category:cat,model,brand:v(r,'brand')};const pw=catNum(v(r,'pow'));
    if(cat==='INVERTER'){Object.assign(d,{kw:pw,phase:String(catNum(v(r,'phase'))||''),type:/hybrid/i.test(v(r,'note'))?'Hybrid':/on.?grid/i.test(v(r,'note'))?'On Grid':''});
      const smB=C.sm<0?'':String(r[C.sm]??'').trim(),smM=C.sm<0?'':String(r[C.sm+1]??'').trim();if(smM)d.meters=smM;if(v(r,'ct'))d.cts=v(r,'ct');if(smM)d.note=`Smart meter ${[smB,smM].filter(Boolean).join(' ')}${d.cts?' · CT '+d.cts:''}`}
    else if(cat==='BATTERY')d.kwh=pw;else d.watt=pw;
    Object.keys(d).forEach(k=>{if(d[k]===''||d[k]==null)delete d[k]});out.push(d)});
  return {out,bad};
}
async function catImport(file){
  let r;try{await loadXLSX();const wb=XLSX.read(await file.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];r=catParse(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null}))}catch(e){return toast('อ่านไฟล์ไม่ได้: '+(e.message||e),true)}
  const have=S.products,seen=new Set(),L=[];r.out.forEach(d=>{const id=pid(d.category,d.model);if(seen.has(id))return;seen.add(id);L.push({id,d,upd:!!have[id]})});
  if(!L.length)return toast('ไม่พบรุ่นในไฟล์',true);
  const nN=L.filter(x=>!x.upd).length,nU=L.length-nN;
  if(!await ask('นำเข้าแคตตาล็อก: '+file.name,`เพิ่มใหม่ <b>${nN}</b> รุ่น · อัปเดต <b>${nU}</b> รุ่น${r.bad.length?'<br><span style="color:var(--bad)">ข้าม '+r.bad.length+' แถว: '+esc(r.bad.slice(0,3).join(' · '))+'</span>':''}<br>รุ่นเดิมที่ไม่อยู่ในไฟล์จะไม่ถูกลบ`,'นำเข้า'))return;
  await run(async()=>{
    const one=x=>{const ref=S.db.doc('products/'+x.id),d={...x.d,updatedAt:Date.now()};return x.upd?ref.update(d):ref.set(d)};
    for(let i=0;i<L.length;i+=40){const part=L.slice(i,i+40);const b=S.db.batch();part.forEach(x=>{const ref=S.db.doc('products/'+x.id),d={...x.d,updatedAt:Date.now()};if(x.upd)b.update(ref,d);else b.set(ref,d)});
      try{await b.commit()}catch(e){if(e.code==='bad'&&/batch/.test(e.message||'')){for(const x of part)await one(x)}else throw e}} /* ตัวกลางรุ่นเก่า → ทีละรุ่น */
  },`นำเข้าแล้ว ${L.length} รุ่น`);
}

  if(d.pr){prSet(d.pr,t.value);render();return}
  if(t.id==='mt'){const on=t.checked,msg=$('#mmsg').value;
    if(on&&!await ask('ปิดปรับปรุงระบบ?','ทุกคนจะบันทึกอะไรไม่ได้จนกว่าคุณจะเปิดกลับ','ปิดปรับปรุง',true)){t.checked=false;return}
    await run(()=>S.db.call('setSys',{flags:{maintenance:on,msg}}).then(r=>S.sys=r.sys),on?'ปิดปรับปรุงแล้ว':'เปิดใช้งานปกติแล้ว');return}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.pr&&t.tagName==='INPUT'){prSet(d.pr,t.value);const b=document.querySelector('.prbar');if(b){const on=prDirty(),err=prCheck(prDraft());b.classList.toggle('on',on);b.querySelector('[data-prsave]').disabled=!on||!!err.length||S.busy;b.querySelector('[data-prreset]').disabled=!on;const m=b.querySelector('.prerr,.mut');if(m){m.className=err.length?'prerr':'mut';m.textContent=err.length?err[0]+(err.length>1?` (อีก ${err.length-1} ข้อ)`:''):(on?'มีการแก้ไขที่ยังไม่บันทึก':'บันทึกแล้ว')}}return}
  const keep=(id,k)=>{S.edit[id]={...(S.edit[id]||{}),[k]:t.value}};
  if(d.pname)return keep(d.pname,'name');
  if(d.mname){keep(d.mname,'name');return softRender(t)}
  if(d.mphone){keep(d.mphone,'phone');return softRender(t)}
  if(t.id==='lq'){S.lq=t.value;S.llim=150;softRender(t)}
  if(t.id==='mmsg')S.mmsg=t.value;
  if(t.id==='dq'){S.dq=t.value;softRender(t)}
  if(t.id==='eqq'){S.eqq=t.value;softRender(t)}
});
// วาดใหม่โดยไม่เสียตำแหน่งเคอร์เซอร์
function softRender(el){const sel=el.selectionStart,key=[...el.attributes].filter(a=>a.name.startsWith('data-')||a.name==='id').map(a=>`[${a.name}="${a.value}"]`).join('');render();const n=document.querySelector(key);if(n){n.focus();try{n.setSelectionRange(sel,sel)}catch(x){}}}
async function loadBackups(){try{S.backups=(await S.db.call('backups')).list}catch(e){S.backups=[];toast(e.message,true)}render()}
async function loadHealth(){try{const h=await S.db.call('health');S.health=h;S.sys=h.sys||{}}catch(e){toast(e.message,true)}render()}

/* ---------- เริ่ม ---------- */
CLGDB.connect('console').then(({db,me})=>{
  S.db=db;S.me=me;$('#app').hidden=false;
  const live=(col)=>db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]=x.data());S[col]=o;
    const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.closest('main'))return; render()},e=>toast(e.message,true));
  live('members');live('joinreq');live('logs');live('forms');live('products');live('config');live('pricing');
  render();
}).catch(e=>{document.body.insertAdjacentHTML('beforeend',`<p style="padding:40px;text-align:center">${esc(e.message)}</p>`)});
</script>
</body>
